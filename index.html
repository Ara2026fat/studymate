<style>
/* ============================================================
   B. DESIGN SYSTEM — tokens, exactly as Phase Four Section T
   ============================================================ */
:root{
  --footer-h:37px;
  /* color — dark, luxurious base shared by both companions */
  --background:#0D1119;
  --surface:#1A2030;
  --surface-glass:rgba(255,255,255,.055);
  --ink:#F1F3F8;
  --ink-muted:#9AA5B8;
  --accent:#C98A2E;
  --accent-rgb:201,138,46;
  --accent-soft:rgba(201,138,46,.16);
  --attention:#E89478;
  --attention-rgb:232,148,120;
  --attention-soft:rgba(232,148,120,.14);
  --line:rgba(255,255,255,.09);

  /* type scale (px) */
  --fs-display:28px;
  --fs-heading:20px;
  --fs-subheading:17px;
  --fs-body:15px;
  --fs-caption:13px;

  /* spacing scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;

  /* radius */
  --r-sm:8px; --r-md:14px; --r-lg:20px;

  /* motion */
  --m-micro:180ms; --m-transition:300ms; --m-reflective:450ms;
  --ease:cubic-bezier(.25,.8,.35,1);

  --shadow-card:0 1px 0 rgba(255,255,255,.04) inset, 0 4px 16px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);

  --font-ar:'Cairo', sans-serif;
  --font-en:'Inter', sans-serif;
  --lh-ar:1.6;
  --lh-en:1.4;
}

/* رفيق تعلم — clarity, ambition, the academic path, achievement.
   Cooler background, confident focused blue, sharper corners, snappier motion. */
body[data-companion="male"]{
  --background:#0A0E17;
  --surface:#161C2C;
  --surface-glass:rgba(120,160,220,.06);
  --accent:#5B93E0;
  --accent-rgb:91,147,224;
  --accent-soft:rgba(91,147,224,.16);
  --r-sm:7px; --r-md:12px; --r-lg:18px;
  --m-micro:160ms; --m-transition:260ms;
}

/* رفيقة تعلم — calm, comfort, support, companionship on the journey.
   Warmer background, soft rose-gold, rounder corners, gentler motion. */
body[data-companion="female"]{
  --background:#170F1A;
  --surface:#241A2A;
  --surface-glass:rgba(224,169,178,.06);
  --accent:#D9A15E;
  --accent-rgb:217,161,94;
  --accent-soft:rgba(217,161,94,.16);
  --r-sm:11px; --r-md:19px; --r-lg:27px;
  --m-micro:210ms; --m-transition:340ms;
}

/* Optional manual appearance override — color only. Corner radius and motion
   character stay tied to the رفيق/رفيقة companion choice either way; only
   the color story changes here. */
body[data-theme="night"]{
  --background:#0B0E14; --surface:#161C28; --surface-glass:rgba(107,155,209,.06);
  --accent:#6B9BD1; --accent-rgb:107,155,209; --accent-soft:rgba(107,155,209,.16);
}
body[data-theme="obsidian"]{
  --background:#0D0B08; --surface:#1E1912; --surface-glass:rgba(201,151,77,.06);
  --accent:#C9974D; --accent-rgb:201,151,77; --accent-soft:rgba(201,151,77,.16);
}
body[data-theme="petrol"]{
  --background:#081815; --surface:#132824; --surface-glass:rgba(63,184,168,.06);
  --accent:#3FB8A8; --accent-rgb:63,184,168; --accent-soft:rgba(63,184,168,.16);
}
body[data-theme="plum"]{
  --background:#180A14; --surface:#281423; --surface-glass:rgba(212,107,148,.06);
  --accent:#D46B94; --accent-rgb:212,107,148; --accent-soft:rgba(212,107,148,.16);
}
body[data-theme="royal"]{
  --background:#070B1C; --surface:#131A34; --surface-glass:rgba(76,126,240,.06);
  --accent:#4C7EF0; --accent-rgb:76,126,240; --accent-soft:rgba(76,126,240,.16);
}
body[data-theme="forest"]{
  --background:#0A120A; --surface:#162115; --surface-glass:rgba(156,173,94,.06);
  --accent:#9CAD5E; --accent-rgb:156,173,94; --accent-soft:rgba(156,173,94,.16);
}
body[data-theme="sandy"]{
  --background:#170F09; --surface:#271C10; --surface-glass:rgba(217,161,94,.06);
  --accent:#D9A15E; --accent-rgb:217,161,94; --accent-soft:rgba(217,161,94,.16);
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  background:var(--background);
  color:var(--ink);
  font-family:var(--font-ar);
  line-height:var(--lh-ar);
  font-size:var(--fs-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html[lang="en"] body{ font-family:var(--font-en); line-height:var(--lh-en); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; }
a{ color:inherit; text-decoration:none; }
ul,ol{ list-style:none; }

.type-display{ font-size:var(--fs-display); font-weight:600; }
.type-body{ font-size:var(--fs-body); font-weight:400; }
.type-caption{ font-size:var(--fs-caption); font-weight:400; color:var(--ink-muted); }

/* ---------- App shell ---------- */
#app{ min-height:100vh; min-height:100dvh; max-width:480px; margin:0 auto; position:relative; }

#creditFooter{
  position:fixed; bottom:0; left:0; right:0; z-index:55;
  max-width:480px; margin:0 auto;
  background:var(--surface); border-top:1px solid var(--line);
  padding:4px var(--sp-3) calc(4px + env(safe-area-inset-bottom));
  text-align:center; font-size:9px; line-height:1.35; color:var(--ink-muted);
}
.screen{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  padding-bottom:calc(72px + var(--footer-h) + env(safe-area-inset-bottom));
  animation:fadeIn var(--m-transition) var(--ease);
}
.screen.no-tabbar{ padding-bottom:calc(var(--sp-5) + var(--footer-h)); }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(8px) scale(.99); } to{ opacity:1; transform:translateY(0) scale(1); } }
@keyframes celebrateIn{ 0%{ opacity:0; transform:scale(.5) rotate(-8deg); } 60%{ opacity:1; transform:scale(1.08) rotate(2deg); } 100%{ transform:scale(1) rotate(0); } }
.celebrate-icon{ animation:celebrateIn 550ms var(--ease-spring); }

/* ---------- C. Screen template zones ---------- */
.screen-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--sp-5) var(--sp-4) var(--sp-3);
}
.screen-header-title{ font-size:var(--fs-heading); font-weight:600; flex:1; min-width:0; overflow-wrap:break-word; }
.screen-header-sub{ font-size:var(--fs-caption); color:var(--ink-muted); margin-top:2px; }

.screen-content{ flex:1; min-width:0; padding:0 var(--sp-4); }

.screen-action{
  position:sticky; bottom:var(--footer-h); padding:var(--sp-4); background:linear-gradient(to top, var(--background) 65%, transparent);
}

/* ---------- D. Components ---------- */

/* Buttons */
.btn{
  display:flex; align-items:center; justify-content:center; gap:var(--sp-2);
  width:100%; padding:14px var(--sp-4); border-radius:999px;
  font-size:var(--fs-body); font-weight:600;
  transition:transform 200ms var(--ease-spring), opacity var(--m-micro), box-shadow 200ms var(--ease);
}
.btn:active{ transform:scale(.97); }
.btn-primary{
  background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 82%, white), var(--accent));
  color:#1A1305;
  box-shadow:0 2px 8px rgba(var(--accent-rgb),.35), 0 10px 24px rgba(var(--accent-rgb),.28);
}
.btn-primary:active{ box-shadow:0 1px 3px rgba(var(--accent-rgb),.3); }
.btn-primary:disabled{ opacity:.35; box-shadow:none; }
.btn-secondary{ background:transparent; color:var(--ink-muted); font-weight:500; }
.btn-icon{
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-muted);
  transition:background var(--m-micro), transform var(--m-micro) var(--ease);
}
.btn-icon:active{ background:var(--line); transform:scale(.92); }

/* Card */
.card{
  display:flex; align-items:center; gap:var(--sp-3); width:100%; text-align:start;
  background:var(--surface);
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-md); box-shadow:var(--shadow-card);
  padding:var(--sp-3) var(--sp-4);
  transition:transform 220ms var(--ease-spring), box-shadow 220ms var(--ease);
}
.card:active{ transform:scale(.975); box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 3px rgba(0,0,0,.3); }
.card-icon{
  width:42px; height:42px; border-radius:var(--r-sm); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(150deg, rgba(var(--accent-rgb),.24), rgba(var(--accent-rgb),.10));
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -1px 3px rgba(var(--accent-rgb),.12), 0 3px 8px rgba(var(--accent-rgb),.18);
  color:var(--accent);
}
.card-body{ flex:1; min-width:0; }
.card-title{ display:block; font-size:var(--fs-subheading); font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-meta{ display:block; font-size:var(--fs-caption); color:var(--ink-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-chevron{ color:var(--ink-muted); flex-shrink:0; opacity:.6; }

/* List row (lighter than card) */
.list-row{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-1);
  border-bottom:1px solid var(--line);
}
.list-row:last-child{ border-bottom:none; }

/* Status pill */
.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-size:var(--fs-caption); font-weight:600;
  padding:4px 10px; border-radius:999px; white-space:nowrap;
}
.pill-attention{ background:var(--attention-soft); color:var(--attention); }

/* Learning Skills */
.skill-entry-card{
  display:flex; align-items:center; gap:var(--sp-3); width:100%; text-align:start;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4); margin-top:var(--sp-5);
}
.skill-grid{
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--sp-2);
}
.skill-grid > *{ animation:fadeIn 380ms var(--ease) backwards; }
.skill-grid > *:nth-child(1){ animation-delay:0ms; }
.skill-grid > *:nth-child(2){ animation-delay:30ms; }
.skill-grid > *:nth-child(3){ animation-delay:60ms; }
.skill-grid > *:nth-child(4){ animation-delay:90ms; }
.skill-grid > *:nth-child(5){ animation-delay:120ms; }
.skill-grid > *:nth-child(6){ animation-delay:150ms; }

.skill-tile{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
  background:var(--surface);
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-md); box-shadow:var(--shadow-card);
  padding:var(--sp-3) 6px; min-height:96px; justify-content:center;
  transition:transform 220ms var(--ease-spring), box-shadow 220ms var(--ease);
}
.skill-tile:active{ transform:scale(.96); box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 3px rgba(0,0,0,.3); }
.skill-tile-icon{
  width:32px; height:32px; border-radius:var(--r-sm); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(150deg, rgba(var(--accent-rgb),.24), rgba(var(--accent-rgb),.10));
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -1px 2px rgba(var(--accent-rgb),.12), 0 2px 6px rgba(var(--accent-rgb),.16);
  color:var(--accent);
}
.skill-tile-title{ font-size:11.5px; font-weight:600; color:var(--ink); line-height:1.3; }
.segmented{
  display:flex; background:var(--surface); border:1px solid rgba(255,255,255,.06); border-radius:999px; padding:3px; margin-bottom:var(--sp-4);
}
.segmented-btn{
  flex:1; padding:9px var(--sp-3); border-radius:999px; font-size:var(--fs-caption); font-weight:600; color:var(--ink-muted);
  transition:background 220ms var(--ease-spring), color 220ms var(--ease), box-shadow 220ms var(--ease);
}
.segmented-active{ background:rgba(var(--accent-rgb),.18); color:var(--ink); box-shadow:var(--shadow-card); }
.theme-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); margin-top:var(--sp-2); }
.theme-swatch{
  display:flex; flex-direction:column; gap:6px; padding:var(--sp-2);
  border-radius:var(--r-md); border:1.5px solid transparent;
  transition:border-color 200ms var(--ease), transform 200ms var(--ease-spring);
}
.theme-swatch:active{ transform:scale(.97); }
.theme-swatch-active{ border-color:var(--accent); background:rgba(var(--accent-rgb),.08); }
.theme-swatch-preview{ display:block; width:100%; height:36px; border-radius:var(--r-sm); border:1px solid rgba(255,255,255,.1); }
.theme-swatch-label{ font-size:var(--fs-caption); font-weight:600; color:var(--ink); text-align:center; }
.callout{
  background:var(--surface); border:1px solid rgba(255,255,255,.06);
  border-radius:var(--r-md);
  padding:var(--sp-4); margin-bottom:var(--sp-4);
}
.callout-label{ font-size:var(--fs-caption); font-weight:700; color:var(--ink-muted); margin-bottom:var(--sp-2); }
.tip-list{ display:flex; flex-direction:column; gap:var(--sp-2); }
.tip-row{ display:flex; align-items:flex-start; gap:var(--sp-2); }
.tip-row-current{ background:var(--accent-soft); margin:0 calc(-1 * var(--sp-2)); padding:var(--sp-2); border-radius:var(--r-sm); }
.tip-bullet{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:8px; }
.waypoint-marker{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--accent);
  border:2px solid var(--accent); background:transparent;
  transition:box-shadow 220ms var(--ease);
}
.waypoint-marker-current{
  background:radial-gradient(circle at 35% 30%, #E3A94F, var(--accent) 70%);
  color:#fff; border-color:transparent;
  box-shadow:0 0 0 4px rgba(var(--accent-rgb),.15), 0 2px 8px rgba(var(--accent-rgb),.35);
}

/* Input field */
.field-label{ display:block; font-size:var(--fs-caption); font-weight:600; color:var(--ink); margin-bottom:var(--sp-2); }
.field{
  width:100%; padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:var(--fs-body);
  transition:border-color var(--m-micro);
}
.field:focus{ outline:none; border-color:var(--accent); }
.field-error{ font-size:var(--fs-caption); color:var(--attention); margin-top:var(--sp-2); display:none; }
.field-error.show{ display:block; }
.field-group{ margin-bottom:var(--sp-4); }

/* Picker trigger — looks like a field, opens a Sheet with a selectable list */
.picker-trigger{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);
  padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:var(--fs-body); text-align:start;
  transition:border-color var(--m-micro);
}
.picker-trigger:disabled{ opacity:.5; }
.picker-value{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.picker-value.placeholder{ color:var(--ink-muted); }
.picker-chevron{ color:var(--ink-muted); flex-shrink:0; }

.picker-search-wrap{ margin-bottom:var(--sp-3); }
.picker-list{ max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:var(--sp-2); }
.picker-option{
  width:100%; text-align:start; padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); font-size:var(--fs-body); color:var(--ink);
  transition:border-color var(--m-micro), background var(--m-micro);
}
.picker-option.selected{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); font-weight:600; }
.picker-option.other-option{ color:var(--ink-muted); }

/* Sheet */
.sheet-overlay{
  position:fixed; inset:0; z-index:90;
  display:flex; align-items:flex-end; justify-content:center;
  background:rgba(26,35,51,.4);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  opacity:0; transition:opacity var(--m-transition) var(--ease);
}
.sheet-overlay.show{ opacity:1; }
.sheet{
  width:100%; max-width:480px; background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--sp-2) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform var(--m-transition) var(--ease);
  max-height:88vh; overflow-y:auto;
}
.sheet-overlay.show .sheet{ transform:translateY(0); }
.sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--line); margin:var(--sp-2) auto var(--sp-4); }
.sheet-title{ font-size:var(--fs-heading); font-weight:600; margin-bottom:var(--sp-4); }

/* Tab bar */
.tab-bar{
  position:fixed; bottom:var(--footer-h); left:0; right:0; z-index:50;
  max-width:480px; margin:0 auto;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
  border-top:1px solid rgba(228,230,234,.8);
  padding:var(--sp-2) var(--sp-2) var(--sp-2);
  display:flex;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tab-bar{ background:var(--surface); }
}
.tab-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:var(--sp-2); border-radius:var(--r-sm); color:var(--ink-muted);
  transition:color var(--m-micro), transform 200ms var(--ease-spring), background 220ms var(--ease);
}
.tab-item:active{ transform:scale(.94); }
.tab-item.active{ color:var(--accent); background:rgba(var(--accent-rgb),.10); }
.tab-label{ font-size:11px; font-weight:600; }

/* Empty state */
.empty-state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:var(--sp-7) var(--sp-5); color:var(--ink-muted); flex:1; justify-content:center;
}
.empty-icon{
  width:56px; height:56px; border-radius:var(--r-md); background:var(--surface);
  border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 8px rgba(0,0,0,.25);
  display:flex; align-items:center; justify-content:center; color:var(--ink-muted);
  margin-bottom:var(--sp-4);
}
.empty-title{ font-size:var(--fs-subheading); font-weight:600; color:var(--ink); margin-bottom:var(--sp-2); }
.empty-text{ font-size:var(--fs-body); line-height:1.55; max-width:280px; }

/* Hero (Today) */
.hero{
  background:linear-gradient(160deg, rgba(var(--accent-rgb),.14), var(--surface-glass) 60%);
  -webkit-backdrop-filter:blur(24px) saturate(150%); backdrop-filter:blur(24px) saturate(150%);
  border:1px solid rgba(var(--accent-rgb),.18);
  border-radius:var(--r-lg); box-shadow:var(--shadow-card);
  padding:var(--sp-5) var(--sp-4); margin-bottom:var(--sp-4);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .hero{ background:linear-gradient(160deg, rgba(var(--accent-rgb),.14), var(--surface) 60%); }
}
.hero-eyebrow{ font-size:var(--fs-caption); color:var(--ink-muted); font-weight:600; margin-bottom:var(--sp-1); }
.hero-title{ font-size:var(--fs-display); font-weight:600; margin-bottom:var(--sp-1); }
.hero-sub{ font-size:var(--fs-body); color:var(--ink-muted); margin-bottom:var(--sp-4); }

.section-label{ font-size:var(--fs-caption); font-weight:600; color:var(--ink-muted); margin:0 0 var(--sp-3); }

/* Reflection — the one screen allowed to move slower, deliberately */
.pace-reflective{ animation-duration:var(--m-reflective); }
.pace-reflective textarea.field{ line-height:1.6; }

/* utility */
.stack{ display:flex; flex-direction:column; gap:var(--sp-3); }
.stack > *{ animation:fadeIn 380ms var(--ease) backwards; }
.stack > *:nth-child(1){ animation-delay:0ms; }
.stack > *:nth-child(2){ animation-delay:35ms; }
.stack > *:nth-child(3){ animation-delay:70ms; }
.stack > *:nth-child(4){ animation-delay:105ms; }
.stack > *:nth-child(n+5){ animation-delay:140ms; }
.hidden{ display:none !important; }

function catalogKeyFor(student){
  if(!student) return null;
  return `${student.universityId}-${student.collegeId}-${student.majorId}`;
}
/* Current level's courses first (the common case), then every other level's
   courses after — so a retaken course from an earlier level is still one
   search away, without slowing down the normal, far more frequent case. */
function coursesForStudentAllLevels(student, currentLevelLabel){
  const catalog = COURSE_CATALOG[catalogKeyFor(student)];
  if(!catalog) return null;
  const currentLevelId = levelIdForLabel(currentLevelLabel);
  const ordered = [];
  if(currentLevelId && catalog[currentLevelId]) ordered.push(...catalog[currentLevelId]);
  LEVELS.forEach(lv=>{
    if(lv.id===currentLevelId) return;
    if(catalog[lv.id]) ordered.push(...catalog[lv.id]);
  });
  return ordered;
}

/* ============================================================
   D. STORAGE LAYER — single on-device source of truth (offline-first)
   ============================================================ */
const DB_KEY = "studymate_p5_v1";
const DB_VERSION = 1;
function emptyDB(){
  return { version:DB_VERSION, students:{}, journeys:{}, semesters:{}, courses:{}, academicEvents:{}, reflections:{}, achievements:{}, terms:{} };
}
let DB = null;
function dbLoad(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      DB = JSON.parse(raw);
      if(DB && DB.version){
        const blank = emptyDB();
        Object.keys(blank).forEach(t=>{ if(!DB[t]) DB[t] = blank[t]; });
        return;
      }
    }
  }catch(e){}
  DB = emptyDB();
}
function dbSave(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function genId(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function dbInsert(table, rec){ DB[table][rec.id]=rec; dbSave(); return rec; }
function dbUpdate(table, id, patch){ const r=DB[table][id]; if(!r) return null; Object.assign(r,patch); dbSave(); return r; }
function dbDelete(table, id){ delete DB[table][id]; dbSave(); }
function dbGet(table, id){ return id ? (DB[table][id]||null) : null; }
function dbAll(table){ return Object.values(DB[table]); }
function dbQuery(table, pred){ return dbAll(table).filter(pred); }

/* ============================================================
   ENTITY MODULES — one module per Product Design entity
   ============================================================ */

/* ---- Student (absorbs Academic Profile, per revised model) ---- */
const StudentModule = {
  current(){ return dbAll("students")[0] || null; },
  create(data){
    const rec = dbInsert("students", {
      id:genId(), lang:data.lang||"ar", companion:data.companion||"male",
      university:data.university, universityId:data.universityId||null,
      college:data.college, collegeId:data.collegeId||null,
      major:data.major, majorId:data.majorId||null, level:data.level,
      theme:null,
      createdAt:Date.now()
    });
    return rec;
  },
  update(data){
    const s = this.current();
    if(s) dbUpdate("students", s.id, { university:data.university, universityId:data.universityId||null, college:data.college, collegeId:data.collegeId||null, major:data.major, majorId:data.majorId||null, level:data.level });
  },
  updateLang(lang){
    const s = this.current();
    if(s) dbUpdate("students", s.id, { lang });
  },
  updateCompanion(companion){
    const s = this.current();
    if(s) dbUpdate("students", s.id, { companion });
  },
  updateTheme(theme){
    const s = this.current();
    if(s) dbUpdate("students", s.id, { theme });
  }
};

/* ---- Academic Journey — the continuous container ---- */
const JourneyModule = {
  ensureFor(studentId){
    let j = dbQuery("journeys", j=>j.studentId===studentId)[0];
    if(!j) j = dbInsert("journeys", { id:genId(), studentId, createdAt:Date.now() });
    return j;
  },
  forStudent(studentId){ return dbQuery("journeys", j=>j.studentId===studentId)[0] || null; }
};

/* ---- Semester ---- */
function nextLevelLabel(currentLabel){
  const idx = LEVELS.findIndex(l=> l.ar===currentLabel || l.en===currentLabel);
  if(idx===-1 || idx===LEVELS.length-1) return currentLabel;
  return LEVELS[idx+1][lang()];
}
function levelIdForLabel(label){
  const found = LEVELS.find(l=> l.ar===label || l.en===label);
  return found ? found.id : null;
}
const SemesterModule = {
  createFirst(journeyId, label){
    return dbInsert("semesters", { id:genId(), journeyId, index:1, label, status:"current", createdAt:Date.now() });
  },
  current(journeyId){ return dbQuery("semesters", s=>s.journeyId===journeyId && s.status==="current")[0] || null; },
  listForJourney(journeyId){ return dbQuery("semesters", s=>s.journeyId===journeyId).sort((a,b)=>a.index-b.index); },
  complete(semesterId){ dbUpdate("semesters", semesterId, { status:"done" }); },
  /* closes the current semester and opens the next one — the moment the Academic Journey carries forward */
  startNext(journeyId, currentSemester){
    this.complete(currentSemester.id);
    const newLabel = nextLevelLabel(currentSemester.label);
    return dbInsert("semesters", { id:genId(), journeyId, index:currentSemester.index+1, label:newLabel, status:"current", createdAt:Date.now() });
  }
};

/* ---- Course ---- */
const CourseModule = {
  create(semesterId, data){
    return dbInsert("courses", { id:genId(), semesterId, name:data.name, professor:data.professor||"", createdAt:Date.now() });
  },
  update(id, data){ return dbUpdate("courses", id, { name:data.name, professor:data.professor||"" }); },
  listForSemester(semesterId){ return dbQuery("courses", c=>c.semesterId===semesterId).sort((a,b)=>a.createdAt-b.createdAt); },
  get(id){ return dbGet("courses", id); },
  delete(id){
    dbQuery("academicEvents", e=>e.courseId===id).forEach(e=>dbDelete("academicEvents", e.id));
    dbDelete("courses", id);
  }
};

/* ---- Academic Event (merges Assessment + Academic Event, per revised model) ----
   Attaches to a Course, OR directly to a Semester when the event isn't
   course-specific (e.g. a registration deadline) — per the approved
   backbone amendment. Exactly one of courseId/semesterId is set. */
const AcademicEventModule = {
  create(owner, data){
    return dbInsert("academicEvents", {
      id:genId(), courseId: owner.courseId||null, semesterId: owner.semesterId||null,
      title:data.title, date:data.date||"",
      isEvaluative: !!data.isEvaluative, createdAt:Date.now()
    });
  },
  update(id, data){
    return dbUpdate("academicEvents", id, { title:data.title, date:data.date||"", isEvaluative: !!data.isEvaluative });
  },
  delete(id){ dbDelete("academicEvents", id); },
  get(id){ return dbGet("academicEvents", id); },
  listForCourse(courseId){ return dbQuery("academicEvents", e=>e.courseId===courseId).sort((a,b)=>(a.date||"").localeCompare(b.date||"")); },
  listForCourses(courseIds){ return dbQuery("academicEvents", e=>courseIds.indexOf(e.courseId)!==-1); },
  /* semester-level events only (not tied to any course) */
  listForSemesterDirect(semesterId){ return dbQuery("academicEvents", e=>e.semesterId===semesterId && !e.courseId).sort((a,b)=>(a.date||"").localeCompare(b.date||"")); },
  /* everything Guidance needs to consider for a semester: its own events + every course's events */
  listAllForGuidance(semesterId, courseIds){
    return dbQuery("academicEvents", e => e.semesterId===semesterId || courseIds.indexOf(e.courseId)!==-1);
  }
};
/* Whether an event's date has already passed — a fact of the calendar, not
   something the student manages by hand. Undated events are never "past". */
function isEventPast(event){
  if(!event.date) return false;
  const d = daysUntil(event.date);
  return d !== null && d < 0;
}

/* ---- Reflection ---- */
const ReflectionModule = {
  forSemester(semesterId){ return dbQuery("reflections", r=>r.semesterId===semesterId)[0] || null; },
  create(semesterId, text){ return dbInsert("reflections", { id:genId(), semesterId, text, createdAt:Date.now() }); }
};

/* ---- Achievement ---- */
const AchievementModule = {
  listForJourney(journeyId){ return dbQuery("achievements", a=>a.journeyId===journeyId).sort((a,b)=>b.earnedAt-a.earnedAt); },
  create(journeyId, type, label){ return dbInsert("achievements", { id:genId(), journeyId, type, label, earnedAt:Date.now() }); }
};

/* ---- Term (personal glossary) — a running collection the student builds
   themselves. No dates, no priorities, no done/not-done status: this is
   deliberately not a task list, just a growing record of what they've learned. */
const TermModule = {
  list(){ return dbAll("terms").sort((a,b)=>b.createdAt-a.createdAt); },
  create(text, note){ return dbInsert("terms", { id:genId(), text, note:note||"", createdAt:Date.now() }); },
  update(id, data){ return dbUpdate("terms", id, { text:data.text, note:data.note||"" }); },
  delete(id){ dbDelete("terms", id); },
  get(id){ return dbGet("terms", id); }
};

/* ============================================================
   REMINDER ENGINE — deterministic, computed fresh, never stored
   ============================================================ */
function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
const ReminderEngine = {
  /* the single nearest event within a near-term window —
     considers both course events and semester-level events */
  nearest(semesterId, courseIds){
    const events = AcademicEventModule.listAllForGuidance(semesterId, courseIds).filter(e=>e.date);
    const withDays = events.map(e=>({ event:e, days:daysUntil(e.date) })).filter(x=>x.days!==null && x.days>=0 && x.days<=7);
    withDays.sort((a,b)=> a.days-b.days || (b.event.isEvaluative?1:0)-(a.event.isEvaluative?1:0));
    return withDays[0] || null;
  }
};

/* ============================================================
   RECOMMENDATION ENGINE — local heuristic, computed, offline
   ============================================================ */
const RecommendationEngine = {
  /* notices only genuine clustering; returns null rather than forcing a note */
  cluster(semesterId, courseIds){
    const events = AcademicEventModule.listAllForGuidance(semesterId, courseIds).filter(e=>e.date);
    const withDays = events.map(e=>({ event:e, days:daysUntil(e.date) })).filter(x=>x.days!==null && x.days>=0 && x.days<=7);
    if(withDays.length < 2) return null;
    return { count: withDays.length };
  }
};

/* ============================================================
   Reusable Picker Sheet — one component powering every
   University/College/Major/Level selection, per Simplicity First
   (reuse one mechanism rather than building four).
   ============================================================ */
function openPickerSheet({ title, options, selectedId, searchable, showOther, onSelect }){
  const s = t();
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  const optsHtml = options.map(o=>`<button type="button" class="picker-option ${selectedId===o.id?'selected':''}" data-val="${o.id}">${lang()==='ar'?o.ar:o.en}</button>`).join("");
  const otherHtml = showOther ? `<button type="button" class="picker-option other-option ${selectedId===OTHER_ID?'selected':''}" data-val="${OTHER_ID}">${s.otherOption}</button>` : "";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${title}</div>
      ${searchable ? `<div class="picker-search-wrap"><input type="text" class="field" id="pickerSearch" placeholder="${s.searchPh}" autocomplete="off"></div>` : ""}
      <div class="picker-list" id="pickerList">${optsHtml}${otherHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ overlay.classList.add("show"); }); });

  function close(after){
    overlay.classList.remove("show");
    setTimeout(()=>{ overlay.remove(); if(after) after(); }, 300);
  }
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) close(); });

  const search = overlay.querySelector("#pickerSearch");
  if(search){
    search.addEventListener("click", e=>e.stopPropagation());
    search.addEventListener("input", ()=>{
      const q = search.value.trim().toLowerCase();
      overlay.querySelectorAll(".picker-option").forEach(btn=>{
        btn.style.display = btn.textContent.trim().toLowerCase().includes(q) ? "" : "none";
      });
    });
  }
  overlay.querySelectorAll(".picker-option").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const val = btn.dataset.val;
      close(()=>{ onSelect(val); });
    });
  });
}

}

function renderOnboarding(){
  applyDir();
  const s = t();
  const obDraft = { companion:"", universityId:"", university:"", collegeId:"", college:"", majorId:"", major:"", levelId:"", level:"" };

  app.innerHTML = `
    <section class="screen no-tabbar">
      <div class="screen-header" style="display:block; padding-top:var(--sp-6)">
        <div class="type-display">${s.onboardTitle}</div>
        <p class="type-body" style="color:var(--ink-muted); margin-top:6px;">${s.onboardSub}</p>
      </div>
      <div class="screen-content stack">
        <div class="field-group">
          <span class="field-label">${s.companionSectionLabel}</span>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn btn-secondary" id="obCompanionMale" style="flex:1;">${s.companionMaleLabel}</button>
            <button type="button" class="btn btn-secondary" id="obCompanionFemale" style="flex:1;">${s.companionFemaleLabel}</button>
          </div>
          <p class="field-error" id="obCompanionError">${s.companionRequired}</p>
        </div>
        ${buildProfilePickerFields("ob", s)}
      </div>
      <div class="screen-action">
        <button type="button" class="btn btn-primary" id="obStart">${s.startBtn}</button>
      </div>
    </section>
  `;

  wireProfilePickers("ob", obDraft);

  const maleBtn = document.getElementById("obCompanionMale");
  const femaleBtn = document.getElementById("obCompanionFemale");
  function refreshCompanionUI(){
    maleBtn.classList.toggle("btn-primary", obDraft.companion==="male");
    maleBtn.classList.toggle("btn-secondary", obDraft.companion!=="male");
    femaleBtn.classList.toggle("btn-primary", obDraft.companion==="female");
    femaleBtn.classList.toggle("btn-secondary", obDraft.companion!=="female");
  }
  maleBtn.addEventListener("click", ()=>{ obDraft.companion="male"; document.getElementById("obCompanionError").classList.remove("show"); refreshCompanionUI(); });
  femaleBtn.addEventListener("click", ()=>{ obDraft.companion="female"; document.getElementById("obCompanionError").classList.remove("show"); refreshCompanionUI(); });

  document.getElementById("obStart").addEventListener("click", ()=>{
    let valid = validateProfileDraft("ob", obDraft);
    if(!obDraft.companion){ document.getElementById("obCompanionError").classList.add("show"); valid = false; }
    if(!valid) return;

    const student = StudentModule.create({
      lang: lang(), companion:obDraft.companion, university:obDraft.university, universityId:obDraft.universityId, college:obDraft.college, collegeId:obDraft.collegeId, major:obDraft.major, majorId:obDraft.majorId, level:obDraft.level
    });
    const journey = JourneyModule.ensureFor(student.id);
    SemesterModule.createFirst(journey.id, obDraft.level || LEVELS[0][lang()]);

    activeTab = "today";
    const flagMsg = flagshipMessage(student);
    if(flagMsg) showFlagshipMoment(flagMsg, ()=>renderToday());
    else renderToday();
  });
}

/* ============================================================
   STAGE 6: TODAY (Dashboard) — one hero zone, at most one secondary zone
   ============================================================ */
function renderToday(){
  applyDir();
  const s = t();
  const student = StudentModule.current();
  const journey = JourneyModule.forStudent(student.id);
  const semester = SemesterModule.current(journey.id);
  const courses = semester ? CourseModule.listForSemester(semester.id) : [];
  const courseIds = courses.map(c=>c.id);

  const rec = semester ? RecommendationEngine.cluster(semester.id, courseIds) : null;
  const reminder = (rec || !semester) ? null : ReminderEngine.nearest(semester.id, courseIds);

  let secondaryHtml = "";
  if(rec){
    secondaryHtml = `
      <div class="section-label">${s.recommendationLabel}</div>
      <div class="card" style="cursor:default;">
        <span class="card-icon">${ICON.compass}</span>
        <span class="card-body">
          <span class="card-title">${s.clusterObservation(rec.count)}</span>
        </span>
      </div>`;
  } else if(reminder){
    const daysLabel = reminder.days===0 ? (lang()==='ar'?'اليوم':'Today') : reminder.days===1 ? (lang()==='ar'?'غدًا':'Tomorrow') : (lang()==='ar'?`خلال ${reminder.days} أيام`:`In ${reminder.days} days`);
    const course = reminder.event.courseId ? CourseModule.get(reminder.event.courseId) : null;
    const titleText = course ? `${escapeHtml(reminder.event.title)} — ${escapeHtml(course.name)}` : escapeHtml(reminder.event.title);
    secondaryHtml = `
      <div class="section-label">${s.reminderLabel}</div>
      <button type="button" class="card" id="reminderCard" ${course?`data-course-id="${course.id}"`:''}>
        <span class="card-icon">${ICON.bell}</span>
        <span class="card-body">
          <span class="card-title">${titleText}</span>
          <span class="card-meta">${daysLabel}</span>
        </span>
        <span class="card-chevron">${chevronFwd()}</span>
      </button>`;
  }

  app.innerHTML = `
    <section class="screen">
      <div class="screen-header">
        <div>
          <div class="screen-header-title">${student.companion==='female' ? s.companionFemaleLabel : s.companionMaleLabel}</div>
          <div class="screen-header-sub">${s.todayGreeting}</div>
        </div>
        <button type="button" class="btn-icon" id="settingsBtn" aria-label="${s.settingsBtn}">${ICON.settings}</button>
      </div>
      <div class="screen-content">
        <div class="hero">
          <div class="hero-eyebrow">${s.todayEyebrow}</div>
          <div class="hero-title">${semester ? escapeHtml(semester.label) : s.todayNoSemester}</div>
          <div class="hero-sub">${escapeHtml(student.major)}${student.university? ' · '+escapeHtml(student.university):''}</div>
          <div class="type-caption">${s.coursesCount(courses.length)}</div>
        </div>

        ${secondaryHtml || (courses.length ? `
          <div class="empty-state" style="padding:${'var(--sp-6)'} var(--sp-4);">
            <div class="empty-icon">${ICON.compass}</div>
            <div class="empty-title">${s.todayEmptyTitle}</div>
            <p class="empty-text">${s.todayEmptyText}</p>
          </div>` : `
          <div class="empty-state">
            <div class="empty-icon">${ICON.book}</div>
            <div class="empty-title">${s.semesterEmptyTitle}</div>
            <p class="empty-text">${s.semesterEmptyText}</p>
            <button type="button" class="btn btn-primary" id="todayAddCourse" style="margin-top:var(--sp-4); max-width:240px;">${s.addFirstCourse}</button>
            ${semester && semester.index > 1 ? `<button type="button" class="type-caption" id="newSemesterHint" style="margin-top:var(--sp-4); text-decoration:underline; background:none; border:none;">${s.newSemesterHint}</button>` : ""}
          </div>`)}
      </div>
      ${renderTabBar("today")}
    </section>
  `;
  wireTabBar();
  document.getElementById("settingsBtn").addEventListener("click", ()=>{ renderSettings(); });
  const addBtn = document.getElementById("todayAddCourse");
  if(addBtn) addBtn.addEventListener("click", ()=>{ activeTab="semester"; openCourseSheet(semester.id, null, renderToday); });
  const reminderCard = document.getElementById("reminderCard");
  if(reminderCard){
    reminderCard.addEventListener("click", ()=>{
      const cid = reminderCard.dataset.courseId;
      if(cid) renderCourseView(cid);
    });
  }
  const hintBtn = document.getElementById("newSemesterHint");
  if(hintBtn) hintBtn.addEventListener("click", ()=>{ activeTab="journey"; renderJourney(); });
}

/* ============================================================
   STAGE 7: SEMESTER — scannable course list, one progress indicator
   ============================================================ */
function renderSemester(){
  applyDir();
  const s = t();
  const student = StudentModule.current();
  const journey = JourneyModule.forStudent(student.id);
  const semester = SemesterModule.current(journey.id);
  const courses = semester ? CourseModule.listForSemester(semester.id) : [];
  const semesterEvents = semester ? AcademicEventModule.listForSemesterDirect(semester.id) : [];

  const semesterEventsHtml = semester ? `
    <div class="section-label" style="display:flex; align-items:center; justify-content:space-between; margin-top:0;">
      <span>${s.semesterEventsLabel}</span>
      <button type="button" class="btn-icon" id="addSemesterEventBtn" aria-label="${s.addEventBtn}" style="width:30px; height:30px;">${ICON.plus}</button>
    </div>
    ${semesterEvents.length ? `<div class="stack" style="margin-bottom:var(--sp-5);">${semesterEvents.map(e=>{
      const past = isEventPast(e);
      return `
      <button type="button" class="card" data-semester-event-id="${e.id}">
        <span class="card-icon">${ICON.event}</span>
        <span class="card-body">
          <span class="card-title" style="${past?'color:var(--ink-muted);':''}">${escapeHtml(e.title)}</span>
          <span class="card-meta">${e.date ? (past ? s.eventPastLabel : formatEventDate(e.date, s)) : ""}</span>
        </span>
      </button>`;
    }).join("")}</div>`
    : `<p class="type-caption" style="margin-bottom:var(--sp-5);">${s.semesterEventsEmpty}</p>`}
  ` : "";

  const bodyHtml = courses.length === 0
    ? `<div class="empty-state">
        <div class="empty-icon">${ICON.book}</div>
        <div class="empty-title">${s.semesterEmptyTitle}</div>
        <p class="empty-text">${s.semesterEmptyText}</p>
      </div>`
    : `<div class="stack">${courses.map(c=>{
        const evs = AcademicEventModule.listForCourse(c.id);
        const nextEv = evs.filter(e=>e.date && !isEventPast(e)).sort((a,b)=>a.date.localeCompare(b.date))[0];
        return `
        <button type="button" class="card" data-course-id="${c.id}">
          <span class="card-icon">${ICON.book}</span>
          <span class="card-body">
            <span class="card-title">${escapeHtml(c.name)}</span>
            ${nextEv ? `<span class="card-meta">${escapeHtml(nextEv.title)}</span>` : ""}
          </span>
          <span class="card-chevron">${chevronFwd()}</span>
        </button>`;
      }).join("")}</div>`;

  app.innerHTML = `
    <section class="screen">
      <div class="screen-header">
        <div>
          <div class="screen-header-title">${s.semesterTitle}</div>
          ${semester ? `<div class="screen-header-sub">${escapeHtml(semester.label)}</div>` : ""}
        </div>
        ${semester ? `<button type="button" class="btn-icon" id="addCourseBtn" aria-label="${s.addCourseBtn}">${ICON.plus}</button>` : ""}
      </div>
      <div class="screen-content">
        ${semesterEventsHtml}
        <div class="section-label">${s.coursesLabel}</div>
        ${bodyHtml}
        ${semester ? `<button type="button" class="btn btn-secondary" id="endSemesterBtn" style="margin-top:var(--sp-5);">${s.endSemesterAction}</button>` : ""}
      </div>
      ${renderTabBar("semester")}
    </section>
  `;
  wireTabBar();
  const addBtn = document.getElementById("addCourseBtn");
  if(addBtn) addBtn.addEventListener("click", ()=>{ openCourseSheet(semester.id, null, renderSemester); });
  document.querySelectorAll("[data-course-id]").forEach(card=>{
    card.addEventListener("click", ()=>{ renderCourseView(card.dataset.courseId); });
  });
  const addSemEvBtn = document.getElementById("addSemesterEventBtn");
  if(addSemEvBtn) addSemEvBtn.addEventListener("click", ()=>{ openEventSheet({semesterId:semester.id}, null, renderSemester); });
  document.querySelectorAll("[data-semester-event-id]").forEach(card=>{
    card.addEventListener("click", ()=>{ openEventSheet({semesterId:semester.id}, AcademicEventModule.get(card.dataset.semesterEventId), renderSemester); });
  });
  const endBtn = document.getElementById("endSemesterBtn");
  if(endBtn) endBtn.addEventListener("click", ()=>{ openEndSemesterConfirm(semester); });
}

/* ============================================================
   COURSE VIEW — everything specific to one course; its own
   Academic Events lead the screen (Phase 4, Section S).
   ============================================================ */
function renderCourseView(courseId){
  applyDir();
  const s = t();
  const course = CourseModule.get(courseId);
  if(!course){ renderSemester(); return; }
  const events = AcademicEventModule.listForCourse(courseId);

  const bodyHtml = events.length === 0
    ? `<div class="empty-state">
        <div class="empty-icon">${ICON.event}</div>
        <div class="empty-title">${s.courseEmptyTitle}</div>
        <p class="empty-text">${s.courseEmptyText}</p>
      </div>`
    : `<div class="stack">${events.map(e=>{
        const past = isEventPast(e);
        const daysLabel = e.date ? (past ? s.eventPastLabel : formatEventDate(e.date, s)) : "";
        return `
        <button type="button" class="card" data-event-id="${e.id}">

function formatEventDate(dateStr, s){
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((target-today)/86400000);
  if(diff < 0) return lang()==='ar' ? "متأخر" : "Overdue";
  if(diff === 0) return lang()==='ar' ? "اليوم" : "Today";
  if(diff === 1) return lang()==='ar' ? "غدًا" : "Tomorrow";
  return lang()==='ar' ? `خلال ${diff} أيام` : `In ${diff} days`;
}

   LEARNING SKILLS — hub + detail. Its own top-level tab, since
   it's used far more often day-to-day than the Journey archive.
   ============================================================ */
function skillAppliesToStudent(skill, student){
  if(!skill.scope || skill.scope.type==="universal") return true;
  if(skill.scope.type==="college"){
    if(!student || !student.collegeId || skill.scope.collegeIds.indexOf(student.collegeId)===-1) return false;
    if(skill.scope.majorIds && !(student.majorId && skill.scope.majorIds.indexOf(student.majorId)!==-1)) return false;
    if(skill.scope.universityIds && !(student.universityId && skill.scope.universityIds.indexOf(student.universityId)!==-1)) return false;
    return true;
  }
  return true;
}
function skillTile(sk, l){
  return `
    <button type="button" class="skill-tile" data-skill-id="${sk.id}">
      <span class="skill-tile-icon">${ICON[sk.icon]}</span>
      <span class="skill-tile-title">${escapeHtml(sk.title[l])}</span>
    </button>`;
}

  applyDir();

  const student = StudentModule.current();
  const universalSkills = SKILLS.filter(sk=> !sk.scope || sk.scope.type==="universal");
  const specificSkills = SKILLS.filter(sk=> sk.scope && sk.scope.type!=="universal" && skillAppliesToStudent(sk, student));
  const hasSpecific = specificSkills.length > 0;
  if(!hasSpecific) skillsHubTab = "universal";
  const activeSkills = skillsHubTab==="specific" ? specificSkills : universalSkills;

  app.innerHTML = `

  applyDir();
  const s = t();
  const semester = dbGet("semesters", semesterId);

  app.innerHTML = `
    <section class="screen no-tabbar pace-reflective">
      <div class="screen-content" style="padding-top:var(--sp-7);">
        <div class="hero-eyebrow">${s.reflectionEyebrow}</div>
        <div class="type-display" style="margin-bottom:var(--sp-3);">${s.reflectionTitle}</div>
        <p class="type-body" style="color:var(--ink-muted); margin-bottom:var(--sp-5); line-height:1.6;">${s.reflectionPrompt}</p>
        <textarea class="field" id="reflectionText" rows="6" placeholder="${s.reflectionPh}" style="resize:none; min-height:160px;"></textarea>
      </div>
      <div class="screen-action">
        <button type="button" class="btn btn-primary" id="reflectionSave">${s.reflectionSave}</button>
      </div>
    </section>
  `;
  document.getElementById("reflectionSave").addEventListener("click", ()=>{
    const text = document.getElementById("reflectionText").value.trim();
    ReflectionModule.create(semesterId, text);

    const student = StudentModule.current();
    const journey = JourneyModule.forStudent(student.id);
    const upcomingLevel = nextLevelLabel(semester.label);
    const milestone = trackMilestoneMessage(student, upcomingLevel);
    let achievement;
    if(milestone) achievement = AchievementModule.create(journey.id, "track_milestone", milestone);
    else if(semester.index === 1) achievement = AchievementModule.create(journey.id, "first_semester", s.milestoneFirstSemester);
    else achievement = AchievementModule.create(journey.id, "semester_completed", s.achievementCompleted(semester.label));
    SemesterModule.startNext(journey.id, semester);

    activeTab = "today";
    showAchievementMoment(achievement, ()=>renderToday());
  });
}

/* Real, researched turning points in each flagship program — celebrated as a
   genuine milestone rather than the routine "semester completed" note. */
function trackMilestoneMessage(student, upcomingLevelLabel){
  const s = t();
  const upcomingId = levelIdForLabel(upcomingLevelLabel);
  if(!upcomingId) return null;
  if(student.universityId==="jazan" && student.collegeId==="cs" && upcomingId==="l5") return s.milestoneJazanCS;
  if(student.universityId==="jazan" && student.collegeId==="cs" && upcomingId==="l9") return s.milestoneJazanCSGradProject;
  if(student.universityId==="iau" && student.collegeId==="arts" && student.majorId==="arts-0" && upcomingId==="l3") return s.milestoneIauTranslation;
  if(student.universityId==="jazan" && student.collegeId==="eng" && student.majorId==="eng-2" && upcomingId==="l5") return s.milestoneJazanME;
  return null;
}

/* A genuine, calm acknowledgment of a real milestone — shown once, at the
   moment it's actually earned, then dismissed. Not a badge collection. */
function showAchievementMoment(achievement, onDone){
  const s = t();
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.innerHTML = `
    <div class="sheet" style="text-align:center; padding-top:var(--sp-6);">
      <div class="empty-icon celebrate-icon" style="margin:0 auto var(--sp-4); width:72px; height:72px; color:var(--accent); background:linear-gradient(150deg, rgba(var(--accent-rgb),.28), rgba(var(--accent-rgb),.08)); border:1px solid rgba(255,255,255,.6); box-shadow:inset 0 1px 1px rgba(255,255,255,.7), 0 6px 16px rgba(var(--accent-rgb),.28);">${ICON.laurel}</div>
      <div class="sheet-title" style="text-align:center;">${s.achievementCelebrateTitle}</div>
      <p class="type-body" style="color:var(--ink-muted); margin-bottom:var(--sp-5);">${escapeHtml(achievement.label)}</p>
      <button type="button" class="btn btn-primary" id="achievementContinue">${s.continueLabel}</button>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ overlay.classList.add("show"); }); });
  function close(after){ overlay.classList.remove("show"); setTimeout(()=>{ overlay.remove(); if(after) after(); }, 300); }
  overlay.querySelector("#achievementContinue").addEventListener("click", ()=>close(onDone));
}

/* ============================================================
   SETTINGS — reached via the Today header icon; reuses the exact
   same profile pickers as Onboarding (no duplicate logic).
   ============================================================ */
function renderSettings(){
  applyDir();
  const s = t();
  const student = StudentModule.current();
  const setDraft = {
    universityId:student.universityId||"", university:student.university, collegeId:student.collegeId||"", college:student.college,
    majorId:student.majorId||"", major:student.major, levelId:"", level:student.level
  };

  app.innerHTML = `
    <section class="screen no-tabbar">
      <div class="screen-header">
        <button type="button" class="btn-icon" id="settingsBack" aria-label="Back">${chevronBack()}</button>
        <div class="screen-header-title">${s.settingsTitle}</div>
        <span style="width:40px;"></span>
      </div>
      <div class="screen-content">
        <div class="field-group">
          <span class="field-label">${s.languageLabel}</span>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn ${student.lang==='ar'?'btn-primary':'btn-secondary'}" id="langAr" style="flex:1;">العربية</button>
            <button type="button" class="btn ${student.lang==='en'?'btn-primary':'btn-secondary'}" id="langEn" style="flex:1;">English</button>
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">${s.companionSectionLabel}</span>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn ${student.companion==='male'?'btn-primary':'btn-secondary'}" id="companionMale" style="flex:1;">${s.companionMaleLabel}</button>
            <button type="button" class="btn ${student.companion==='female'?'btn-primary':'btn-secondary'}" id="companionFemale" style="flex:1;">${s.companionFemaleLabel}</button>
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">${s.appearanceLabel}</span>
          <div class="theme-grid">
            <button type="button" class="theme-swatch ${!student.theme?'theme-swatch-active':''}" data-theme-id="">
              <span class="theme-swatch-preview" style="background:linear-gradient(120deg, var(--background), var(--accent));"></span>
              <span class="theme-swatch-label">${s.themeDefaultLabel}</span>
            </button>
            ${THEMES.map(th=>`
              <button type="button" class="theme-swatch ${student.theme===th.id?'theme-swatch-active':''}" data-theme-id="${th.id}">
                <span class="theme-swatch-preview" style="background:linear-gradient(120deg, ${th.bg}, ${th.accent});"></span>
                <span class="theme-swatch-label">${th[lang()]}</span>
              </button>
            `).join("")}
          </div>
        </div>
        <div class="section-label" style="margin-top:var(--sp-5);">${s.editProfileLabel}</div>
        ${buildProfilePickerFields("set", s)}
        <button type="button" class="btn btn-primary" id="setSave" style="margin-top:var(--sp-2);">${s.saveChangesBtn}</button>
        <button type="button" class="btn btn-secondary" id="resetBtn" style="color:var(--attention); margin-top:var(--sp-5);">${s.resetLabel}</button>
      </div>
    </section>
  `;
  document.getElementById("settingsBack").addEventListener("click", ()=>{ renderToday(); });
  document.getElementById("langAr").addEventListener("click", ()=>{ StudentModule.updateLang("ar"); renderSettings(); });
  document.getElementById("langEn").addEventListener("click", ()=>{ StudentModule.updateLang("en"); renderSettings(); });
  document.getElementById("companionMale").addEventListener("click", ()=>{ StudentModule.updateCompanion("male"); renderSettings(); });
  document.getElementById("companionFemale").addEventListener("click", ()=>{ StudentModule.updateCompanion("female"); renderSettings(); });
  document.querySelectorAll(".theme-swatch").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      StudentModule.updateTheme(btn.dataset.themeId || null);
      renderSettings();
    });
  });

  wireProfilePickers("set", setDraft);
  refreshProfilePickerUI("set", setDraft);

  document.getElementById("setSave").addEventListener("click", ()=>{
    if(!validateProfileDraft("set", setDraft)) return;
    StudentModule.update(setDraft);
    renderToday();
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    showConfirmSheet({
      title:s.resetConfirmTitle, text:s.resetConfirmText, confirmLabel:s.confirmDelete, danger:true,
      onConfirm:()=>{
        DB = emptyDB();
        dbSave();
        activeTab = "today";
        boot();
      }
    });
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  dbLoad();
  const student = StudentModule.current();
  if(student){
    if(!student.companion) dbUpdate("students", student.id, { companion:"male" }); // pre-existing records default silently; visible/editable in Settings
    applyDir();
    renderToday();
  }
  else{ applyDir(); renderWelcome(); }
}
boot();

})();
</script>
</body>
