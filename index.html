<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   B. DESIGN SYSTEM — tokens, exactly as Phase Four Section T
   ============================================================ */
:root{
  /* color */
  --background:#F4F5F7;
  --surface:#FFFFFF;
  --ink:#1A2333;
  --ink-muted:#5B6472;
  --accent:#C98A2E;
  --accent-soft:#F6E9D3;
  --attention:#C97452;
  --attention-soft:#F7E7DF;
  --line:#E4E6EA;

  /* type scale (px) */
  --fs-display:28px;
  --fs-heading:20px;
  --fs-subheading:17px;
  --fs-body:15px;
  --fs-caption:13px;

  /* spacing scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;

  /* radius */
  --r-sm:8px; --r-md:14px; --r-lg:20px;

  /* motion */
  --m-micro:180ms; --m-transition:300ms; --m-reflective:450ms;
  --ease:cubic-bezier(.25,.8,.35,1);

  --shadow-card:0 1px 2px rgba(26,35,51,.04), 0 6px 18px -10px rgba(26,35,51,.12);

  --font-ar:'Cairo', sans-serif;
  --font-en:'Inter', sans-serif;
  --lh-ar:1.6;
  --lh-en:1.4;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  background:var(--background);
  color:var(--ink);
  font-family:var(--font-ar);
  line-height:var(--lh-ar);
  font-size:var(--fs-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html[lang="en"] body{ font-family:var(--font-en); line-height:var(--lh-en); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; }
a{ color:inherit; text-decoration:none; }
ul,ol{ list-style:none; }

.type-display{ font-size:var(--fs-display); font-weight:600; }
.type-body{ font-size:var(--fs-body); font-weight:400; }
.type-caption{ font-size:var(--fs-caption); font-weight:400; color:var(--ink-muted); }

/* ---------- App shell ---------- */
#app{ min-height:100vh; min-height:100dvh; max-width:480px; margin:0 auto; position:relative; }

.screen{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  animation:fadeIn var(--m-transition) var(--ease);
}
.screen.no-tabbar{ padding-bottom:var(--sp-5); }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

/* ---------- C. Screen template zones ---------- */
.screen-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--sp-5) var(--sp-4) var(--sp-3);
}
.screen-header-title{ font-size:var(--fs-heading); font-weight:600; flex:1; min-width:0; overflow-wrap:break-word; }
.screen-header-sub{ font-size:var(--fs-caption); color:var(--ink-muted); margin-top:2px; }

.screen-content{ flex:1; padding:0 var(--sp-4); }

.screen-action{
  position:sticky; bottom:0; padding:var(--sp-4); background:linear-gradient(to top, var(--background) 65%, transparent);
}

/* ---------- D. Components ---------- */

/* Buttons */
.btn{
  display:flex; align-items:center; justify-content:center; gap:var(--sp-2);
  width:100%; padding:14px var(--sp-4); border-radius:999px;
  font-size:var(--fs-body); font-weight:600;
  transition:transform var(--m-micro) var(--ease), opacity var(--m-micro);
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--ink); color:var(--surface); }
.btn-primary:disabled{ opacity:.4; }
.btn-secondary{ background:transparent; color:var(--ink-muted); font-weight:500; }
.btn-icon{
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-muted);
  transition:background var(--m-micro), transform var(--m-micro) var(--ease);
}
.btn-icon:active{ background:var(--line); transform:scale(.92); }

/* Card */
.card{
  display:flex; align-items:center; gap:var(--sp-3); width:100%; text-align:start;
  background:var(--surface); border-radius:var(--r-md); box-shadow:var(--shadow-card);
  padding:var(--sp-3) var(--sp-4);
  transition:transform var(--m-micro) var(--ease);
}
.card:active{ transform:scale(.985); }
.card-icon{
  width:42px; height:42px; border-radius:var(--r-sm); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent-soft); color:var(--accent);
}
.card-body{ flex:1; min-width:0; }
.card-title{ font-size:var(--fs-subheading); font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-meta{ font-size:var(--fs-caption); color:var(--ink-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-chevron{ color:var(--ink-muted); flex-shrink:0; opacity:.6; }

/* List row (lighter than card) */
.list-row{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-1);
  border-bottom:1px solid var(--line);
}
.list-row:last-child{ border-bottom:none; }

/* Status pill */
.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-size:var(--fs-caption); font-weight:600;
  padding:4px 10px; border-radius:999px; white-space:nowrap;
}
.pill-attention{ background:var(--attention-soft); color:var(--attention); }

/* Learning Skills */
.skill-entry-card{
  display:flex; align-items:center; gap:var(--sp-3); width:100%; text-align:start;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4); margin-top:var(--sp-5);
}
.callout{
  background:var(--background); border-radius:var(--r-md);
  padding:var(--sp-4); margin-bottom:var(--sp-4);
}
.callout-label{ font-size:var(--fs-caption); font-weight:700; color:var(--ink-muted); margin-bottom:var(--sp-2); }
.tip-list{ display:flex; flex-direction:column; gap:var(--sp-2); }
.tip-row{ display:flex; align-items:flex-start; gap:var(--sp-2); }
.tip-row-current{ background:var(--accent-soft); margin:0 calc(-1 * var(--sp-2)); padding:var(--sp-2); border-radius:var(--r-sm); }
.tip-bullet{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:8px; }
.waypoint-marker{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--accent);
  border:2px solid var(--accent); background:transparent;
}
.waypoint-marker-current{ background:var(--accent); color:#fff; }

/* Input field */
.field-label{ display:block; font-size:var(--fs-caption); font-weight:600; color:var(--ink); margin-bottom:var(--sp-2); }
.field{
  width:100%; padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:var(--fs-body);
  transition:border-color var(--m-micro);
}
.field:focus{ outline:none; border-color:var(--accent); }
.field-error{ font-size:var(--fs-caption); color:var(--attention); margin-top:var(--sp-2); display:none; }
.field-error.show{ display:block; }
.field-group{ margin-bottom:var(--sp-4); }

/* Picker trigger — looks like a field, opens a Sheet with a selectable list */
.picker-trigger{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);
  padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:var(--fs-body); text-align:start;
  transition:border-color var(--m-micro);
}
.picker-trigger:disabled{ opacity:.5; }
.picker-value{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.picker-value.placeholder{ color:var(--ink-muted); }
.picker-chevron{ color:var(--ink-muted); flex-shrink:0; }

.picker-search-wrap{ margin-bottom:var(--sp-3); }
.picker-list{ max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:var(--sp-2); }
.picker-option{
  width:100%; text-align:start; padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); font-size:var(--fs-body); color:var(--ink);
  transition:border-color var(--m-micro), background var(--m-micro);
}
.picker-option.selected{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); font-weight:600; }
.picker-option.other-option{ color:var(--ink-muted); }

/* Sheet */
.sheet-overlay{
  position:fixed; inset:0; z-index:90;
  display:flex; align-items:flex-end; justify-content:center;
  background:rgba(26,35,51,.4);
  opacity:0; transition:opacity var(--m-transition) var(--ease);
}
.sheet-overlay.show{ opacity:1; }
.sheet{
  width:100%; max-width:480px; background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--sp-2) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform var(--m-transition) var(--ease);
  max-height:88vh; overflow-y:auto;
}
.sheet-overlay.show .sheet{ transform:translateY(0); }
.sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--line); margin:var(--sp-2) auto var(--sp-4); }
.sheet-title{ font-size:var(--fs-heading); font-weight:600; margin-bottom:var(--sp-4); }

/* Tab bar */
.tab-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  max-width:480px; margin:0 auto;
  background:var(--surface); border-top:1px solid var(--line);
  padding:var(--sp-2) var(--sp-2) calc(var(--sp-2) + env(safe-area-inset-bottom));
  display:flex;
}
.tab-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:var(--sp-2); border-radius:var(--r-sm); color:var(--ink-muted);
  transition:color var(--m-micro), transform var(--m-micro) var(--ease);
}
.tab-item:active{ transform:scale(.94); }
.tab-item.active{ color:var(--accent); }
.tab-label{ font-size:11px; font-weight:600; }

/* Empty state */
.empty-state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:var(--sp-7) var(--sp-5); color:var(--ink-muted); flex:1; justify-content:center;
}
.empty-icon{
  width:56px; height:56px; border-radius:var(--r-md); background:var(--surface);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--ink-muted);
  margin-bottom:var(--sp-4);
}
.empty-title{ font-size:var(--fs-subheading); font-weight:600; color:var(--ink); margin-bottom:var(--sp-2); }
.empty-text{ font-size:var(--fs-body); line-height:1.55; max-width:280px; }

/* Hero (Today) */
.hero{
  background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-card);
  padding:var(--sp-5) var(--sp-4); margin-bottom:var(--sp-4);
}
.hero-eyebrow{ font-size:var(--fs-caption); color:var(--ink-muted); font-weight:600; margin-bottom:var(--sp-1); }
.hero-title{ font-size:var(--fs-display); font-weight:600; margin-bottom:var(--sp-1); }
.hero-sub{ font-size:var(--fs-body); color:var(--ink-muted); margin-bottom:var(--sp-4); }

.section-label{ font-size:var(--fs-caption); font-weight:600; color:var(--ink-muted); margin:0 0 var(--sp-3); }

/* Reflection — the one screen allowed to move slower, deliberately */
.pace-reflective{ animation-duration:var(--m-reflective); }
.pace-reflective textarea.field{ line-height:1.6; }

/* utility */
.stack{ display:flex; flex-direction:column; gap:var(--sp-3); }
.hidden{ display:none !important; }
</style>

/* ============================================================
   D. STORAGE LAYER — single on-device source of truth (offline-first)
   ============================================================ */
const DB_KEY = "studymate_p5_v1";
const DB_VERSION = 1;
function emptyDB(){
  return { version:DB_VERSION, students:{}, journeys:{}, semesters:{}, courses:{}, academicEvents:{}, reflections:{}, achievements:{}, terms:{} };
}
let DB = null;
function dbLoad(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      DB = JSON.parse(raw);
      if(DB && DB.version){
        const blank = emptyDB();
        Object.keys(blank).forEach(t=>{ if(!DB[t]) DB[t] = blank[t]; });
        return;
      }
    }
  }catch(e){}
  DB = emptyDB();
}
function dbSave(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function genId(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function dbInsert(table, rec){ DB[table][rec.id]=rec; dbSave(); return rec; }
function dbUpdate(table, id, patch){ const r=DB[table][id]; if(!r) return null; Object.assign(r,patch); dbSave(); return r; }
function dbDelete(table, id){ delete DB[table][id]; dbSave(); }
function dbGet(table, id){ return id ? (DB[table][id]||null) : null; }
function dbAll(table){ return Object.values(DB[table]); }
function dbQuery(table, pred){ return dbAll(table).filter(pred); }

/* ============================================================
   ENTITY MODULES — one module per Product Design entity
   ============================================================ */

/* ---- Student (absorbs Academic Profile, per revised model) ---- */
const StudentModule = {
  current(){ return dbAll("students")[0] || null; },
  create(data){
    const rec = dbInsert("students", {
      id:genId(), lang:data.lang||"ar", companion:data.companion||"male",
      university:data.university, universityId:data.universityId||null,
      college:data.college, collegeId:data.collegeId||null,
      major:data.major, majorId:data.majorId||null, level:data.level,
      createdAt:Date.now()
    });
    return rec;
  },
  update(data){
    const s = this.current();
    if(s) dbUpdate("students", s.id, { university:data.university, universityId:data.universityId||null, college:data.college, collegeId:data.collegeId||null, major:data.major, majorId:data.majorId||null, level:data.level });
  },
  updateLang(lang){
    const s = this.current();
    if(s) dbUpdate("students", s.id, { lang });
  },
  updateCompanion(companion){
    const s = this.current();
    if(s) dbUpdate("students", s.id, { companion });
  }
};

/* ---- Academic Journey — the continuous container ---- */
const JourneyModule = {
  ensureFor(studentId){
    let j = dbQuery("journeys", j=>j.studentId===studentId)[0];
    if(!j) j = dbInsert("journeys", { id:genId(), studentId, createdAt:Date.now() });
    return j;
  },
  forStudent(studentId){ return dbQuery("journeys", j=>j.studentId===studentId)[0] || null; }
};

/* ---- Semester ---- */
function nextLevelLabel(currentLabel){
  const idx = LEVELS.findIndex(l=> l.ar===currentLabel || l.en===currentLabel);
  if(idx===-1 || idx===LEVELS.length-1) return currentLabel;
  return LEVELS[idx+1][lang()];
}
function levelIdForLabel(label){
  const found = LEVELS.find(l=> l.ar===label || l.en===label);
  return found ? found.id : null;
}
const SemesterModule = {
  createFirst(journeyId, label){
    return dbInsert("semesters", { id:genId(), journeyId, index:1, label, status:"current", createdAt:Date.now() });
  },
  current(journeyId){ return dbQuery("semesters", s=>s.journeyId===journeyId && s.status==="current")[0] || null; },
  listForJourney(journeyId){ return dbQuery("semesters", s=>s.journeyId===journeyId).sort((a,b)=>a.index-b.index); },
  complete(semesterId){ dbUpdate("semesters", semesterId, { status:"done" }); },
  /* closes the current semester and opens the next one — the moment the Academic Journey carries forward */
  startNext(journeyId, currentSemester){
    this.complete(currentSemester.id);
    const newLabel = nextLevelLabel(currentSemester.label);
    return dbInsert("semesters", { id:genId(), journeyId, index:currentSemester.index+1, label:newLabel, status:"current", createdAt:Date.now() });
  }
};

/* ---- Course ---- */
const CourseModule = {
  create(semesterId, data){
    return dbInsert("courses", { id:genId(), semesterId, name:data.name, professor:data.professor||"", createdAt:Date.now() });
  },
  update(id, data){ return dbUpdate("courses", id, { name:data.name, professor:data.professor||"" }); },
  listForSemester(semesterId){ return dbQuery("courses", c=>c.semesterId===semesterId).sort((a,b)=>a.createdAt-b.createdAt); },
  get(id){ return dbGet("courses", id); },
  delete(id){
    dbQuery("academicEvents", e=>e.courseId===id).forEach(e=>dbDelete("academicEvents", e.id));
    dbDelete("courses", id);
  }
};

/* ---- Academic Event (merges Assessment + Academic Event, per revised model) ----
   Attaches to a Course, OR directly to a Semester when the event isn't
   course-specific (e.g. a registration deadline) — per the approved
   backbone amendment. Exactly one of courseId/semesterId is set. */
const AcademicEventModule = {
  create(owner, data){
    return dbInsert("academicEvents", {
      id:genId(), courseId: owner.courseId||null, semesterId: owner.semesterId||null,
      title:data.title, date:data.date||"",
      isEvaluative: !!data.isEvaluative, createdAt:Date.now()
    });
  },
  update(id, data){
    return dbUpdate("academicEvents", id, { title:data.title, date:data.date||"", isEvaluative: !!data.isEvaluative });
  },
  delete(id){ dbDelete("academicEvents", id); },
  get(id){ return dbGet("academicEvents", id); },
  listForCourse(courseId){ return dbQuery("academicEvents", e=>e.courseId===courseId).sort((a,b)=>(a.date||"").localeCompare(b.date||"")); },
  listForCourses(courseIds){ return dbQuery("academicEvents", e=>courseIds.indexOf(e.courseId)!==-1); },
  /* semester-level events only (not tied to any course) */
  listForSemesterDirect(semesterId){ return dbQuery("academicEvents", e=>e.semesterId===semesterId && !e.courseId).sort((a,b)=>(a.date||"").localeCompare(b.date||"")); },
  /* everything Guidance needs to consider for a semester: its own events + every course's events */
  listAllForGuidance(semesterId, courseIds){
    return dbQuery("academicEvents", e => e.semesterId===semesterId || courseIds.indexOf(e.courseId)!==-1);
  }
};
/* Whether an event's date has already passed — a fact of the calendar, not
   something the student manages by hand. Undated events are never "past". */
function isEventPast(event){
  if(!event.date) return false;
  const d = daysUntil(event.date);
  return d !== null && d < 0;
}

/* ---- Reflection ---- */
const ReflectionModule = {
  forSemester(semesterId){ return dbQuery("reflections", r=>r.semesterId===semesterId)[0] || null; },
  create(semesterId, text){ return dbInsert("reflections", { id:genId(), semesterId, text, createdAt:Date.now() }); }
};

/* ---- Achievement ---- */
const AchievementModule = {
  listForJourney(journeyId){ return dbQuery("achievements", a=>a.journeyId===journeyId).sort((a,b)=>b.earnedAt-a.earnedAt); },
  create(journeyId, type, label){ return dbInsert("achievements", { id:genId(), journeyId, type, label, earnedAt:Date.now() }); }
};

/* ---- Term (personal glossary) — a running collection the student builds
   themselves. No dates, no priorities, no done/not-done status: this is
   deliberately not a task list, just a growing record of what they've learned. */
const TermModule = {
  list(){ return dbAll("terms").sort((a,b)=>b.createdAt-a.createdAt); },
  create(text, note){ return dbInsert("terms", { id:genId(), text, note:note||"", createdAt:Date.now() }); },
  update(id, data){ return dbUpdate("terms", id, { text:data.text, note:data.note||"" }); },
  delete(id){ dbDelete("terms", id); },
  get(id){ return dbGet("terms", id); }
};

/* ============================================================
   REMINDER ENGINE — deterministic, computed fresh, never stored
   ============================================================ */
function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
const ReminderEngine = {
  /* the single nearest event within a near-term window —
     considers both course events and semester-level events */
  nearest(semesterId, courseIds){
    const events = AcademicEventModule.listAllForGuidance(semesterId, courseIds).filter(e=>e.date);
    const withDays = events.map(e=>({ event:e, days:daysUntil(e.date) })).filter(x=>x.days!==null && x.days>=0 && x.days<=7);
    withDays.sort((a,b)=> a.days-b.days || (b.event.isEvaluative?1:0)-(a.event.isEvaluative?1:0));
    return withDays[0] || null;
  }
};

/* ============================================================
   RECOMMENDATION ENGINE — local heuristic, computed, offline
   ============================================================ */
const RecommendationEngine = {
  /* notices only genuine clustering; returns null rather than forcing a note */
  cluster(semesterId, courseIds){
    const events = AcademicEventModule.listAllForGuidance(semesterId, courseIds).filter(e=>e.date);
    const withDays = events.map(e=>({ event:e, days:daysUntil(e.date) })).filter(x=>x.days!==null && x.days>=0 && x.days<=7);
    if(withDays.length < 2) return null;
    return { count: withDays.length };
  }
};

/* ============================================================
   Reusable Picker Sheet — one component powering every
   University/College/Major/Level selection, per Simplicity First
   (reuse one mechanism rather than building four).
   ============================================================ */
function openPickerSheet({ title, options, selectedId, searchable, showOther, onSelect }){
  const s = t();
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  const optsHtml = options.map(o=>`<button type="button" class="picker-option ${selectedId===o.id?'selected':''}" data-val="${o.id}">${lang()==='ar'?o.ar:o.en}</button>`).join("");
  const otherHtml = showOther ? `<button type="button" class="picker-option other-option ${selectedId===OTHER_ID?'selected':''}" data-val="${OTHER_ID}">${s.otherOption}</button>` : "";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${title}</div>
      ${searchable ? `<div class="picker-search-wrap"><input type="text" class="field" id="pickerSearch" placeholder="${s.searchPh}" autocomplete="off"></div>` : ""}
      <div class="picker-list" id="pickerList">${optsHtml}${otherHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ overlay.classList.add("show"); }); });

  function close(after){
    overlay.classList.remove("show");
    setTimeout(()=>{ overlay.remove(); if(after) after(); }, 300);
  }
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) close(); });

  const search = overlay.querySelector("#pickerSearch");
  if(search){
    search.addEventListener("click", e=>e.stopPropagation());
    search.addEventListener("input", ()=>{
      const q = search.value.trim().toLowerCase();
      overlay.querySelectorAll(".picker-option").forEach(btn=>{
        btn.style.display = btn.textContent.trim().toLowerCase().includes(q) ? "" : "none";
      });
    });
  }
  overlay.querySelectorAll(".picker-option").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const val = btn.dataset.val;
      close(()=>{ onSelect(val); });
    });
  });
}

function refreshProfilePickerUI(prefix, draft){
  const s = t();
  const uniEl = document.getElementById(prefix+"UniversityValue");
  uniEl.textContent = draft.universityId===OTHER_ID ? s.otherOption : (draft.university || s.selectPh);
  uniEl.classList.toggle("placeholder", !draft.university && draft.universityId!==OTHER_ID);
  document.getElementById(prefix+"UniversityOtherWrap").classList.toggle("hidden", draft.universityId!==OTHER_ID);

  const colEl = document.getElementById(prefix+"CollegeValue");
  colEl.textContent = draft.collegeId===OTHER_ID ? s.otherOption : (draft.college || s.selectPh);
  colEl.classList.toggle("placeholder", !draft.college && draft.collegeId!==OTHER_ID);

  const majBtn = document.getElementById(prefix+"MajorTrigger");
  const majEl = document.getElementById(prefix+"MajorValue");
  const collegeChosen = !!draft.collegeId;
  const collegeIsKnown = collegeChosen && draft.collegeId!==OTHER_ID;
  majBtn.disabled = !collegeChosen;
  document.getElementById(prefix+"MajorOtherWrap").classList.toggle("hidden", !(collegeChosen && (draft.majorId===OTHER_ID || !collegeIsKnown)));
  if(!collegeChosen){ majEl.textContent = s.pickCollegeFirst; majEl.classList.add("placeholder"); }
  else if(!collegeIsKnown){ majEl.textContent = draft.major || s.selectPh; majEl.classList.toggle("placeholder", !draft.major); }
  else{ majEl.textContent = draft.majorId===OTHER_ID ? s.otherOption : (draft.major || s.selectPh); majEl.classList.toggle("placeholder", !draft.major && draft.majorId!==OTHER_ID); }

  const lvlEl = document.getElementById(prefix+"LevelValue");
  lvlEl.textContent = draft.level || s.selectPh;
  lvlEl.classList.toggle("placeholder", !draft.level);
}

function wireProfilePickers(prefix, draft, onChange){
  const s = t();
  document.getElementById(prefix+"UniversityTrigger").addEventListener("click", ()=>{
    openPickerSheet({
      title: s.universityLabel, options: INSTITUTIONS.map(x=>({id:x.id, ar:x.ar, en:x.en})),
      selectedId: draft.universityId, searchable:true, showOther:true,
      onSelect:(val)=>{
        if(val===OTHER_ID){ draft.universityId=OTHER_ID; draft.university=""; }
        else{ draft.universityId=val; draft.university=obLabel(INSTITUTIONS, val); }
        refreshProfilePickerUI(prefix, draft); if(onChange) onChange();
      }
    });
  });
  document.getElementById(prefix+"UniversityOther").addEventListener("input", (e)=>{ draft.university = e.target.value.trim(); if(onChange) onChange(); });

  document.getElementById(prefix+"CollegeTrigger").addEventListener("click", ()=>{
    openPickerSheet({
      title: s.collegeLabel, options: COLLEGES.map(x=>({id:x.id, ar:x.ar, en:x.en})),
      selectedId: draft.collegeId, searchable:false, showOther:true,
      onSelect:(val)=>{
        if(val===OTHER_ID){ draft.collegeId=OTHER_ID; draft.college=""; }
        else{ draft.collegeId=val; draft.college=obLabel(COLLEGES, val); }
        draft.majorId=""; draft.major="";
        refreshProfilePickerUI(prefix, draft); if(onChange) onChange();
      }
    });
  });

  document.getElementById(prefix+"MajorTrigger").addEventListener("click", ()=>{
    if(!draft.collegeId || draft.collegeId===OTHER_ID) return;
    const opts = majorList(draft.collegeId);
    openPickerSheet({
      title: s.majorLabel, options: opts.map(x=>({id:x.id, ar:x.ar, en:x.en})),
      selectedId: draft.majorId, searchable:opts.length>8, showOther:true,
      onSelect:(val)=>{
        if(val===OTHER_ID){ draft.majorId=OTHER_ID; draft.major=""; }
        else{ draft.majorId=val; draft.major=obLabel(opts, val); }
        refreshProfilePickerUI(prefix, draft); if(onChange) onChange();
      }
    });
  });
  document.getElementById(prefix+"MajorOther").addEventListener("input", (e)=>{ draft.major = e.target.value.trim(); if(onChange) onChange(); });

  document.getElementById(prefix+"LevelTrigger").addEventListener("click", ()=>{
    openPickerSheet({
      title: s.levelLabel, options: LEVELS.map(x=>({id:x.id, ar:x.ar, en:x.en})),
      selectedId: draft.levelId, searchable:false, showOther:false,
      onSelect:(val)=>{ draft.levelId=val; draft.level=obLabel(LEVELS, val); refreshProfilePickerUI(prefix, draft); if(onChange) onChange(); }
    });
  });
}

function validateProfileDraft(prefix, draft){
  let valid = true;
  const uniErr = document.getElementById(prefix+"UniversityError");
  const majErr = document.getElementById(prefix+"MajorError");
  if(!draft.university){ uniErr.classList.add("show"); valid=false; } else { uniErr.classList.remove("show"); }
  if(!draft.major){ majErr.classList.add("show"); valid=false; } else { majErr.classList.remove("show"); }
  return valid;
}

function formatEventDate(dateStr, s){
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((target-today)/86400000);
  if(diff < 0) return lang()==='ar' ? "متأخر" : "Overdue";
  if(diff === 0) return lang()==='ar' ? "اليوم" : "Today";
  if(diff === 1) return lang()==='ar' ? "غدًا" : "Tomorrow";
  return lang()==='ar' ? `خلال ${diff} أيام` : `In ${diff} days`;
}

/* ============================================================
   LEARNING SKILLS — hub + detail. Reached from Journey (not a
   tab, per the formal 3-tab navigation design).
   ============================================================ */
function skillAppliesToStudent(skill, student){
  if(!skill.scope || skill.scope.type==="universal") return true;
  if(skill.scope.type==="college"){
    if(!student || !student.collegeId || skill.scope.collegeIds.indexOf(student.collegeId)===-1) return false;
    if(skill.scope.majorIds) return !!(student.majorId && skill.scope.majorIds.indexOf(student.majorId)!==-1);
    return true;
  }
  return true;
}
function skillCard(sk, l){
  return `
    <button type="button" class="card" data-skill-id="${sk.id}">
      <span class="card-icon">${ICON[sk.icon]}</span>
      <span class="card-body">
        <span class="card-title">${escapeHtml(sk.title[l])}</span>
        <span class="card-meta">${escapeHtml(sk.desc[l])}</span>
      </span>
      <span class="card-chevron">${chevronFwd()}</span>
    </button>`;
}

function renderReflection(semesterId){
  applyDir();

  const semester = dbGet("semesters", semesterId);

  app.innerHTML = `
    <section class="screen no-tabbar pace-reflective">
      <div class="screen-content" style="padding-top:var(--sp-7);">

    </section>
  `;

    const upcomingLevel = nextLevelLabel(semester.label);
    const milestone = trackMilestoneMessage(student, upcomingLevel);
    const achievement = milestone
      ? AchievementModule.create(journey.id, "track_milestone", milestone)
      : AchievementModule.create(journey.id, "semester_completed", s.achievementCompleted(semester.label));

    activeTab = "today";
    showAchievementMoment(achievement, ()=>renderToday());

/* Real, researched turning points in each flagship program — celebrated as a
   genuine milestone rather than the routine "semester completed" note. */
function trackMilestoneMessage(student, upcomingLevelLabel){
  const s = t();
  const upcomingId = levelIdForLabel(upcomingLevelLabel);
  if(!upcomingId) return null;
  if(student.universityId==="jazan" && student.collegeId==="cs" && upcomingId==="l3") return s.milestoneJazanCS;
  if(student.universityId==="iau" && student.collegeId==="arts" && upcomingId==="l3") return s.milestoneIauTranslation;
  if(student.universityId==="jazan" && student.collegeId==="eng" && student.majorId==="eng-2" && upcomingId==="l5") return s.milestoneJazanME;
  return null;
}

        ${buildProfilePickerFields("set", s)}
        <button type="button" class="btn btn-primary" id="setSave" style="margin-top:var(--sp-2);">${s.saveChangesBtn}</button>
        <button type="button" class="btn btn-secondary" id="resetBtn" style="color:var(--attention); margin-top:var(--sp-5);">${s.resetLabel}</button>
      </div>
    </section>
  `;
  document.getElementById("settingsBack").addEventListener("click", ()=>{ renderToday(); });
  document.getElementById("langAr").addEventListener("click", ()=>{ StudentModule.updateLang("ar"); renderSettings(); });
  document.getElementById("langEn").addEventListener("click", ()=>{ StudentModule.updateLang("en"); renderSettings(); });
  document.getElementById("companionMale").addEventListener("click", ()=>{ StudentModule.updateCompanion("male"); renderSettings(); });
  document.getElementById("companionFemale").addEventListener("click", ()=>{ StudentModule.updateCompanion("female"); renderSettings(); });

  wireProfilePickers("set", setDraft);
  refreshProfilePickerUI("set", setDraft);

  document.getElementById("setSave").addEventListener("click", ()=>{
    if(!validateProfileDraft("set", setDraft)) return;
    StudentModule.update(setDraft);
    renderToday();
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    showConfirmSheet({
      title:s.resetConfirmTitle, text:s.resetConfirmText, confirmLabel:s.confirmDelete, danger:true,
      onConfirm:()=>{
        DB = emptyDB();
        dbSave();
        activeTab = "today";
        boot();
      }
    });
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  dbLoad();
  const student = StudentModule.current();
  if(student){
    if(!student.companion) dbUpdate("students", student.id, { companion:"male" }); // pre-existing records default silently; visible/editable in Settings
    applyDir();
    renderToday();
  }
  else{ applyDir(); renderWelcome(); }
}
boot();

})();
</script>
</body>
</html>
