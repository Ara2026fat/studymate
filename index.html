/* ============================================================
   COURSE VIEW — everything specific to one course; its own
   Academic Events lead the screen (Phase 4, Section S).
   ============================================================ */
function renderCourseView(courseId){
  applyDir();
  const s = t();
  const course = CourseModule.get(courseId);
  if(!course){ renderSemester(); return; }
  const events = AcademicEventModule.listForCourse(courseId);

  const bodyHtml = events.length === 0
    ? `<div class="empty-state">
        <div class="empty-icon">${ICON.event}</div>
        <div class="empty-title">${s.courseEmptyTitle}</div>
        <p class="empty-text">${s.courseEmptyText}</p>
      </div>`
    : `<div class="stack">${events.map(e=>{
        const past = isEventPast(e);
        const daysLabel = e.date ? (past ? s.eventPastLabel : formatEventDate(e.date, s)) : "";
        return `
        <button type="button" class="card" data-event-id="${e.id}">
          <span class="card-icon">${ICON.event}</span>
          <span class="card-body">
            <span class="card-title" style="${past?'color:var(--ink-muted);':''}">${escapeHtml(e.title)}</span>
            ${daysLabel ? `<span class="card-meta">${daysLabel}</span>` : ""}
          </span>
          ${e.isEvaluative ? `<span class="pill pill-attention">${s.eventIsEvaluativeLabel.split(" ")[0]}</span>` : ""}
        </button>`;
      }).join("")}</div>`;

  const enrichment = enrichmentForCourse(course.name);
  const matchingSkillId = matchingTechniqueSkillId(course.name);
  const matchingSkillObj = matchingSkillId ? SKILLS.find(sk=>sk.id===matchingSkillId) : null;
  const upcomingEvaluative = events.find(e=>e.isEvaluative && !isEventPast(e));

  const toolsListHtml = `
    <div class="callout-label" style="margin-top:var(--sp-4);">${s.courseToolsLabel}</div>
    <div class="stack" style="margin-top:8px;">
      <button type="button" class="card" data-tool-notebook>
        <span class="card-icon">${ICON.book}</span>
        <span class="card-body"><span class="card-title">${s.courseToolNotebook}</span></span>
        <span class="card-chevron">${chevronFwd()}</span>
      </button>
      ${matchingSkillObj ? `
      <button type="button" class="card" data-tool-skill="${matchingSkillObj.id}">
        <span class="card-icon">${ICON[matchingSkillObj.icon]}</span>
        <span class="card-body"><span class="card-title">${s.courseToolSkill}</span><span class="card-meta">${escapeHtml(matchingSkillObj.title[lang()])}</span></span>
        <span class="card-chevron">${chevronFwd()}</span>
      </button>` : ""}
      ${upcomingEvaluative ? `
      <button type="button" class="card" data-tool-prep="${upcomingEvaluative.id}">
        <span class="card-icon">${ICON.bell}</span>
        <span class="card-body"><span class="card-title">${s.courseToolPrep}</span><span class="card-meta">${escapeHtml(upcomingEvaluative.title)}</span></span>
        <span class="card-chevron">${chevronFwd()}</span>
      </button>` : ""}
      ${enrichment && enrichment.resources.length ? `
      <div class="type-caption" style="color:var(--ink-muted); padding:0 var(--sp-2);">${s.courseToolResourcesHint}</div>` : ""}
    </div>`;

  app.innerHTML = `
    <section class="screen">
      <div class="screen-header">
        <button type="button" class="btn-icon" id="courseBack" aria-label="Back">${chevronBack()}</button>
        <button type="button" class="btn-icon" id="courseNotebookBtn" aria-label="${s.notebookEntryLabel}">${ICON.book}</button>
        <button type="button" class="btn-icon" id="courseEdit" aria-label="${s.editCourseTitle}">${ICON.settings}</button>
      </div>
      <div class="screen-content">
        <div class="hero" style="margin-bottom:var(--sp-4);">
          <div class="hero-eyebrow">${s.semesterTitle}</div>
          <div class="hero-title" style="font-size:var(--fs-heading);">${escapeHtml(course.name)}</div>
          ${course.professor ? `<div class="hero-sub" style="margin-bottom:0;">${escapeHtml(course.professor)}</div>` : ""}
        </div>
        ${enrichment ? `
        <div class="callout" style="margin-bottom:var(--sp-4);">
          <div class="callout-label">${s.enrichmentAboutLabel}</div>
          <p class="type-body" style="margin-bottom:var(--sp-3);">${escapeHtml(enrichment.explain[lang()])}</p>
          <p class="type-body" style="color:var(--ink-muted); font-size:var(--fs-caption);"><strong>${s.enrichmentWhyLabel}</strong> ${escapeHtml(enrichment.why[lang()])}</p>
          ${enrichment.topics && enrichment.topics.length ? `
          <div class="callout-label" style="margin-top:var(--sp-4);">${s.topicsMapLabel}</div>
          <div class="stack" style="margin-top:8px;">
            ${enrichment.topics.map(topic=>`
              <div style="background:var(--surface); border-radius:var(--r-sm); padding:var(--sp-3);">
                <div class="type-body" style="font-weight:700; margin-bottom:6px;">${escapeHtml(topic.title[lang()])}</div>
                <ul style="margin:0; padding-inline-start:20px;">
                  ${topic.points.map(p=>`<li class="type-caption" style="color:var(--ink-muted); margin-bottom:5px; line-height:1.6;">${escapeHtml(p[lang()])}</li>`).join("")}
                </ul>
              </div>
            `).join("")}
          </div>` : ""}
          ${toolsListHtml}
          ${enrichment.connections ? `
          <div class="callout-label" style="margin-top:var(--sp-4);">${s.connectionsLabel}</div>
          ${enrichment.connections.requires && enrichment.connections.requires.length ? `
          <p class="type-body" style="font-size:var(--fs-caption); margin-top:6px;">${s.connectionsRequires} <strong>${enrichment.connections.requires.map(c=>escapeHtml(c[lang()])).join('، ')}</strong></p>` : ""}
          ${enrichment.connections.leadsTo && enrichment.connections.leadsTo.length ? `
          <p class="type-body" style="font-size:var(--fs-caption); margin-top:4px;">${s.connectionsLeadsTo} <strong>${enrichment.connections.leadsTo.map(c=>escapeHtml(c[lang()])).join('، ')}</strong></p>` : ""}
          ` : ""}
          ${enrichment.resources.length ? `
          <div class="callout-label" style="margin-top:var(--sp-4);">${s.enrichmentResourcesLabel}</div>
          ${enrichment.resources.map(r=>`
            <a href="${r.url}" target="_blank" rel="noopener" style="display:block; margin-top:var(--sp-2); padding:var(--sp-3); background:var(--surface); border-radius:var(--r-sm); border:1px solid rgba(255,255,255,.07);">
              <div class="type-body" style="font-weight:700; color:var(--accent);">${escapeHtml(r.title[lang()])} ↗</div>
              <div class="type-caption" style="color:var(--ink-muted); margin-top:2px;">${escapeHtml(r.reason[lang()])}</div>
            </a>
          `).join("")}` : ""}
        </div>` : `
        <div class="callout" style="margin-bottom:var(--sp-4);">
          <div class="callout-label">${s.courseBriefLabel}</div>
          <p class="type-body">${s.courseBriefGenericText}</p>
          ${toolsListHtml}
        </div>`}
        <div class="section-label">${s.addEventBtn}</div>
        ${bodyHtml}
      </div>
      <div class="screen-action">
        <button type="button" class="btn btn-primary" id="addEventBtn">${s.addEventBtn}</button>
      </div>
    </section>
  `;
  document.getElementById("courseBack").addEventListener("click", ()=>{ renderSemester(); });
  document.getElementById("courseNotebookBtn").addEventListener("click", ()=>{ renderCourseNotebook(courseId); });
  document.getElementById("courseEdit").addEventListener("click", ()=>{ openCourseSheet(course.semesterId, course, ()=>renderCourseView(courseId)); });
  document.getElementById("addEventBtn").addEventListener("click", ()=>{ openEventSheet({courseId}, null, ()=>renderCourseView(courseId)); });
  document.querySelectorAll("[data-event-id]").forEach(card=>{
    card.addEventListener("click", ()=>{ openEventSheet({courseId}, AcademicEventModule.get(card.dataset.eventId), ()=>renderCourseView(courseId)); });
  });
  const toolNotebookBtn = document.querySelector("[data-tool-notebook]");
  if(toolNotebookBtn) toolNotebookBtn.addEventListener("click", ()=>{ renderCourseNotebook(courseId); });
  const toolSkillBtn = document.querySelector("[data-tool-skill]");
  if(toolSkillBtn) toolSkillBtn.addEventListener("click", ()=>{ renderSkillDetail(toolSkillBtn.dataset.toolSkill); });
  const toolPrepBtn = document.querySelector("[data-tool-prep]");
  if(toolPrepBtn) toolPrepBtn.addEventListener("click", ()=>{ renderExamPrepHub(toolPrepBtn.dataset.toolPrep); });
}
function renderExamPrepHub(eventId){
  applyDir();
  const s = t();
  const l = lang();
  const event = AcademicEventModule.get(eventId);
  if(!event || !event.courseId){ renderToday(); return; }
  const course = CourseModule.get(event.courseId);
  if(!course){ renderToday(); return; }
  const nb = NotebookModule.get(course.id);
  const needsReview = nb.checks.filter(c=>!c.understood);
  const days = daysUntil(event.date);
  const remaining = WeeklyScheduleModule.sessionsRemainingUntil(course.semesterId, course.id, event.date);
  const enrichment = enrichmentForCourse(course.name);
  const daysLabel = days===0 ? s.todayLabel : days===1 ? s.tomorrowLabel : s.inDaysLabel(days);

  app.innerHTML = `
    <section class="screen no-tabbar">
      <div class="screen-header">
        <button type="button" class="btn-icon" id="prepBack" aria-label="Back">${chevronBack()}</button>
        <div class="screen-header-title">${s.prepHubTitle}</div>
        <span style="width:40px;"></span>
      </div>
      <div class="screen-content">
        <div class="hero" style="margin-bottom:var(--sp-4);">
          <div class="hero-eyebrow">${escapeHtml(course.name)}</div>
          <div class="hero-title" style="font-size:var(--fs-heading);">${escapeHtml(event.title)}</div>
          <div class="hero-sub">${daysLabel}${remaining!==null ? ` · ${s.sessionsRemainingLabel(remaining)}` : ""}</div>
        </div>

        <div class="section-label">${s.prepNeedsReviewLabel}</div>
        ${needsReview.length===0 ? `
        <p class="type-caption" style="color:var(--ink-muted); margin-bottom:var(--sp-4);">${s.prepNeedsReviewEmpty}</p>` : `
        <div class="stack" style="margin-bottom:var(--sp-4);">
          ${needsReview.map(c=>{
            const reason = c.reasonId ? UNDERSTANDING_REASONS.find(r=>r.id===c.reasonId) : null;
            return `
            <div class="card" style="cursor:default; align-items:flex-start;">
              <span class="card-icon" style="color:var(--attention); background:var(--attention-soft);">${ICON.close}</span>
              <span class="card-body">
                <span class="card-title">${escapeHtml(c.topic)}</span>
                ${reason ? `<span class="card-meta">${escapeHtml(reason[l])}</span><p class="type-caption" style="color:var(--accent); margin-top:4px;">${escapeHtml(reason.tip[l])}</p>` : ""}
              </span>
            </div>`;
          }).join("")}
        </div>`}

        <div class="section-label">${s.notebookExamsLabel}</div>
        ${nb.exams.length===0 ? `
        <p class="type-caption" style="color:var(--ink-muted); margin-bottom:var(--sp-3);">${s.notebookExamsEmpty}</p>` : `
        <div class="stack" style="margin-bottom:var(--sp-3);">
          ${nb.exams.map(e=>`
            <div class="card" style="cursor:default;">
              <span class="card-icon">${ICON.event}</span>
              <span class="card-body">
                <span class="card-title">${escapeHtml(e.title)}</span>
                ${e.note ? `<span class="card-meta">${escapeHtml(e.note)}</span>` : ""}
              </span>
            </div>
          `).join("")}
        </div>`}
        <button type="button" class="btn btn-secondary" id="prepAddExam" style="margin-bottom:var(--sp-4);">${s.notebookAddExamBtn}</button>

        ${enrichment && enrichment.resources.length ? `
        <div class="callout" style="margin-bottom:var(--sp-4);">
          <div class="callout-label">${s.enrichmentResourcesLabel}</div>
          ${enrichment.resources.map(r=>`
            <a href="${r.url}" target="_blank" rel="noopener" style="display:block; margin-top:var(--sp-2); padding:var(--sp-3); background:var(--surface); border-radius:var(--r-sm); border:1px solid rgba(255,255,255,.07);">
              <div class="type-body" style="font-weight:700; color:var(--accent);">${escapeHtml(r.title[l])} ↗</div>
              <div class="type-caption" style="color:var(--ink-muted); margin-top:2px;">${escapeHtml(r.reason[l])}</div>
            </a>
          `).join("")}
        </div>` : ""}

        <button type="button" class="btn btn-primary" id="prepGoNotebook">${s.prepGoNotebookBtn}</button>
      </div>
    </section>
  `;
  document.getElementById("prepBack").addEventListener("click", ()=>{ renderCourseView(course.id); });
  document.getElementById("prepGoNotebook").addEventListener("click", ()=>{ renderCourseNotebook(course.id); });
  document.getElementById("prepAddExam").addEventListener("click", ()=>{ openPastExamSheet(course.id, ()=>renderExamPrepHub(eventId)); });
}
/* Compiles a course's notebook (notes, understanding checks, past exams)
   into one clean, printable document — the browser's own "print" dialog
   lets the student save it as a real PDF they keep, no external library
   needed, works on any device. */
function downloadNotebook(courseId){
  const s = t();
  const l = lang();
  const course = CourseModule.get(courseId);
  const nb = NotebookModule.get(courseId);
  const dateStr = new Date().toLocaleDateString(l==="ar"?"ar-SA":"en-US", {year:"numeric", month:"long", day:"numeric"});

  const NOTE_COLOR_PRINT = { default:"#F4F4F4", blue:"#DCEBFB", green:"#DFF3E4", yellow:"#FCF3D6", pink:"#FBE2E8" };
  function printColorHex(id){ return NOTE_COLOR_PRINT[id] || NOTE_COLOR_PRINT.default; }

  let html = `
    <div class="print-page-header">
      <div style="font-size:22px; font-weight:800;">${escapeHtml(course.name)}</div>
      <div style="font-size:13px; color:#666; margin-top:4px;">${s.printNotebookGeneratedOn} ${dateStr}</div>
    </div>`;

  if(nb.notes.length){
    html += `<div class="print-section-title">${s.notebookNotesLabel}</div>`;
    nb.notes.slice().reverse().forEach(n=>{
      html += `<div class="print-note" style="background:${printColorHex(n.color)};">`;
      if(n.type==="drawing" || n.type==="image"){
        html += `<img src="${n.dataUrl}" alt="">`;
      } else {
        html += `<div style="white-space:pre-wrap; font-size:13.5px; line-height:1.7;">${escapeHtml(n.text)}</div>`;
      }
      if(n.hardestPoint){
        html += `<div class="print-callout" style="background:#FCE8D6; border:1px solid #E8A05C;"><strong>${s.noteHardestPointLabel}:</strong> ${escapeHtml(n.hardestPoint)}</div>`;
      }
      if(n.keyInsight){
        html += `<div class="print-callout" style="background:#DCEBFB; border:1px solid #5B93E0;"><strong>${s.noteKeyInsightLabel}:</strong> ${escapeHtml(n.keyInsight)}</div>`;
      }
      html += `</div>`;
    });
  }

  if(nb.checks.length){
    html += `<div class="print-section-title">${s.notebookChecksLabel}</div>`;
    nb.checks.slice().reverse().forEach(c=>{
      const reason = c.reasonId ? UNDERSTANDING_REASONS.find(r=>r.id===c.reasonId) : null;
      html += `<div class="print-note" style="background:#F4F4F4;">
        <div style="font-weight:700; font-size:13.5px;">${c.understood?'✓':'✗'} ${escapeHtml(c.topic)}</div>
        ${reason ? `<div style="font-size:12.5px; color:#666; margin-top:4px;">${escapeHtml(reason[l])} — ${escapeHtml(reason.tip[l])}</div>` : ""}
      </div>`;
    });
  }

  if(nb.exams.length){
    html += `<div class="print-section-title">${s.notebookExamsLabel}</div>`;
    nb.exams.slice().reverse().forEach(e=>{
      html += `<div class="print-note" style="background:#F4F4F4;">
        <div style="font-weight:700; font-size:13.5px;">${escapeHtml(e.title)}</div>
        ${e.note ? `<div style="font-size:12.5px; color:#666; margin-top:4px;">${escapeHtml(e.note)}</div>` : ""}
      </div>`;
    });
  }

  if(!nb.notes.length && !nb.checks.length && !nb.exams.length){
    html += `<p style="text-align:center; color:#999; margin-top:40px;">${s.notebookNotesEmpty}</p>`;
  }

  document.getElementById("printNotebookArea").innerHTML = html;
  window.print();
}
function renderCourseNotebook(courseId){
  applyDir();
  const s = t();
  const l = lang();
  const course = CourseModule.get(courseId);
  if(!course){ renderSemester(); return; }
  const nb = NotebookModule.get(courseId);

  app.innerHTML = `
    <section class="screen no-tabbar">
      <div class="screen-header">
        <button type="button" class="btn-icon" id="notebookBack" aria-label="Back">${chevronBack()}</button>
        <div class="screen-header-title" style="font-size:var(--fs-body);">${escapeHtml(course.name)}</div>
        <span style="width:40px;"></span>
      </div>
      <div class="screen-content">

        <div class="section-label">${s.notebookNotesLabel}</div>
        <div class="stack" style="margin-bottom:var(--sp-3);">
          ${nb.notes.length===0 ? `<p class="type-caption" style="color:var(--ink-muted);">${s.notebookNotesEmpty}</p>` : nb.notes.map(n=>{
            const badge = noteColorBadge(n.color);
            return `
            <button type="button" class="card note-card" data-note-id="${n.id}" style="cursor:pointer; align-items:flex-start; flex-direction:column; background:${noteColorHex(n.color)}; position:relative;">
              ${badge ? `<span style="position:absolute; top:10px; inset-inline-end:10px; width:22px; height:22px; border-radius:50%; background:${badge.accent}; color:#1A1A1A; display:flex; align-items:center; justify-content:center;">${ICON[badge.icon]}</span>` : ""}
              <span class="card-body" style="${badge?'padding-inline-end:30px;':''}">
                ${n.type==="drawing" || n.type==="image"
                  ? `<img src="${n.dataUrl}" style="width:100%; border-radius:var(--r-sm); display:block;" alt="">`
                  : `<span class="type-body" style="white-space:pre-wrap;">${escapeHtml(n.text)}</span>`}
              </span>
              ${n.hardestPoint ? `<div style="margin-top:8px; padding:8px 10px; background:rgba(var(--attention-rgb),.14); border-radius:var(--r-sm); width:100%;"><span class="type-caption" style="color:var(--attention); font-weight:700;">${s.noteHardestPointLabel}</span><p class="type-caption" style="margin-top:2px; white-space:pre-wrap;">${escapeHtml(n.hardestPoint)}</p></div>` : ""}
              ${n.keyInsight ? `<div style="margin-top:8px; padding:8px 10px; background:rgba(var(--accent-rgb),.14); border-radius:var(--r-sm); width:100%;"><span class="type-caption" style="color:var(--accent); font-weight:700;">${s.noteKeyInsightLabel}</span><p class="type-caption" style="margin-top:2px; white-space:pre-wrap;">${escapeHtml(n.keyInsight)}</p></div>` : ""}
            </button>
          `;}).join("")}
        </div>
        <div style="display:flex; gap:10px; margin-bottom:var(--sp-5);">
          <button type="button" class="btn btn-secondary" id="notebookAddNote" style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px;">${ICON.pencil}<span>${s.notebookAddNoteBtn}</span></button>
          <button type="button" class="btn btn-secondary" id="notebookAddImage" style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px;">${ICON.image}<span>${s.notebookAddImageBtn}</span></button>
          <input type="file" id="notebookImageInput" accept="image/*" style="display:none;">
        </div>

        <div class="section-label">${s.notebookChecksLabel}</div>
        <div class="stack" style="margin-bottom:var(--sp-3);">
          ${nb.checks.length===0 ? `<p class="type-caption" style="color:var(--ink-muted);">${s.notebookChecksEmpty}</p>` : nb.checks.map(c=>{
            const reason = c.reasonId ? UNDERSTANDING_REASONS.find(r=>r.id===c.reasonId) : null;
            return `
            <div class="card" style="cursor:default; align-items:flex-start;">
              <span class="card-icon" style="${c.understood?'':'color:var(--attention); background:var(--attention-soft);'}">${c.understood ? ICON.check : ICON.close}</span>
              <span class="card-body">
                <span class="card-title">${escapeHtml(c.topic)}</span>
                ${reason ? `<span class="card-meta">${escapeHtml(reason[l])}</span><p class="type-caption" style="color:var(--accent); margin-top:4px;">${escapeHtml(reason.tip[l])}</p>` : `<span class="card-meta">${s.notebookUnderstoodLabel}</span>`}
              </span>
              <button type="button" class="btn-icon" data-remove-check="${c.id}" style="width:28px; height:28px; flex-shrink:0;">${ICON.close}</button>
            </div>`;
          }).join("")}
        </div>
        <button type="button" class="btn btn-secondary" id="notebookAddCheck" style="margin-bottom:var(--sp-5); display:flex; align-items:center; justify-content:center; gap:8px;">${ICON.lens}<span>${s.notebookAddCheckBtn}</span></button>

        <div class="section-label">${s.notebookExamsLabel}</div>
        <div class="stack" style="margin-bottom:var(--sp-3);">
          ${nb.exams.length===0 ? `<p class="type-caption" style="color:var(--ink-muted);">${s.notebookExamsEmpty}</p>` : nb.exams.map(e=>`
            <div class="card" style="cursor:default;">
              <span class="card-icon">${ICON.event}</span>
              <span class="card-body">
                <span class="card-title">${escapeHtml(e.title)}</span>
                ${e.note ? `<span class="card-meta">${escapeHtml(e.note)}</span>` : ""}
              </span>
              <button type="button" class="btn-icon" data-remove-exam="${e.id}" style="width:28px; height:28px; flex-shrink:0;">${ICON.close}</button>
            </div>
          `).join("")}
        </div>
        <button type="button" class="btn btn-secondary" id="notebookAddExam" style="display:flex; align-items:center; justify-content:center; gap:8px;">${ICON.event}<span>${s.notebookAddExamBtn}</span></button>

        <button type="button" class="btn btn-primary" id="downloadNotebookBtn" style="margin-top:var(--sp-5); display:flex; align-items:center; justify-content:center; gap:8px;">${ICON.openBook}<span>${s.downloadNotebookBtn}</span></button>
      </div>
    </section>
  `;
  document.getElementById("notebookBack").addEventListener("click", ()=>{ renderCourseView(courseId); });
  document.getElementById("notebookAddNote").addEventListener("click", ()=>{ openNoteSheet(courseId, null, ()=>renderCourseNotebook(courseId)); });
  document.getElementById("notebookAddImage").addEventListener("click", ()=>{ document.getElementById("notebookImageInput").click(); });
  document.getElementById("notebookImageInput").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ NotebookModule.addImageNote(courseId, reader.result, "default"); renderCourseNotebook(courseId); };
    reader.readAsDataURL(file);
  });
  document.querySelectorAll("[data-note-id]").forEach(card=>{
    card.addEventListener("click", ()=>{
      const note = nb.notes.find(n=>n.id===card.dataset.noteId);
      if(note.type==="image"){
        showConfirmSheet({
          title:s.notebookDeleteNoteConfirmTitle, text:s.notebookDeleteNoteConfirmText, confirmLabel:s.confirmDelete, danger:true,
          onConfirm:()=>{ NotebookModule.removeNote(courseId, note.id); renderCourseNotebook(courseId); }
        });
        return;
      }
      openNoteSheet(courseId, note, ()=>renderCourseNotebook(courseId));
    });
  });
  document.getElementById("notebookAddCheck").addEventListener("click", ()=>{ openUnderstandingCheckSheet(courseId, ()=>renderCourseNotebook(courseId)); });

function setupCanvasDrawing(canvas, initialDataUrl){
  const ctx = canvas.getContext("2d");
  const dpr = Math.max(window.devicePixelRatio||1, 1);
  const cssWidth = canvas.clientWidth || 320;
  const cssHeight = 260;
  canvas.width = cssWidth*dpr;
  canvas.height = cssHeight*dpr;
  canvas.style.height = cssHeight+"px";
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#11141F";
  ctx.fillRect(0,0,cssWidth,cssHeight);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#F1F3F8";
  if(initialDataUrl){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, 0, 0, cssWidth, cssHeight); };
    img.src = initialDataUrl;
  }
  let drawing = false, lastX = 0, lastY = 0;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX-rect.left, y: e.clientY-rect.top };
  }
  canvas.addEventListener("pointerdown", (e)=>{
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x; lastY = pos.y;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, ctx.lineWidth/2, 0, Math.PI*2); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e)=>{
    if(!drawing) return;
    const pos = getPos(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
    lastX = pos.x; lastY = pos.y;
  });
  canvas.addEventListener("pointerup", ()=>{ drawing = false; });
  canvas.addEventListener("pointercancel", ()=>{ drawing = false; });
  return {
    setPen(color){ ctx.strokeStyle = color; },
    clear(){ ctx.fillStyle = "#11141F"; ctx.fillRect(0,0,cssWidth,cssHeight); },
    toDataUrl(){ return canvas.toDataURL("image/png"); }
  };
}

async function translateTextOnDemand(text, direction){
  const langpair = direction==="ar-en" ? "ar|en" : "en|ar";
  const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`);
  const data = await res.json();
  return data && data.responseData && data.responseData.translatedText;
}

function formatEventDate(dateStr, s){
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((target-today)/86400000);
  if(diff < 0) return lang()==='ar' ? "متأخر" : "Overdue";
  if(diff === 0) return lang()==='ar' ? "اليوم" : "Today";
  if(diff === 1) return lang()==='ar' ? "غدًا" : "Tomorrow";
  return lang()==='ar' ? `خلال ${diff} أيام` : `In ${diff} days`;
}

/* ============================================================
   STAGE 9: ACADEMIC JOURNEY — the multi-year record (grows over time)
   ============================================================ */
function buildBridgeCablesSvg(count){
  const stopHeight = 128;
  const totalHeight = count * stopHeight + 40;
  const spans = Math.max(1, Math.round(count / 3));
  const towerY = [];
  for(let i=0; i<=spans; i++) towerY.push((totalHeight / spans) * i);
  const leftX = 8, rightX = 92;
  function cablePath(xBase, dip){
    let d = `M ${xBase} ${towerY[0]}`;
    for(let i=1; i<towerY.length; i++){
      const midY = (towerY[i-1] + towerY[i]) / 2;
      d += ` Q ${xBase + dip} ${midY}, ${xBase} ${towerY[i]}`;
    }
    return d;
  }
  const leftPath = cablePath(leftX, 16);
  const rightPath = cablePath(rightX, -16);
  let hangers = "";
  const lights = [];
  for(let i=0; i<count; i++){
    const y = 40 + i * stopHeight + stopHeight/2;
    const spanIdx = Math.min(spans-1, Math.floor((y/totalHeight) * spans));
    const y0 = towerY[spanIdx], y1 = towerY[spanIdx+1];
    const tRatio = (y - y0) / (y1 - y0 || 1);
    const dip = Math.sin(tRatio * Math.PI);
    const lX = leftX + dip*16, rX = rightX - dip*16;
    hangers += `<line class="bridge-hanger" x1="${lX}" y1="${y}" x2="50" y2="${y}"/><line class="bridge-hanger" x1="${rX}" y1="${y}" x2="50" y2="${y}"/>`;
    lights.push({x:lX, yPct:(y/totalHeight)*100, delay:(i*0.3)%2.6}, {x:rX, yPct:(y/totalHeight)*100, delay:(i*0.4)%2.6});
  }
  const towers = towerY.map(ty=>`<line class="bridge-tower" x1="${leftX}" y1="${ty}" x2="${leftX}" y2="${Math.max(0,ty-20)}"/><line class="bridge-tower" x1="${rightX}" y1="${ty}" x2="${rightX}" y2="${Math.max(0,ty-20)}"/>`).join("");
  const svg = `<svg class="bridge-cables" viewBox="0 0 100 ${totalHeight}" preserveAspectRatio="none">${towers}<path class="bridge-cable" d="${leftPath}"/><path class="bridge-cable" d="${rightPath}"/>${hangers}</svg>`;
  const lightsHtml = lights.map(l=>`<span class="cable-light" style="left:${l.x}%; top:${l.yPct}%; animation-delay:${l.delay}s;"></span>`).join("");
  return svg + lightsHtml;
}

function skillAppliesToStudent(skill, student){
  if(!skill.scope || skill.scope.type==="universal") return true;
  if(skill.scope.type==="college"){
    if(!student || !student.collegeId || skill.scope.collegeIds.indexOf(student.collegeId)===-1) return false;
    if(skill.scope.majorIds && !(student.majorId && skill.scope.majorIds.indexOf(student.majorId)!==-1)) return false;
    if(skill.scope.universityIds && !(student.universityId && skill.scope.universityIds.indexOf(student.universityId)!==-1)) return false;
    return true;
  }
  return true;
}

/* Voice input for any text field — graceful degradation when the browser
   doesn't support speech recognition (hides the mic button entirely rather
   than showing a broken control). */
function attachVoiceInput(buttonEl, targetEl){
  if(!buttonEl || !targetEl) return;
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor){
    buttonEl.style.display = "none";
    return;
  }
  const recognition = new SpeechRecognitionCtor();
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let listening = false;

  recognition.addEventListener("result", (e)=>{
    const transcript = e.results[0][0].transcript;
    const sep = targetEl.value.trim() ? " " : "";
    targetEl.value = targetEl.value + sep + transcript;
    targetEl.dispatchEvent(new Event("input"));
  });
  recognition.addEventListener("end", ()=>{
    listening = false;
    buttonEl.classList.remove("mic-listening");
  });
  recognition.addEventListener("error", ()=>{
    listening = false;
    buttonEl.classList.remove("mic-listening");
  });

  buttonEl.addEventListener("click", ()=>{
    if(listening){ recognition.stop(); return; }
    try{
      recognition.lang = lang()==="ar" ? "ar-SA" : "en-US";
      recognition.start();
      listening = true;
      buttonEl.classList.add("mic-listening");
    }catch(err){ /* recognition already active or mic blocked — no-op */ }
  });
}

/* The single "raw" capture notebook — one place to jot things down quickly
   during the week across every course, exactly like the one big notebook in
   the family's own study story. Entries live here until the student
   "whitens" them by transferring into the right course's real notebook. */
const RawNotebookModule = {
  list(){ return dbAll("rawNotes").sort((a,b)=>b.createdAt-a.createdAt); },
  create(type, content, color){
    const data = { id:genId(), type, color:color||"default", transferredToCourseId:null, transferredAt:null, createdAt:Date.now() };
    if(type==="drawing") data.dataUrl = content; else data.text = content;
    return dbInsert("rawNotes", data);
  },
  update(id, type, content, color){
    const data = { type, color:color||"default" };
    if(type==="drawing") data.dataUrl = content; else data.text = content;
    return dbUpdate("rawNotes", id, data);
  },
  delete(id){ dbDelete("rawNotes", id); },
  get(id){ return dbGet("rawNotes", id); },
  transferToCourse(id, courseId){
    const raw = this.get(id);
    if(!raw) return;
    if(raw.type==="drawing") NotebookModule.addDrawingNote(courseId, raw.dataUrl, raw.color);
    else NotebookModule.addNote(courseId, raw.text, raw.color);
    dbUpdate("rawNotes", id, { transferredToCourseId:courseId, transferredAt:Date.now() });
  }
};
const NotebookModule = {
  get(courseId){
    if(!DB.courseNotebooks) DB.courseNotebooks = {};
    if(!DB.courseNotebooks[courseId]) DB.courseNotebooks[courseId] = { notes:[], checks:[], exams:[] };
    const nb = DB.courseNotebooks[courseId];
    // Migrate the old single-string notes format transparently — nothing lost.
    if(typeof nb.notes === "string"){
      const old = nb.notes;
      nb.notes = old.trim() ? [{ id:genId(), text:old, color:"default", createdAt:Date.now() }] : [];
      dbSave();
    }
    return nb;
  },
  addNote(courseId, text, color, extras){
    const nb = this.get(courseId);
    nb.notes.unshift({ id:genId(), type:"text", text, color:color||"default", hardestPoint:(extras&&extras.hardestPoint)||"", keyInsight:(extras&&extras.keyInsight)||"", createdAt:Date.now() });
    dbSave();
  },
  updateNote(courseId, noteId, text, color, extras){
    const nb = this.get(courseId);
    const note = nb.notes.find(n=>n.id===noteId);
    if(note){ note.type="text"; note.text = text; note.color = color||"default"; note.hardestPoint=(extras&&extras.hardestPoint)||""; note.keyInsight=(extras&&extras.keyInsight)||""; dbSave(); }
  },
  addDrawingNote(courseId, dataUrl, color){
    const nb = this.get(courseId);
    nb.notes.unshift({ id:genId(), type:"drawing", dataUrl, color:color||"default", createdAt:Date.now() });
    dbSave();
  },
  addImageNote(courseId, dataUrl, color){
    const nb = this.get(courseId);
    nb.notes.unshift({ id:genId(), type:"image", dataUrl, color:color||"default", createdAt:Date.now() });
    dbSave();
  },
  updateDrawingNote(courseId, noteId, dataUrl, color){
    const nb = this.get(courseId);
    const note = nb.notes.find(n=>n.id===noteId);
    if(note){ note.type="drawing"; note.dataUrl = dataUrl; note.color = color||"default"; dbSave(); }
  },
  removeNote(courseId, noteId){
    const nb = this.get(courseId);
    nb.notes = nb.notes.filter(n=>n.id!==noteId);
    dbSave();
  },
  addCheck(courseId, topic, understood, reasonId){
    const nb = this.get(courseId);
    nb.checks.unshift({ id:genId(), topic, understood, reasonId: understood?null:reasonId, createdAt:Date.now() });
    dbSave();
  },
  removeCheck(courseId, checkId){
    const nb = this.get(courseId);
    nb.checks = nb.checks.filter(c=>c.id!==checkId);
    dbSave();
  },
  addExam(courseId, title, note){
    const nb = this.get(courseId);
    nb.exams.unshift({ id:genId(), title, note, createdAt:Date.now() });
    dbSave();
  },
  removeExam(courseId, examId){
    const nb = this.get(courseId);
    nb.exams = nb.exams.filter(e=>e.id!==examId);
    dbSave();
  }
};

    direction = "ar-en";
    document.getElementById("dirArEn").classList.add("segmented-active");
    document.getElementById("dirEnAr").classList.remove("segmented-active");
  });
  document.getElementById("translateGoBtn").addEventListener("click", async ()=>{
    const text = document.getElementById("translateInput").value.trim();
    const resultEl = document.getElementById("translateResult");
    if(!text) return;
    resultEl.innerHTML = `<p class="type-body" style="color:var(--ink-muted);">${s.translateLoading}</p>`;
    const langpair = direction === "en-ar" ? "en|ar" : "ar|en";
    try{
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`);
      const data = await res.json();
      const translated = data && data.responseData && data.responseData.translatedText;
      if(translated){
        resultEl.innerHTML = `
          <div class="card" style="cursor:default; flex-direction:column; align-items:flex-start; padding:var(--sp-4);">
            <span class="type-body">${escapeHtml(translated)}</span>
          </div>`;
      } else {
        resultEl.innerHTML = `<p class="type-body" style="color:var(--attention);">${s.translateError}</p>`;
      }
    }catch(err){
      resultEl.innerHTML = `<p class="type-body" style="color:var(--attention);">${s.translateError}</p>`;
    }
  });
}

function renderWeeklyWhitening(){
  applyDir();
  const s = t();
  const l = lang();
  const student = StudentModule.current();
  const journey = JourneyModule.forStudent(student.id);
  const semester = SemesterModule.current(journey.id);
  if(!semester){ renderToday(); return; }
  const courses = CourseModule.listForSemester(semester.id);
  const sessions = WeeklyScheduleModule.listForSemester(semester.id);
  const weekStart = startOfThisWeek();

  const coursesWithSessions = courses.filter(c => sessions.some(sess=>sess.courseId===c.id));
  const rawNotesThisWeek = RawNotebookModule.list().filter(n=>n.createdAt>=weekStart);

  function isWhitened(courseId){
    const nb = NotebookModule.get(courseId);
    const hasDirectNote = nb.notes.some(n=>n.createdAt>=weekStart);
    const hasTransferred = rawNotesThisWeek.some(n=>n.transferredToCourseId===courseId);
    return hasDirectNote || hasTransferred;
  }

  const whitenedCount = coursesWithSessions.filter(c=>isWhitened(c.id)).length;
  const untransferredRaw = rawNotesThisWeek.filter(n=>!n.transferredToCourseId).length;

  app.innerHTML = `
    <section class="screen no-tabbar">
      <div class="screen-header">
        <button type="button" class="btn-icon" id="whiteningBack" aria-label="Back">${chevronBack()}</button>
        <div class="screen-header-title">${s.whiteningTitle}</div>
        <span style="width:40px;"></span>
      </div>
      <div class="screen-content">
        <div class="hero" style="margin-bottom:var(--sp-4);">
          <div class="hero-eyebrow">${s.whiteningEyebrow}</div>
          <div class="hero-title" style="font-size:var(--fs-heading);">${s.whiteningProgress(whitenedCount, coursesWithSessions.length)}</div>
          <p class="type-body" style="color:var(--ink-muted); margin-top:8px;">${s.whiteningIntro}</p>
        </div>

        ${untransferredRaw>0 ? `
        <button type="button" class="callout" id="whiteningRawLink" style="display:block; width:100%; text-align:start; margin-bottom:var(--sp-4); cursor:pointer;">
          <div class="callout-label">${s.rawNotebookTitle}</div>
          <p class="type-body">${s.whiteningRawHint(untransferredRaw)}</p>
        </button>` : ""}

        ${coursesWithSessions.length===0 ? `
        <div class="empty-state">
          <div class="empty-icon">${ICON.weekGrid}</div>
          <div class="empty-title">${s.scheduleNoCoursesTitle}</div>
          <p class="empty-text">${s.scheduleNoCoursesText}</p>
        </div>` : `
        <div class="stack">
          ${coursesWithSessions.map(c=>{
            const done = isWhitened(c.id);
            const clr = courseColorFor(c);
            return `
            <button type="button" class="card" data-whitening-course="${c.id}" style="border-inline-start:4px solid ${clr};">
              <span class="card-icon" style="background:color-mix(in srgb, ${clr} 22%, var(--surface)); color:${clr};">${ICON.weekGrid}</span>
              <span class="card-body">
                <span class="card-title">${escapeHtml(c.name)}</span>
                <span class="card-meta" style="color:${done?'var(--accent)':'var(--ink-muted)'};">${done ? s.whiteningDoneLabel : s.whiteningNotYetLabel}</span>
              </span>
              <span class="card-chevron">${chevronFwd()}</span>
            </button>`;
          }).join("")}
        </div>`}
      </div>
    </section>
  `;
  document.getElementById("whiteningBack").addEventListener("click", ()=>{ renderToday(); });
  const rawLink = document.getElementById("whiteningRawLink");
  if(rawLink) rawLink.addEventListener("click", ()=>{ renderRawNotebook(); });
  document.querySelectorAll("[data-whitening-course]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ renderCourseNotebook(btn.dataset.whiteningCourse); });
  });
}

        <input type="text" class="field" id="evTitle" placeholder="${s.eventTitlePh}" value="${editing?escapeHtml(existingEvent.title):''}" autocomplete="off">
        <p class="field-error" id="evTitleError">${s.nameRequired}</p>
      </div>
      <div class="field-group">
        <label class="field-label" for="evDate">${s.eventDateLabel}</label>
        <input type="date" class="field" id="evDate" value="${editing?escapeHtml(existingEvent.date):''}">
      </div>
      <div class="field-group" style="display:flex; align-items:center; gap:var(--sp-3);">
        <button type="button" class="btn-icon" id="evEvalToggle" style="width:24px; height:24px; border-radius:6px; ${(editing&&existingEvent.isEvaluative)?'background:var(--accent); border-color:var(--accent); color:#fff;':''}">${(editing&&existingEvent.isEvaluative)?ICON.check:''}</button>
        <span class="type-body">${s.eventIsEvaluativeLabel}</span>
      </div>
      <button type="button" class="btn btn-primary" id="evSave" style="margin-bottom:${editing?'8px':'0'};">${s.saveBtn}</button>
      ${editing ? `<button type="button" class="btn btn-secondary" id="evDelete" style="color:var(--attention);">${s.deleteEventBtn}</button>` : ""}
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ overlay.classList.add("show"); }); });

  let isEvaluative = editing ? !!existingEvent.isEvaluative : false;

  function close(after){
    overlay.classList.remove("show");
    setTimeout(()=>{ overlay.remove(); if(after) after(); }, 300);
  }
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) close(); });

  overlay.querySelector("#evEvalToggle").addEventListener("click", (e)=>{
    isEvaluative = !isEvaluative;
    e.currentTarget.style.background = isEvaluative ? "var(--accent)" : "";
    e.currentTarget.style.borderColor = isEvaluative ? "var(--accent)" : "";
    e.currentTarget.innerHTML = isEvaluative ? ICON.check : "";
  });

  overlay.querySelector("#evSave").addEventListener("click", ()=>{
    const title = overlay.querySelector("#evTitle").value.trim();
    const titleErr = overlay.querySelector("#evTitleError");
    if(!title){ titleErr.classList.add("show"); return; }
    const date = overlay.querySelector("#evDate").value;
    if(editing){
      AcademicEventModule.update(existingEvent.id, { title, date, isEvaluative });
    } else {
      AcademicEventModule.create(owner, { title, date, isEvaluative });
    }
    close(onDone);
  });
  const deleteBtn = overlay.querySelector("#evDelete");
  if(deleteBtn){
    deleteBtn.addEventListener("click", ()=>{
      close(()=>{
        showConfirmSheet({
          title:s.deleteEventConfirmTitle, text:s.deleteEventConfirmText, confirmLabel:s.confirmDelete, danger:true,
          onConfirm:()=>{ AcademicEventModule.delete(existingEvent.id); onDone(); }
        });
      });
    });
  }
}

function openEndSemesterConfirm(semester){

/* ============================================================
   REFLECTION — deliberately slower pacing than the rest of the
   app (Phase 4, Section P): the one screen meant to slow down.
   ============================================================ */
function renderReflection(semesterId){
  applyDir();
  const s = t();
  const semester = dbGet("semesters", semesterId);

  app.innerHTML = `
    <section class="screen no-tabbar pace-reflective">
      <div class="screen-content" style="padding-top:var(--sp-7);">
        <div class="hero-eyebrow">${s.reflectionEyebrow}</div>
        <div class="type-display" style="margin-bottom:var(--sp-3);">${s.reflectionTitle}</div>
        <p class="type-body" style="color:var(--ink-muted); margin-bottom:var(--sp-5); line-height:1.6;">${s.reflectionPrompt}</p>
        <textarea class="field" id="reflectionText" rows="6" placeholder="${s.reflectionPh}" style="resize:none; min-height:160px;"></textarea>
      </div>
      <div class="screen-action">
        <button type="button" class="btn btn-primary" id="reflectionSave">${s.reflectionSave}</button>
      </div>
    </section>
  `;
  document.getElementById("reflectionSave").addEventListener("click", ()=>{
    const text = document.getElementById("reflectionText").value.trim();
    ReflectionModule.create(semesterId, text);

    const student = StudentModule.current();
    const journey = JourneyModule.forStudent(student.id);
    const upcomingLevel = nextLevelLabel(semester.label);
    const milestone = trackMilestoneMessage(student, upcomingLevel);
    let achievement;
    if(milestone) achievement = AchievementModule.create(journey.id, "track_milestone", milestone);
    else if(semester.index === 1) achievement = AchievementModule.create(journey.id, "first_semester", s.milestoneFirstSemester);
    else achievement = AchievementModule.create(journey.id, "semester_completed", s.achievementCompleted(semester.label));
    SemesterModule.startNext(journey.id, semester);

    activeTab = "today";
    showAchievementMoment(achievement, ()=>renderToday());
  });
}

/* Real, researched turning points in each flagship program — celebrated as a
   genuine milestone rather than the routine "semester completed" note. */
function trackMilestoneMessage(student, upcomingLevelLabel){
  const s = t();
  const upcomingId = levelIdForLabel(upcomingLevelLabel);
  if(!upcomingId) return null;
  if(student.universityId==="jazan" && student.collegeId==="cs" && upcomingId==="l5") return s.milestoneJazanCS;
  if(student.universityId==="jazan" && student.collegeId==="cs" && upcomingId==="l9") return s.milestoneJazanCSGradProject;
  if(student.universityId==="iau" && student.collegeId==="arts" && student.majorId==="arts-0" && upcomingId==="l3") return s.milestoneIauTranslation;
  if(student.universityId==="jazan" && student.collegeId==="eng" && student.majorId==="eng-2" && upcomingId==="l7") return s.milestoneJazanME;
  return null;
}

/* A genuine, calm acknowledgment of a real milestone — shown once, at the
   moment it's actually earned, then dismissed. Not a badge collection. */
function showAchievementMoment(achievement, onDone){
  const s = t();
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.innerHTML = `
    <div class="sheet" style="text-align:center; padding-top:var(--sp-6);">
      <div class="empty-icon celebrate-icon" style="margin:0 auto var(--sp-4); width:72px; height:72px; color:var(--accent); background:rgba(var(--accent-rgb),.16); box-shadow:0 4px 14px rgba(var(--accent-rgb),.20);">${ICON.laurel}</div>
      <div class="sheet-title" style="text-align:center;">${s.achievementCelebrateTitle}</div>
      <p class="type-body" style="color:var(--ink-muted); margin-bottom:var(--sp-5);">${escapeHtml(achievement.label)}</p>
      <button type="button" class="btn btn-primary" id="achievementContinue">${s.continueLabel}</button>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ overlay.classList.add("show"); }); });
  function close(after){ overlay.classList.remove("show"); setTimeout(()=>{ overlay.remove(); if(after) after(); }, 300); }
  overlay.querySelector("#achievementContinue").addEventListener("click", ()=>close(onDone));
}

function renderAbout(){
  applyDir();
  const s = t();
  app.innerHTML = `
    <section class="screen no-tabbar">
      <div class="screen-header">
        <button type="button" class="btn-icon" id="aboutBack" aria-label="Back">${chevronBack()}</button>
        <div class="screen-header-title">${s.aboutEntryLabel}</div>
        <span style="width:40px;"></span>
      </div>
      <div class="screen-content" style="display:flex; flex-direction:column; justify-content:center; flex:1; text-align:center; padding-top:var(--sp-5);">
        <img src="${LOGO_DATA_URI}" alt="StudyMate" style="width:140px; height:auto; margin:0 auto var(--sp-5); display:block;">
        <div class="type-display" style="margin-bottom:var(--sp-4);">${s.welcomeTitle}</div>
        <p class="type-body" style="color:var(--ink-muted); line-height:1.7; max-width:320px; margin:0 auto;">${s.welcomeBody}</p>
      </div>
      <div class="screen-action">
        <button type="button" class="btn btn-primary" id="aboutShareBtn">${s.aboutShareBtn}</button>
      </div>
    </section>
  `;
  document.getElementById("aboutBack").addEventListener("click", ()=>{ renderSettings(); });
  document.getElementById("aboutShareBtn").addEventListener("click", async (e)=>{
    const btn = e.currentTarget;
    const shareData = {
      title: "StudyMate — رفيق تعلّم",
      text: s.aboutShareText,
      url: "https://ara2026fat.github.io/studymate/"
    };
    if(navigator.share){
      try{ await navigator.share(shareData); }catch(err){ /* user cancelled, no-op */ }
    } else {
      try{
        await navigator.clipboard.writeText(`${shareData.text}\n${shareData.url}`);
        const original = btn.textContent;
        btn.textContent = s.aboutLinkCopied;
        setTimeout(()=>{ btn.textContent = original; }, 2000);
      }catch(err){ /* clipboard unavailable, no-op */ }
    }
  });
}
function renderSettings(){
  applyDir();
  const s = t();
  const student = StudentModule.current();
  const setDraft = {
    universityId:student.universityId||"", university:student.university, collegeId:student.collegeId||"", college:student.college,
    majorId:student.majorId||"", major:student.major, levelId:"", level:student.level
  };

  app.innerHTML = `
    <section class="screen no-tabbar">
      <div class="screen-header">
        <button type="button" class="btn-icon" id="settingsBack" aria-label="Back">${chevronBack()}</button>
        <div class="screen-header-title">${s.settingsTitle}</div>
        <span style="width:40px;"></span>
      </div>
      <div class="screen-content">
        <div class="field-group">
          <span class="field-label">${s.languageLabel}</span>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn ${student.lang==='ar'?'btn-primary':'btn-secondary'}" id="langAr" style="flex:1;">العربية</button>
            <button type="button" class="btn ${student.lang==='en'?'btn-primary':'btn-secondary'}" id="langEn" style="flex:1;">English</button>
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">${s.companionSectionLabel}</span>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn ${student.companion==='male'?'btn-primary':'btn-secondary'}" id="companionMale" style="flex:1;">${s.companionMaleLabel}</button>
            <button type="button" class="btn ${student.companion==='female'?'btn-primary':'btn-secondary'}" id="companionFemale" style="flex:1;">${s.companionFemaleLabel}</button>
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">${s.appearanceLabel}</span>
          <div class="theme-grid">
            <button type="button" class="theme-swatch ${!student.theme?'theme-swatch-active':''}" data-theme-id="">
              <span class="theme-swatch-preview" style="background:linear-gradient(120deg, var(--background), var(--accent));"></span>
              <span class="theme-swatch-label">${s.themeDefaultLabel}</span>
            </button>
            ${THEMES.map(th=>`
              <button type="button" class="theme-swatch ${student.theme===th.id?'theme-swatch-active':''}" data-theme-id="${th.id}">
                <span class="theme-swatch-preview" style="background:linear-gradient(120deg, ${th.bg}, ${th.accent});"></span>
                <span class="theme-swatch-label">${th[lang()]}</span>
              </button>
            `).join("")}
          </div>
        </div>
        <div class="section-label" style="margin-top:var(--sp-5);">${s.editProfileLabel}</div>
        ${buildProfilePickerFields("set", s)}
        <button type="button" class="btn btn-primary" id="setSave" style="margin-top:var(--sp-2);">${s.saveChangesBtn}</button>
        <button type="button" class="btn btn-secondary" id="mirrorBtn" style="margin-top:var(--sp-5);">${s.mirrorEntryLabel}</button>
        <button type="button" class="btn btn-secondary" id="aboutBtn" style="margin-top:var(--sp-2);">${s.aboutEntryLabel}</button>
        <button type="button" class="btn btn-secondary" id="resetBtn" style="color:var(--attention); margin-top:var(--sp-2);">${s.resetLabel}</button>
      </div>
    </section>
  `;
  document.getElementById("settingsBack").addEventListener("click", ()=>{ renderToday(); });
  document.getElementById("mirrorBtn").addEventListener("click", ()=>{ renderWeeklyMirror(); });
  document.getElementById("aboutBtn").addEventListener("click", ()=>{ renderAbout(); });
  document.getElementById("langAr").addEventListener("click", ()=>{ StudentModule.updateLang("ar"); renderSettings(); });
  document.getElementById("langEn").addEventListener("click", ()=>{ StudentModule.updateLang("en"); renderSettings(); });
  document.getElementById("companionMale").addEventListener("click", ()=>{ StudentModule.updateCompanion("male"); renderSettings(); });
  document.getElementById("companionFemale").addEventListener("click", ()=>{ StudentModule.updateCompanion("female"); renderSettings(); });
  document.querySelectorAll(".theme-swatch").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      StudentModule.updateTheme(btn.dataset.themeId || null);
      renderSettings();
    });

  wireProfilePickers("set", setDraft);
  refreshProfilePickerUI("set", setDraft);

  document.getElementById("setSave").addEventListener("click", ()=>{
    if(!validateProfileDraft("set", setDraft)) return;
    StudentModule.update(setDraft);
    renderToday();
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    showConfirmSheet({
      title:s.resetConfirmTitle, text:s.resetConfirmText, confirmLabel:s.confirmDelete, danger:true,
      onConfirm:()=>{
        DB = emptyDB();
        dbSave();
        activeTab = "today";
        boot();
      }
    });
  });

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  dbLoad();
  const student = StudentModule.current();
  if(student){
    if(!student.companion) dbUpdate("students", student.id, { companion:"male" }); // pre-existing records default silently; visible/editable in Settings
    applyDir();
    renderToday();
  }
  else{ applyDir(); renderWelcome(); }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{}); // silently no-op if unreachable (e.g. local file, dev preview)
  }
}
boot();

})();
</script>
