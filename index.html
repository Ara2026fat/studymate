<style>
/* ============================================================
   B. DESIGN SYSTEM — tokens, exactly as Phase Four Section T
   ============================================================ */
:root{
  --footer-h:37px;
  --app-max-w:clamp(390px, 92vw, 900px);
  /* color — dark, luxurious base shared by both companions */
  --background:#0D1119;
  --surface:#1A2030;
  --surface-glass:rgba(255,255,255,.055);
  --ink:#F1F3F8;
  --ink-muted:#9AA5B8;
  --accent:#C98A2E;
  --accent-rgb:201,138,46;
  --accent-soft:rgba(201,138,46,.16);
  --attention:#E89478;
  --attention-rgb:232,148,120;
  --attention-soft:rgba(232,148,120,.14);
  --line:rgba(255,255,255,.09);

  /* type scale (px) */
  --fs-display:28px;
  --fs-heading:20px;
  --fs-subheading:17px;
  --fs-body:15px;
  --fs-caption:13px;

  /* spacing scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;

  /* radius */
  --r-sm:8px; --r-md:14px; --r-lg:20px;

  /* motion */
  --m-micro:180ms; --m-transition:300ms; --m-reflective:450ms;
  --ease:cubic-bezier(.25,.8,.35,1);

  --shadow-card:0 1px 0 rgba(255,255,255,.04) inset, 0 4px 16px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);

  --font-ar:'Cairo', sans-serif;
  --font-en:'Inter', sans-serif;
  --lh-ar:1.6;
  --lh-en:1.4;
}

/* رفيق تعلم — clarity, ambition, the academic path, achievement.
   Cooler background, confident focused blue, sharper corners, snappier motion. */
body[data-companion="male"]{
  --background:#0A0E17;
  --surface:#161C2C;
  --surface-glass:rgba(120,160,220,.06);
  --accent:#5B93E0;
  --accent-rgb:91,147,224;
  --accent-soft:rgba(91,147,224,.16);
  --r-sm:7px; --r-md:12px; --r-lg:18px;
  --m-micro:160ms; --m-transition:260ms;
}

/* رفيقة تعلم — calm, comfort, support, companionship on the journey.
   Warmer background, soft rose-gold, rounder corners, gentler motion. */
body[data-companion="female"]{
  --background:#170F1A;
  --surface:#241A2A;
  --surface-glass:rgba(224,169,178,.06);
  --accent:#D9A15E;
  --accent-rgb:217,161,94;
  --accent-soft:rgba(217,161,94,.16);
  --r-sm:11px; --r-md:19px; --r-lg:27px;
  --m-micro:210ms; --m-transition:340ms;
}

/* Optional manual appearance override — color only. Corner radius and motion
   character stay tied to the رفيق/رفيقة companion choice either way; only
   the color story changes here. */
body[data-theme="night"]{
  --background:#0B0E14; --surface:#161C28; --surface-glass:rgba(107,155,209,.06);
  --accent:#6B9BD1; --accent-rgb:107,155,209; --accent-soft:rgba(107,155,209,.16);
}
body[data-theme="obsidian"]{
  --background:#0D0B08; --surface:#1E1912; --surface-glass:rgba(201,151,77,.06);
  --accent:#C9974D; --accent-rgb:201,151,77; --accent-soft:rgba(201,151,77,.16);
}
body[data-theme="petrol"]{
  --background:#081815; --surface:#132824; --surface-glass:rgba(63,184,168,.06);
  --accent:#3FB8A8; --accent-rgb:63,184,168; --accent-soft:rgba(63,184,168,.16);
}
body[data-theme="plum"]{
  --background:#180A14; --surface:#281423; --surface-glass:rgba(212,107,148,.06);
  --accent:#D46B94; --accent-rgb:212,107,148; --accent-soft:rgba(212,107,148,.16);
}
body[data-theme="royal"]{
  --background:#070B1C; --surface:#131A34; --surface-glass:rgba(76,126,240,.06);
  --accent:#4C7EF0; --accent-rgb:76,126,240; --accent-soft:rgba(76,126,240,.16);
}
body[data-theme="forest"]{
  --background:#0A120A; --surface:#162115; --surface-glass:rgba(156,173,94,.06);
  --accent:#9CAD5E; --accent-rgb:156,173,94; --accent-soft:rgba(156,173,94,.16);
}
body[data-theme="sandy"]{
  --background:#170F09; --surface:#271C10; --surface-glass:rgba(217,161,94,.06);
  --accent:#D9A15E; --accent-rgb:217,161,94; --accent-soft:rgba(217,161,94,.16);
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  background:var(--background);
  color:var(--ink);
  font-family:var(--font-ar);
  line-height:var(--lh-ar);
  font-size:var(--fs-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html[lang="en"] body{ font-family:var(--font-en); line-height:var(--lh-en); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; }
a{ color:inherit; text-decoration:none; }
ul,ol{ list-style:none; }

.type-display{ font-size:var(--fs-display); font-weight:600; }
.type-body{ font-size:var(--fs-body); font-weight:400; }
.type-caption{ font-size:var(--fs-caption); font-weight:400; color:var(--ink-muted); }

/* ---------- App shell ---------- */
#app{ min-height:100vh; min-height:100dvh; max-width:var(--app-max-w); margin:0 auto; position:relative; }

#creditFooter{
  position:fixed; bottom:0; left:0; right:0; z-index:55;
  max-width:var(--app-max-w); margin:0 auto;
  background:var(--surface); border-top:1px solid var(--line);
  padding:4px var(--sp-3) calc(4px + env(safe-area-inset-bottom));
  text-align:center; font-size:9px; line-height:1.35; color:var(--ink-muted);
}
.screen{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  padding-bottom:calc(72px + var(--footer-h) + env(safe-area-inset-bottom));
  animation:fadeIn var(--m-transition) var(--ease);
}
.screen.no-tabbar{ padding-bottom:calc(var(--sp-5) + var(--footer-h)); }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(8px) scale(.99); } to{ opacity:1; transform:translateY(0) scale(1); } }
@keyframes celebrateIn{ 0%{ opacity:0; transform:scale(.5) rotate(-8deg); } 60%{ opacity:1; transform:scale(1.08) rotate(2deg); } 100%{ transform:scale(1) rotate(0); } }
.celebrate-icon{ animation:celebrateIn 550ms var(--ease-spring); }

/* ---------- C. Screen template zones ---------- */
.screen-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--sp-5) var(--sp-4) var(--sp-3);
}
.screen-header-title{ font-size:var(--fs-heading); font-weight:600; flex:1; min-width:0; overflow-wrap:break-word; }
.screen-header-sub{ font-size:var(--fs-caption); color:var(--ink-muted); margin-top:2px; }

.screen-content{ flex:1; min-width:0; padding:0 var(--sp-4); }

.screen-action{
  position:sticky; bottom:var(--footer-h); padding:var(--sp-4); background:linear-gradient(to top, var(--background) 65%, transparent);
}

/* ---------- D. Components ---------- */

/* Buttons */
.btn{
  display:flex; align-items:center; justify-content:center; gap:var(--sp-2);
  width:100%; padding:14px var(--sp-4); border-radius:999px;
  font-size:var(--fs-body); font-weight:600;
  transition:transform 200ms var(--ease-spring), opacity var(--m-micro), box-shadow 200ms var(--ease);
}
.btn:active{ transform:scale(.97); }
.btn-primary{
  background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 82%, white), var(--accent));
  color:#1A1305;
  box-shadow:0 2px 8px rgba(var(--accent-rgb),.35), 0 10px 24px rgba(var(--accent-rgb),.28);
}
.btn-primary:active{ box-shadow:0 1px 3px rgba(var(--accent-rgb),.3); }
.btn-primary:disabled{ opacity:.35; box-shadow:none; }
.btn-secondary{ background:transparent; color:var(--ink-muted); font-weight:500; }
.btn-icon{
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-muted);
  transition:background var(--m-micro), transform var(--m-micro) var(--ease);
}
.btn-icon:active{ background:var(--line); transform:scale(.92); }
.mic-btn{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-muted);
  transition:background 200ms var(--ease), color 200ms var(--ease), transform 200ms var(--ease-spring);
}
.mic-btn:active{ transform:scale(.92); }
.mic-btn.mic-listening{
  background:rgba(var(--attention-rgb),.16); color:var(--attention); border-color:rgba(var(--attention-rgb),.35);
  animation:micPulse 1.2s ease-in-out infinite;
}
@keyframes micPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(var(--attention-rgb),.35); }
  50%{ box-shadow:0 0 0 8px rgba(var(--attention-rgb),0); }
}
.field-with-mic{ display:flex; align-items:flex-start; gap:8px; }
.field-with-mic .field{ flex:1; }
.color-swatch{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  border:2px solid rgba(255,255,255,.12);
  transition:transform 200ms var(--ease-spring), border-color 200ms var(--ease);
}
.color-swatch:active{ transform:scale(.9); }
.color-swatch-active{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18); }

/* Card */
.card{
  display:flex; align-items:center; gap:var(--sp-3); width:100%; text-align:start;
  background:var(--surface);
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-md); box-shadow:var(--shadow-card);
  padding:var(--sp-3) var(--sp-4);
  transition:transform 220ms var(--ease-spring), box-shadow 220ms var(--ease);
}
.card:active{ transform:scale(.975); box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 3px rgba(0,0,0,.3); }
.card-icon{
  width:42px; height:42px; border-radius:var(--r-sm); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(var(--accent-rgb),.14);
  color:var(--accent);
}
.card-body{ flex:1; min-width:0; }
.card-title{ display:block; font-size:var(--fs-subheading); font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-meta{ display:block; font-size:var(--fs-caption); color:var(--ink-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-chevron{ color:var(--ink-muted); flex-shrink:0; opacity:.6; }

/* List row (lighter than card) */
.list-row{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-1);
  border-bottom:1px solid var(--line);
}
.list-row:last-child{ border-bottom:none; }

/* Status pill */
.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-size:var(--fs-caption); font-weight:600;
  padding:4px 10px; border-radius:999px; white-space:nowrap;
}
.pill-attention{ background:var(--attention-soft); color:var(--attention); }

/* Learning Skills */
.skill-entry-card{
  display:flex; align-items:center; gap:var(--sp-3); width:100%; text-align:start;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4); margin-top:var(--sp-5);
}
.skill-grid{
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--sp-2);
}
.skill-grid > *{ animation:fadeIn 380ms var(--ease) backwards; }
.skill-grid > *:nth-child(1){ animation-delay:0ms; }
.skill-grid > *:nth-child(2){ animation-delay:30ms; }
.skill-grid > *:nth-child(3){ animation-delay:60ms; }
.skill-grid > *:nth-child(4){ animation-delay:90ms; }
.skill-grid > *:nth-child(5){ animation-delay:120ms; }
.skill-grid > *:nth-child(6){ animation-delay:150ms; }
.skill-grid > *:nth-child(n+7){ animation-delay:180ms; }
.skill-tile{
  position:relative;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
  background:var(--surface);
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-md); box-shadow:var(--shadow-card);
  padding:var(--sp-3) 6px; min-height:96px; justify-content:center;
  transition:transform 220ms var(--ease-spring), box-shadow 220ms var(--ease);
}
.skill-tile:active{ transform:scale(.96); box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 3px rgba(0,0,0,.3); }
.skill-tile-viewed{
  position:absolute; top:6px; inset-inline-end:6px;
  width:16px; height:16px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(var(--accent-rgb),.85); color:#1A1305;
}
.skill-tile-viewed svg{ width:10px; height:10px; }
.skill-tile-icon{
  width:32px; height:32px; border-radius:var(--r-sm); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(var(--accent-rgb),.14);
  color:var(--accent);
}
.skill-tile-title{ font-size:11.5px; font-weight:600; color:var(--ink); line-height:1.3; }
.segmented{
  display:flex; background:var(--surface); border:1px solid rgba(255,255,255,.06); border-radius:999px; padding:3px; margin-bottom:var(--sp-4);
}
.segmented-btn{
  flex:1; padding:9px var(--sp-3); border-radius:999px; font-size:var(--fs-caption); font-weight:600; color:var(--ink-muted);
  transition:background 220ms var(--ease-spring), color 220ms var(--ease), box-shadow 220ms var(--ease);
}
.segmented-active{ background:rgba(var(--accent-rgb),.18); color:var(--ink); box-shadow:var(--shadow-card); }
.theme-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); margin-top:var(--sp-2); }
.theme-swatch{
  display:flex; flex-direction:column; gap:6px; padding:var(--sp-2);
  border-radius:var(--r-md); border:1.5px solid transparent;
  transition:border-color 200ms var(--ease), transform 200ms var(--ease-spring);
}
.theme-swatch:active{ transform:scale(.97); }
.theme-swatch-active{ border-color:var(--accent); background:rgba(var(--accent-rgb),.08); }
.theme-swatch-preview{ display:block; width:100%; height:36px; border-radius:var(--r-sm); border:1px solid rgba(255,255,255,.1); }
.theme-swatch-label{ font-size:var(--fs-caption); font-weight:600; color:var(--ink); text-align:center; }
.callout{
  background:var(--surface); border:1px solid rgba(255,255,255,.06);
  border-radius:var(--r-md);
  padding:var(--sp-4); margin-bottom:var(--sp-4);
}
.callout-label{ font-size:var(--fs-caption); font-weight:700; color:var(--ink-muted); margin-bottom:var(--sp-2); }
.tip-list{ display:flex; flex-direction:column; gap:var(--sp-2); }
.tip-row{ display:flex; align-items:flex-start; gap:var(--sp-2); }
.tip-row-current{ background:var(--accent-soft); margin:0 calc(-1 * var(--sp-2)); padding:var(--sp-2); border-radius:var(--r-sm); }
.tip-bullet{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:8px; }
.waypoint-marker{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--accent);
  border:2px solid var(--accent); background:transparent;
  transition:box-shadow 220ms var(--ease);
}
.waypoint-marker-current{
  background:radial-gradient(circle at 35% 30%, #E3A94F, var(--accent) 70%);
  color:#fff; border-color:transparent;
  box-shadow:0 0 0 4px rgba(var(--accent-rgb),.15), 0 2px 8px rgba(var(--accent-rgb),.35);
}

/* Input field */
.field-label{ display:block; font-size:var(--fs-caption); font-weight:600; color:var(--ink); margin-bottom:var(--sp-2); }
.field{
  width:100%; padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:var(--fs-body);
  transition:border-color var(--m-micro);
}
.field:focus{ outline:none; border-color:var(--accent); }
.field-error{ font-size:var(--fs-caption); color:var(--attention); margin-top:var(--sp-2); display:none; }
.field-error.show{ display:block; }
.field-group{ margin-bottom:var(--sp-4); }

/* Picker trigger — looks like a field, opens a Sheet with a selectable list */
.picker-trigger{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);
  padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:var(--fs-body); text-align:start;
  transition:border-color var(--m-micro);
}
.picker-trigger:disabled{ opacity:.5; }
.picker-value{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.picker-value.placeholder{ color:var(--ink-muted); }
.picker-chevron{ color:var(--ink-muted); flex-shrink:0; }

.picker-search-wrap{ margin-bottom:var(--sp-3); }
.picker-list{ max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:var(--sp-2); }
.picker-option{
  width:100%; text-align:start; padding:13px var(--sp-4); border-radius:var(--r-md);
  border:1.5px solid var(--line); background:var(--surface); font-size:var(--fs-body); color:var(--ink);
  transition:border-color var(--m-micro), background var(--m-micro);
}
.picker-option.selected{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); font-weight:600; }
.picker-option.other-option{ color:var(--ink-muted); }

/* Sheet */
.sheet-overlay{
  position:fixed; inset:0; z-index:90;
  display:flex; align-items:flex-end; justify-content:center;
  background:rgba(26,35,51,.4);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  opacity:0; transition:opacity var(--m-transition) var(--ease);
}
.sheet-overlay.show{ opacity:1; }
.sheet{
  width:100%; max-width:var(--app-max-w); background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--sp-2) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform var(--m-transition) var(--ease);
  max-height:88vh; overflow-y:auto;
}
.sheet-overlay.show .sheet{ transform:translateY(0); }
.sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--line); margin:var(--sp-2) auto var(--sp-4); }
.sheet-title{ font-size:var(--fs-heading); font-weight:600; margin-bottom:var(--sp-4); }

/* A gentle pulse for imminent schedule items — using the theme's own accent
   color so it adapts automatically between companions, giving a real sense
   of "this is happening soon" without being jarring. */
@keyframes gentlePulse{
  0%, 100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
  50%{ box-shadow:0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); }
}
.pulse-imminent{ animation:gentlePulse 2.2s ease-in-out infinite; }

#printNotebookArea{ display:none; }
@media print{
  body *{ visibility:hidden; }
  #printNotebookArea, #printNotebookArea *{ visibility:visible; }
  #printNotebookArea{ display:block; position:absolute; top:0; left:0; width:100%; background:#fff; color:#1a1a1a; padding:24px; }
  .print-page-header{ text-align:center; margin-bottom:28px; border-bottom:2px solid #333; padding-bottom:14px; }
  .print-note{ page-break-inside:avoid; margin-bottom:18px; border-radius:8px; padding:14px 16px; border:1px solid #ddd; }
  .print-callout{ margin-top:8px; padding:8px 10px; border-radius:6px; font-size:12.5px; }
  .print-note img{ max-width:100%; border-radius:6px; margin-top:6px; }
  .print-section-title{ font-size:16px; font-weight:700; margin:24px 0 12px; border-bottom:1px solid #ccc; padding-bottom:6px; }
}

/* Tab bar */
.tab-bar{
  position:fixed; bottom:var(--footer-h); left:0; right:0; z-index:50;
  max-width:var(--app-max-w); margin:0 auto;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
  border-top:1px solid rgba(228,230,234,.8);
  padding:var(--sp-2) var(--sp-2) var(--sp-2);
  display:flex;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tab-bar{ background:var(--surface); }
}
.tab-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:var(--sp-2); border-radius:var(--r-sm); color:var(--ink-muted);
  transition:color var(--m-micro), transform 200ms var(--ease-spring), background 220ms var(--ease);
}
.tab-item:active{ transform:scale(.94); }
.tab-item.active{ color:var(--accent); background:rgba(var(--accent-rgb),.10); }
.tab-label{ font-size:11px; font-weight:600; }

/* Empty state */
.empty-state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:var(--sp-7) var(--sp-5); color:var(--ink-muted); flex:1; justify-content:center;
}
.empty-icon{
  width:56px; height:56px; border-radius:var(--r-md); background:var(--surface);
  border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 8px rgba(0,0,0,.25);
  display:flex; align-items:center; justify-content:center; color:var(--ink-muted);
  margin-bottom:var(--sp-4);
}
.empty-title{ font-size:var(--fs-subheading); font-weight:600; color:var(--ink); margin-bottom:var(--sp-2); }
.empty-text{ font-size:var(--fs-body); line-height:1.55; max-width:280px; }

/* Hero (Today) */
.hero{
  background:linear-gradient(160deg, rgba(var(--accent-rgb),.14), var(--surface-glass) 60%);
  -webkit-backdrop-filter:blur(24px) saturate(150%); backdrop-filter:blur(24px) saturate(150%);
  border:1px solid rgba(var(--accent-rgb),.18);
  border-radius:var(--r-lg); box-shadow:var(--shadow-card);
  padding:var(--sp-5) var(--sp-4); margin-bottom:var(--sp-4);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .hero{ background:linear-gradient(160deg, rgba(var(--accent-rgb),.14), var(--surface) 60%); }
}
.hero-eyebrow{ font-size:var(--fs-caption); color:var(--ink-muted); font-weight:600; margin-bottom:var(--sp-1); }
.hero-title{ font-size:var(--fs-display); font-weight:600; margin-bottom:var(--sp-1); }
.hero-sub{ font-size:var(--fs-body); color:var(--ink-muted); margin-bottom:var(--sp-4); }

.section-label{ font-size:var(--fs-caption); font-weight:600; color:var(--ink-muted); margin:0 0 var(--sp-3); }

/* Reflection — the one screen allowed to move slower, deliberately */
.pace-reflective{ animation-duration:var(--m-reflective); }
.pace-reflective textarea.field{ line-height:1.6; }

/* utility */
.stack{ display:flex; flex-direction:column; gap:var(--sp-3); }
.journey-bridge{
  position:relative; perspective:700px; perspective-origin:50% 50%;
  padding:var(--sp-4) 0 var(--sp-5);
}
.bridge-cables{ position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.bridge-cable{ fill:none; stroke:rgba(var(--accent-rgb),.4); stroke-width:1.6; }
.bridge-hanger{ stroke:rgba(var(--accent-rgb),.2); stroke-width:1; }
.bridge-tower{ stroke:rgba(255,255,255,.16); stroke-width:2.5; stroke-linecap:round; }
.cable-light{
  position:absolute; width:5px; height:5px; border-radius:50%;
  background:#FFE9C2; box-shadow:0 0 5px 1px rgba(255,220,160,.85);
  transform:translate(-50%,-50%); z-index:0; pointer-events:none;
  animation:cableTwinkle 2.6s ease-in-out infinite;
}
@keyframes cableTwinkle{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
.journey-deck{
  position:absolute; left:50%; top:0; bottom:0; width:4px; transform:translateX(-50%); z-index:0;
  background:linear-gradient(180deg, transparent, rgba(var(--accent-rgb),.45) 6%, rgba(var(--accent-rgb),.45) 94%, transparent);
  border-radius:3px;
}
.journey-stop{
  position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;
  margin-bottom:var(--sp-5);
  transform:rotateX(6deg); transform-origin:center bottom;
  -webkit-backface-visibility:visible; backface-visibility:visible;
  transition:transform 260ms var(--ease-spring);
}
@supports not (transform-style: preserve-3d){ .journey-stop{ transform:none; } }
@media (prefers-reduced-motion: reduce){ .journey-stop{ transform:none; } .cable-light{ animation:none; } }

.journey-stop-marker{
  position:relative; width:38px; height:38px; border-radius:50%; flex-shrink:0;
  border:2px solid rgba(var(--accent-rgb),.4);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:13px; color:var(--ink);
  background:radial-gradient(circle at 35% 30%, rgba(var(--accent-rgb),.2), var(--surface) 72%);
}
.journey-stop-current .journey-stop-marker{
  border-color:var(--accent); color:#fff;
  animation:markerPulse 1.8s ease-in-out infinite;
}
@keyframes markerPulse{
  0%,100%{ box-shadow:0 0 0 6px rgba(var(--accent-rgb),.12), 0 0 20px rgba(var(--accent-rgb),.4); }
  50%{ box-shadow:0 0 0 9px rgba(var(--accent-rgb),.18), 0 0 32px rgba(var(--accent-rgb),.6); }
}
.journey-stop-done .journey-stop-marker{ opacity:.55; }
.journey-stop-upcoming .journey-stop-marker{ opacity:.4; }

.journey-thread{ width:1.5px; height:12px; background:linear-gradient(180deg, rgba(var(--accent-rgb),.6), rgba(var(--accent-rgb),.12)); }

/* Performance-critical: only the current level's card gets real backdrop-filter
   glass (a single element, safe). Completed/upcoming cards use a solid surface
   with border+shadow depth instead — a major with 10 levels must never blur
   10 simultaneous cards. */
.journey-stop-inner{
  width:82%; max-width:340px; text-align:start;
  background:var(--surface); border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-md); box-shadow:var(--shadow-card);
  padding:var(--sp-3) var(--sp-4);
}
.journey-stop-upcoming .journey-stop-inner{ opacity:.5; }
.journey-stop-current .journey-stop-inner{
  background:rgba(255,255,255,.055);
  -webkit-backdrop-filter:blur(22px) saturate(160%); backdrop-filter:blur(22px) saturate(160%);
  border-color:rgba(var(--accent-rgb),.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 10px 28px rgba(var(--accent-rgb),.22);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .journey-stop-current .journey-stop-inner{ background:rgba(var(--accent-rgb),.08); }
}
.journey-stop-title{ font-size:14px; font-weight:700; }
.journey-stop-badge{ font-size:11px; color:var(--ink-muted); margin-top:2px; }
.journey-stop-courses{ margin-top:8px; display:flex; flex-direction:column; gap:4px; }
.journey-course-row{ font-size:12px; color:var(--ink-muted); }
.stack > *{ animation:fadeIn 380ms var(--ease) backwards; }
.stack > *:nth-child(1){ animation-delay:0ms; }
.stack > *:nth-child(2){ animation-delay:35ms; }
.stack > *:nth-child(3){ animation-delay:70ms; }
.stack > *:nth-child(4){ animation-delay:105ms; }
.stack > *:nth-child(n+5){ animation-delay:140ms; }
.hidden{ display:none !important; }
</style>
</head>

function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
function installBannerDismissed(){
  return localStorage.getItem("studymate_install_dismissed") === "1";
}
function dismissInstallBanner(){
  localStorage.setItem("studymate_install_dismissed", "1");
}

      ar:"بعد أساسيات البرمجة، هذا المقرر يأخذك لمفاهيم أعمق: المؤشرات، إدارة الذاكرة، والتعامل مع الملفات — أدوات المبرمج الحقيقي، لا التمارين المبسّطة فقط.",
      en:"After programming basics, this course takes you into deeper territory: pointers, memory management, and file handling — a real programmer's tools, not just simplified exercises."
    },
    why:{
      ar:"المؤشرات تحديدًا نقطة تعثر شهيرة لأغلب طلاب البرمجة — فهمها هنا جيدًا يوفر عليك صعوبة مضاعفة في مقررات هياكل البيانات القادمة.",
      en:"Pointers specifically are a famous stumbling block for most programming students — understanding them well here saves you double the difficulty in upcoming data structures courses."
    },
    connections:{ requires:[{ar:"البرمجة 1 (COMP 112)", en:"Programming 1 (COMP 112)"}], leadsTo:[{ar:"البرمجة الكائنية (COMP 214)", en:"OOP (COMP 214)"},{ar:"هياكل البيانات والخوارزميات (COMP 321)", en:"Data Structures & Algorithms (COMP 321)"}] },
    resources:[
      { title:{ar:"تعلم البرمجة بلغة C++ من الصفر (مساقات، مجاني)", en:"Learn C++ From Scratch (Msaaqat, Free)"}, url:"https://www.msaaqat.com/course/220/%D8%AA%D8%B9%D9%84%D9%85-%D8%A7%D9%84%D8%A8%D8%B1%D9%85%D8%AC%D8%A9-%D8%A8%D9%84%D8%BA%D8%A9-c-%D9%85%D9%86-%D8%A7%D9%84%D8%B5%D9%81%D8%B1", reason:{ar:"مجانية بالكامل، وتغطي بالضبط المؤشرات والبرمجة الكائنية والملفات بترتيب منطقي متدرج", en:"Completely free, and covers exactly pointers, OOP, and files in a logical, gradual order"} }
    ]
  },
  "COMP 321": {
    explain:{
      ar:"هذا هو جوهر تخصصك الحقيقي — هياكل البيانات (كيف تُنظَّم المعلومات في الذاكرة) والخوارزميات (كيف تحل المسائل بكفاءة). كل شيء قبل هذا المقرر كان تحضيرًا له.",
      en:"This is the true core of your major — data structures (how information is organized in memory) and algorithms (how to solve problems efficiently). Everything before this course was preparation for it."
    },
    why:{
      ar:"هذا تحديدًا المقرر اللي يُسأل عنه في أي مقابلة عمل تقنية — إتقانه الآن استثمار مباشر في مستقبلك المهني، لا مجرد اجتياز مقرر.",
      en:"This specific course is what gets asked about in any technical job interview — mastering it now is a direct investment in your career, not just passing a course."
    },
    connections:{ requires:[{ar:"البرمجة 2 (COMP 213)", en:"Programming 2 (COMP 213)"}] },
    resources:[
      { title:{ar:"دورة الخوارزميات وهياكل البيانات (يوتيوب، ٥٧ فيديو، مجاني)", en:"Algorithms & Data Structures Course (YouTube, 57 videos, Free)"}, url:"https://www.youtube.com/playlist?list=PL88kafUXXgBaAgb0h3-ZMvzxb5J2qFrut", reason:{ar:"سلسلة شاملة ومجانية بالكامل، مصممة أيضًا لمن يحضّر لمقابلات العمل التقنية — تخدمك الآن ومستقبلًا", en:"A comprehensive, completely free series, also designed for technical interview prep — serves you now and later"} }
    ]
  },
  "ITEC 211": {
    explain:{
      ar:"كيف تُنظَّم البيانات الحقيقية (بيانات جامعة، متجر، تطبيق) في هيكل منطقي قابل للبحث والتحديث بسرعة — من فكرة قاعدة البيانات وحتى كتابة استعلامات SQL فعلية.",
      en:"How real-world data (a university's, a store's, an app's) is organized into a logical structure that can be searched and updated quickly — from the idea of a database to writing actual SQL queries."
    },
    why:{
      ar:"تقريبًا كل نظام برمجي حقيقي يعتمد على قاعدة بيانات خلفه — هذا المقرر يبني مهارة تحتاجها في أي وظيفة برمجة تقريبًا، لا مجرد مقرر تخصص ضيق.",
      en:"Almost every real software system has a database behind it — this course builds a skill you'll need in nearly any programming job, not just a narrow specialty course."
    },
    connections:{ requires:[{ar:"البرمجة 1 (COMP 112)", en:"Programming 1 (COMP 112)"}] },
    resources:[
      { title:{ar:"قواعد بيانات شرح تفصيلي من الصفر (يوتيوب، مجاني)", en:"Database Explained From Scratch (YouTube, Free)"}, url:"https://www.youtube.com/watch?v=q8VilMwPrR0", reason:{ar:"شرح نظري متسلسل من الصفر، مجاني بالكامل، يغطي المفاهيم الأساسية قبل الدخول لأي برنامج بعينه", en:"A step-by-step theoretical explanation from scratch, completely free, covering the fundamentals before touching any specific software"} }
    ]
  },
  "ITEC 212": {
    explain:{
      ar:"استكمال مباشر لمفاهيم قواعد البيانات — هنا تدخل عمليًا: لغة SQL لكتابة الاستعلامات، إدارة المستخدمين والصلاحيات، وكيف يدير النظام فعليًا قاعدة بيانات ضخمة بكفاءة.",
      en:"A direct continuation of database concepts — here you go hands-on: SQL for writing queries, managing users and permissions, and how a system actually manages a massive database efficiently."
    },
    why:{
      ar:"SQL تحديدًا من أكثر المهارات طلبًا في سوق العمل البرمجي — هذا المقرر يحوّل الفهم النظري من ITEC 211 لمهارة عملية توظّفك مباشرة.",
      en:"SQL specifically is one of the most in-demand skills in the programming job market — this course turns the theoretical understanding from ITEC 211 into a practical, directly employable skill."
    },
    connections:{ requires:[{ar:"مفاهيم وتصميم قواعد البيانات (ITEC 211)", en:"Database Concepts & Design (ITEC 211)"}] },
    resources:[
      { title:{ar:"DBMS نظم إدارة قواعد البيانات (يوتيوب، ٣٤ محاضرة، مجاني)", en:"DBMS (YouTube, 34 lectures, Free)"}, url:"https://www.youtube.com/playlist?list=PLZNz7wrFA85D5pSkOH0_eWLd3Ep2d4AOp", reason:{ar:"سلسلة عربية شاملة مخصصة بالكامل لأنظمة إدارة قواعد البيانات تحديدًا، لا المفاهيم العامة فقط", en:"A comprehensive Arabic series dedicated entirely to database management systems specifically, not just general concepts"} },
      { title:{ar:"مقدمة في قواعد بيانات SQL Server (إدراك، مجاني)", en:"Intro to SQL Server Databases (Edraak, Free)"}, url:"https://www.edraak.org/programs/course/sql1-v1/", reason:{ar:"من منصة إدراك الرسمية، تطبيق عملي حقيقي لكتابة استعلامات SQL — يكمّل الفهم النظري من المصدر الأول بتمارين فعلية", en:"From the official Edraak platform, real hands-on practice writing SQL queries — complements the theoretical understanding from the first resource with actual exercises"} }
    ]
  },
  "PHYS 204": {
    explain:{
      ar:"مبادئ الفيزياء الأساسية (الحركة، القوة، الطاقة) بمنظور هندسي — أساس رياضي وفيزيائي عام يحتاجه أي مهندس أو عالم حاسب لفهم الأنظمة الفيزيائية اللي قد يبرمجها لاحقًا.",
      en:"Fundamental physics principles (motion, force, energy) from an engineering perspective — a general mathematical and physical foundation any engineer or computer scientist needs to understand the physical systems they might later program."
    },
    why:{
      ar:"حتى في تخصص حاسب بحت، هذا المقرر يبني طريقة تفكير تحليلية كمية تفيدك في أي مقرر يحتاج نمذجة رياضية لاحقًا.",
      en:"Even in a pure computer science major, this course builds a quantitative analytical thinking style that helps in any later course requiring mathematical modeling."
    },
    resources:[
      { title:{ar:"سلسلة شرح الفيزياء ١ (يوتيوب، مجاني)", en:"Physics 1 Explained (YouTube, Free)"}, url:"https://www.youtube.com/playlist?list=PLkgbZlu_ZYfmXj5GheoHliub92rGAfxWj", reason:{ar:"سلسلة عربية مجانية بمنظور هندسي، تناسب طالب يحتاج فهمًا تطبيقيًا للفيزياء لا نظريًا بحتًا فقط", en:"A free Arabic series with an engineering perspective, suited for a student who needs an applied understanding of physics, not just pure theory"} }
    ]
  },
  "COMP 214": {
    explain:{
      ar:"طريقة تفكير جديدة كليًا في تنظيم الكود — بدل سلسلة أوامر متتالية، تبني \"كائنات\" تمثل أشياء حقيقية (طالب، حساب بنكي، سيارة)، لكل واحد خصائصه وسلوكه الخاص.",
      en:"A completely new way of organizing code — instead of a sequential list of instructions, you build \"objects\" representing real things (a student, a bank account, a car), each with its own properties and behavior."
    },
    why:{
      ar:"أغلب لغات البرمجة الحديثة وأغلب الأنظمة الكبيرة مبنية على هذا الأسلوب — فهمه هنا جيدًا يفتح لك أبواب أي مقرر أو مشروع برمجي متقدم لاحقًا.",
      en:"Most modern programming languages and most large systems are built on this style — understanding it well here opens the door to any advanced programming course or project later."
    },
    connections:{ requires:[{ar:"البرمجة 2 (COMP 213)", en:"Programming 2 (COMP 213)"}] },
    resources:[
      { title:{ar:"شرح البرمجة كائنية التوجه (يوتيوب، مجاني)", en:"Object-Oriented Programming Explained (YouTube, Free)"}, url:"https://www.youtube.com/playlist?list=PLuXY3ddo_8nzUrgCyaX_WEIJljx_We-c1", reason:{ar:"سلسلة عربية مجانية بالكامل تشرح المفاهيم الأساسية (الكلاس، الكائن، الوراثة) بأمثلة مباشرة", en:"A completely free Arabic series explaining the core concepts (class, object, inheritance) with direct examples"} }
    ]
  },
  "COMP 231": {
    explain:{
      ar:"كيف يفهم الحاسب فعليًا لغة الصفر والواحد — من البوابات المنطقية الأساسية (AND، OR، NOT) وحتى بناء دارات تجمع وتقارن وتحسب، وهي أساس كل معالج حقيقي.",
      en:"How a computer actually understands the language of zeros and ones — from basic logic gates (AND, OR, NOT) to building circuits that add, compare, and calculate, the foundation of every real processor."
    },
    why:{
      ar:"هذا المقرر يكشف \"الصندوق الأسود\" اللي يعمل بداخله كل جهاز حاسب — يفهم الطالب أخيرًا كيف يتحول الكود الذي يكتبه إلى إشارات كهربائية فعلية.",
      en:"This course opens up the \"black box\" every computer works inside of — the student finally understands how the code they write becomes actual electrical signals."
    },
    resources:[
      { title:{ar:"دورة Digital Logic Design كاملة (Free4arab، مجاني)", en:"Complete Digital Logic Design Course (Free4arab, Free)"}, url:"https://free4arab.net/courses/digital-logic-design/", reason:{ar:"٣١ محاضرة مجانية بالكامل (٥٠ ساعة محتوى)، تغطي المنهج كاملًا من الأنظمة العددية حتى الدارات المتسلسلة", en:"31 completely free lectures (50 hours of content), covering the full curriculum from number systems to sequential circuits"} }
    ]
  },
  "ITEC 251": {
    explain:{
      ar:"كيف تنتقل البيانات فعليًا من جهازك لجهاز آخر عبر العالم — طبقات الشبكة (OSI وTCP/IP)، وكيف تتحول رسالة أو صورة ترسلها إلى إشارات تسافر عبر الكابلات والأقمار الصناعية.",
      en:"How data actually travels from your device to another across the world — network layers (OSI and TCP/IP), and how a message or image you send turns into signals traveling through cables and satellites."
    },
    why:{
      ar:"الإنترنت نفسه مبني على هذي المفاهيم — فهمها يفسر لك ليش أحيانًا الاتصال بطيء، وكيف تتواصل التطبيقات والمواقع فعليًا خلف الكواليس.",
      en:"The internet itself is built on these concepts — understanding them explains why a connection is sometimes slow, and how apps and websites actually communicate behind the scenes."
    },
    resources:[
      { title:{ar:"أساسيات شبكات الكمبيوتر — Google (Coursera، مجاني)", en:"Computer Networking Basics — Google (Coursera, Free)"}, url:"https://www.coursera.org/learn/computer-networking-ar", reason:{ar:"دورة رسمية من Google بالعربي، يمكن التسجيل فيها مجانًا (Enroll for free) لمشاهدة كل محتوى الدورة", en:"An official Google course in Arabic, free to enroll in (\"Enroll for free\") to watch all course content"} }
    ]
  },
  "COMP 332": {
    explain:{
      ar:"كيف تُبنى الآلة الحاسوبية من الداخل فعليًا — وحدة المعالجة المركزية، الذاكرة، طريقة تنفيذ الأوامر خطوة بخطوة — الطبقة اللي بين الكود اللي تكتبه والدوائر الإلكترونية الفعلية.",
      en:"How the computer machine is actually built inside — the CPU, memory, how instructions execute step by step — the layer between the code you write and the actual electronic circuits."
    },
    why:{
      ar:"فهم هذا يفسر لك ليش بعض الأكواد أسرع من غيرها فعليًا على مستوى الجهاز، ويبني حدسًا تقنيًا عميقًا يميّزك عن مبرمج يعرف الكود فقط دون فهم ما تحته.",
      en:"Understanding this explains why some code is actually faster at the hardware level, and builds deep technical intuition that sets you apart from a programmer who only knows the code without understanding what's beneath it."
    },
    connections:{ requires:[{ar:"التصميم الرقمي (COMP 231)", en:"Digital Design (COMP 231)"}] },
    resources:[
      { title:{ar:"مادة تنظيم وعمارة الحاسب بالعربية (يوتيوب، ٣٩ محاضرة، مجاني)", en:"Computer Organization & Architecture in Arabic (YouTube, 39 lectures, Free)"}, url:"https://www.youtube.com/playlist?list=PLGqb1w5WKZITfAcpt_q8oUYb1yHtFEgeU", reason:{ar:"سلسلة عربية كاملة ومجانية بالكامل، تغطي المنهج من المقدمة حتى التفاصيل المتقدمة لتنظيم الحاسب", en:"A complete, entirely free Arabic series covering the curriculum from the introduction to advanced details of computer organization"} }
    ]
  },
  "ENGL 101": {
    explain:{
      ar:"هذا المقرر الأثقل في خطتك بالكامل (٩ ساعات معتمدة لمقرر واحد) — يبني أساس اللغة الإنجليزية العملي: مفردات، قواعد أولية، والمهارات الأربع معًا (استماع، محادثة، قراءة، كتابة).",
      en:"This is the single heaviest course in your entire plan (9 credit hours for one course) — it builds practical English fluency: vocabulary, early grammar, and all four skills together (listening, speaking, reading, writing)."
    },
    why:{
      ar:"تخصصك بأكمله مبني فوق هذا الأساس — كل مقرر لاحق (حتى الترجمة نفسها) يفترض إتقانًا متزايدًا لما يُبنى هنا بالضبط.",
      en:"Your entire major is built on top of this foundation — every later course (even translation itself) assumes growing mastery of exactly what's built here."
    },
    connections:{ leadsTo:[{ar:"قواعد 1 (ENGL 102)", en:"Grammar 1 (ENGL 102)"},{ar:"اللغة الإنجليزية 2 (ENGL 104)", en:"English Language 2 (ENGL 104)"}] },
    resources:[
      { title:{ar:"Duolingo — تطبيق تعلّم الإنجليزية", en:"Duolingo — English Learning App"}, url:"https://ar.duolingo.com/course/en/ar/%D8%AA%D8%B9%D9%84%D9%85-%D8%A7%D9%84%D8%A5%D9%86%D8%AC%D9%84%D9%8A%D8%B2%D9%8A%D8%A9", reason:{ar:"مجاني بالكامل، يبني المفردات والقواعد تدريجيًا بجلسات قصيرة يومية — مثالي كممارسة يومية موازية للمقرر، لا بديل عنه", en:"Completely free, builds vocabulary and grammar gradually through short daily sessions — ideal as daily practice alongside the course, not a replacement for it"} },
      { title:{ar:"تعلم الإنجليزية من الصفر — المستوى الأول (يوتيوب، ٢٥ فيديو، عربي)", en:"Learn English From Scratch — Level 1 (YouTube, 25 videos, Arabic)"}, url:"https://www.youtube.com/playlist?list=PLp22-4PivYmIFAnru_L7fnMhSV5YffLTZ", reason:{ar:"شرح كامل بالعربي من قناة يُجمع على أنها من الأفضل عربيًا لتعليم الإنجليزية للمبتدئين — بديل لمن يحتاج شرحًا عربيًا كاملًا لا مجرد تطبيق تفاعلي", en:"A complete Arabic-narrated course from a channel widely regarded as one of the best Arabic resources for teaching English to beginners — for anyone who needs full Arabic explanation, not just an interactive app"} }
    ]
  },
  "ENGL 201": {
    explain:{
      ar:"الفرق بين الكتابة اليومية والكتابة الأكاديمية — كيف تبني فقرة لها فكرة رئيسية واضحة، وتربط أفكارك بترابط منطقي يقنع القارئ الأكاديمي تحديدًا.",
      en:"The difference between everyday writing and academic writing — how to build a paragraph with a clear main idea, and connect your ideas with logical coherence that convinces an academic reader specifically."
    },
    why:{
      ar:"كل بحث أو مقال أكاديمي تكتبه لبقية مشوارك الجامعي يعتمد على المهارة اللي تُبنى هنا بالضبط — هذا أساس، لا مقرر جانبي.",
      en:"Every research paper or academic article you write for the rest of your university journey depends on exactly the skill built here — this is a foundation, not a side course."
    },
    connections:{ requires:[{ar:"اللغة الإنجليزية 1 (ENGL 101)", en:"English Language 1 (ENGL 101)"},{ar:"قواعد 1 (ENGL 102)", en:"Grammar 1 (ENGL 102)"}], leadsTo:[{ar:"مقدمة في الترجمة (ENGL 203)", en:"Intro to Translation (ENGL 203)"}] },
    resources:[
      { title:{ar:"دورة مهارات الكتابة باللغة الإنجليزية (إدراك، مجاني)", en:"English Writing Skills Course (Edraak, Free)"}, url:"https://www.edraak.org/programs/course/ew101-vt3_2018/", reason:{ar:"من منصة إدراك المعروفة (بدعم مؤسسة الملكة رانيا)، مجانية بالكامل، تركز على بناء الأفكار والتعبير الواضح في السياق الأكاديمي تحديدًا", en:"From the well-known Edraak platform (backed by the Queen Rania Foundation), completely free, focused on building ideas and clear expression specifically in an academic context"} }
    ]
  },
  "ENGL 203": {
    explain:{
      ar:"أول مقرر ترجمة حقيقي في مسارك — هنا يبدأ الانتقال من \"أعرف الإنجليزية\" إلى \"أترجم بمهنية\": فهم روح النص لا ترجمته حرفيًا، والفرق بين المعنى والصياغة.",
      en:"Your first real translation course — this is where the shift begins from \"I know English\" to \"I translate professionally\": understanding a text's spirit rather than translating it literally, and the difference between meaning and phrasing."
    },
    why:{
      ar:"هذا هو جوهر تخصصك الحقيقي (يبدأ في المستوى الثالث بالضبط) — كل مقررات الترجمة المتخصصة لاحقًا (قانونية، فورية، أدبية) تعتمد على المهارة اللي تُبنى هنا أولًا.",
      en:"This is the true core of your major (beginning exactly at Level 3) — every specialized translation course later (legal, simultaneous, literary) depends on the skill built here first."
    },
    connections:{ requires:[{ar:"الكتابة الأكاديمية (ENGL 201)", en:"Academic Writing (ENGL 201)"}], leadsTo:[{ar:"الترجمة باستخدام الحاسب (ENGL 310)", en:"CAT Tools (ENGL 310)"}] },
    resources:[
      { title:{ar:"المهارات الأساسية للترجمة (رواق، مجاني)", en:"Basic Translation Skills (Rwaq, Free)"}, url:"https://www.rwaq.org/courses/basictranslationskills", reason:{ar:"من منصة رواق السعودية المعروفة، بتدريس أستاذ متخصص فعليًا في دراسات الترجمة — يغطي بالضبط فهم روح النص وتجنب الترجمة الحرفية", en:"From the well-known Saudi platform Rwaq, taught by a professor genuinely specialized in translation studies — covers exactly understanding a text's spirit and avoiding literal translation"} }
    ]
  },
  "ENGL 102": {
    explain:{
      ar:"القواعد هي الهيكل اللي تُبنى عليه كل جملة صحيحة — ترتيب الكلمات، الأزمنة، أدوات التعريف. مختلفة جذريًا عن قواعد العربية، فتحتاج تعلّمًا واعيًا، لا حدسًا فقط.",
      en:"Grammar is the structure every correct sentence is built on — word order, tenses, articles. It's fundamentally different from Arabic grammar, so it needs conscious learning, not just intuition."
    },
    why:{
      ar:"أخطاء القواعد هي أكثر ما يُفقد نقاطًا في مقررات الترجمة لاحقًا — ترجمة بمعنى صحيح لكن بقواعد خاطئة تُعتبر ترجمة ضعيفة مهنيًا.",
      en:"Grammar mistakes are what costs the most points in later translation courses — a translation with the right meaning but wrong grammar is considered professionally weak."
    },
    connections:{ requires:[{ar:"اللغة الإنجليزية 1 (ENGL 101)", en:"English Language 1 (ENGL 101)"}], leadsTo:[{ar:"الكتابة الأكاديمية (ENGL 201)", en:"Academic Writing (ENGL 201)"}] },

function enrichmentForCourse(courseName){
  if(!courseName) return null;
  const code = Object.keys(COURSE_ENRICHMENT).find(c => courseName.trim().startsWith(c));
  return code ? COURSE_ENRICHMENT[code] : null;
}
/* Suggests one of the "how to study this kind of subject" technique skills
   based on keywords in the course name — works for every course, not just
   the ones we've researched enrichment for. */
function matchingTechniqueSkillId(courseName){
  if(!courseName) return null;
  if(/رياضيات|جبر|تفاضل|إحصاء|معادلات|احتمالات/.test(courseName)) return "math-study-technique";
  if(/فيزياء|كيمياء/.test(courseName)) return "science-study-technique";
  if(/نحو|صرف/.test(courseName)) return "grammar-study-technique";
  return null;
}
function catalogKeyFor(student){
  if(!student) return null;
  return `${student.universityId}-${student.collegeId}-${student.majorId}`;
}
/* Current level's courses first (the common case), then every other level's
   courses after — so a retaken course from an earlier level is still one
   search away, without slowing down the normal, far more frequent case. */
function coursesForStudentAllLevels(student, currentLevelLabel){
  const catalog = COURSE_CATALOG[catalogKeyFor(student)];
  if(!catalog) return null;
  const currentLevelId = levelIdForLabel(currentLevelLabel);
  const ordered = [];
  if(currentLevelId && catalog[currentLevelId]) ordered.push(...catalog[currentLevelId]);
  LEVELS.forEach(lv=>{
    if(lv.id===currentLevelId) return;
    if(catalog[lv.id]) ordered.push(...catalog[lv.id]);
  });
  return ordered;
}

/* ============================================================
   D. STORAGE LAYER — single on-device source of truth (offline-first)
   ============================================================ */
const DB_KEY = "studymate_p5_v1";
const DB_VERSION = 1;
function emptyDB(){
  return { version:DB_VERSION, students:{}, journeys:{}, semesters:{}, courses:{}, academicEvents:{}, reflections:{}, achievements:{}, terms:{}, skillViews:{}, archivedSkills:{}, courseNotebooks:{}, weeklySessions:{}, rawNotes:{} };
}
let DB = null;
function dbLoad(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      DB = JSON.parse(raw);
      if(DB && DB.version){
        const blank = emptyDB();
        Object.keys(blank).forEach(t=>{ if(!DB[t]) DB[t] = blank[t]; });
        return;
      }
    }
  }catch(e){}
  DB = emptyDB();
}
function dbSave(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function genId(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function dbInsert(table, rec){ DB[table][rec.id]=rec; dbSave(); return rec; }
function dbUpdate(table, id, patch){ const r=DB[table][id]; if(!r) return null; Object.assign(r,patch); dbSave(); return r; }
function dbDelete(table, id){ delete DB[table][id]; dbSave(); }
function dbGet(table, id){ return id ? (DB[table][id]||null) : null; }
function dbAll(table){ return Object.values(DB[table]); }
function dbQuery(table, pred){ return dbAll(table).filter(pred); }

/* ---- Semester ---- */
function nextLevelLabel(currentLabel){
  const idx = LEVELS.findIndex(l=> l.ar===currentLabel || l.en===currentLabel);
  if(idx===-1 || idx===LEVELS.length-1) return currentLabel;
  return LEVELS[idx+1][lang()];
}
function levelIdForLabel(label){
  const found = LEVELS.find(l=> l.ar===label || l.en===label);
  return found ? found.id : null;
}
const SemesterModule = {
  createFirst(journeyId, label){
    return dbInsert("semesters", { id:genId(), journeyId, index:1, label, status:"current", createdAt:Date.now() });
  },
  current(journeyId){ return dbQuery("semesters", s=>s.journeyId===journeyId && s.status==="current")[0] || null; },
  listForJourney(journeyId){ return dbQuery("semesters", s=>s.journeyId===journeyId).sort((a,b)=>a.index-b.index); },
  complete(semesterId){ dbUpdate("semesters", semesterId, { status:"done" }); },
  /* closes the current semester and opens the next one — the moment the Academic Journey carries forward */
  startNext(journeyId, currentSemester){
    this.complete(currentSemester.id);
    const newLabel = nextLevelLabel(currentSemester.label);
    return dbInsert("semesters", { id:genId(), journeyId, index:currentSemester.index+1, label:newLabel, status:"current", createdAt:Date.now() });
  }
};

/* A curated palette that reads well on our dark surfaces — distinct enough
   to tell subjects apart at a glance, muted enough not to clash with the
   rest of the UI. Matches the spirit of the colorful printable timetables
   students already use, adapted for a dark theme. */
const COURSE_COLOR_PALETTE = [
  "#5B93E0", "#D9A15E", "#7FA88C", "#C77B7B", "#9B7FC7",
  "#6FB3B8", "#D4915E", "#8C9AA8", "#B8935E", "#7B9BC7"
];
function courseColorFor(course){
  if(!course) return COURSE_COLOR_PALETTE[0];
  if(course.color) return course.color;
  // stable fallback so an uncolored course still looks consistent every time,
  // not random on each render
  let hash = 0;
  for(let i=0;i<course.id.length;i++) hash = (hash*31 + course.id.charCodeAt(i)) >>> 0;
  return COURSE_COLOR_PALETTE[hash % COURSE_COLOR_PALETTE.length];
}
const CourseModule = {
  create(semesterId, data){
    return dbInsert("courses", { id:genId(), semesterId, name:data.name, professor:data.professor||"", color:data.color||null, createdAt:Date.now() });
  },
  update(id, data){ return dbUpdate("courses", id, { name:data.name, professor:data.professor||"", color:data.color!==undefined?data.color:CourseModule.get(id).color }); },
  setColor(id, color){ return dbUpdate("courses", id, { color }); },
  listForSemester(semesterId){ return dbQuery("courses", c=>c.semesterId===semesterId).sort((a,b)=>a.createdAt-b.createdAt); },
  get(id){ return dbGet("courses", id); },
  delete(id){
    dbQuery("academicEvents", e=>e.courseId===id).forEach(e=>dbDelete("academicEvents", e.id));
    dbDelete("courses", id);
  }
};

/* Days of the week, Sunday-first to match the academic week. dayOfWeek uses
   JS's native getDay() convention (0=Sunday...6=Saturday) so "today" lookups
   need no conversion. */
const WEEKDAYS = [
  {id:0, ar:"الأحد", en:"Sunday"},
  {id:1, ar:"الاثنين", en:"Monday"},
  {id:2, ar:"الثلاثاء", en:"Tuesday"},
  {id:3, ar:"الأربعاء", en:"Wednesday"},
  {id:4, ar:"الخميس", en:"Thursday"},
  {id:5, ar:"الجمعة", en:"Friday"},
  {id:6, ar:"السبت", en:"Saturday"}
];
/* Sunday at 00:00 of the current week — the academic week's natural anchor,
   matching WEEKDAYS[0]. Used to check "has this been touched since the week
   began" for the whitening ritual. */
function startOfThisWeek(){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  d.setDate(d.getDate() - d.getDay()); // getDay(): 0=Sunday already
  return d.getTime();
}
const WeeklyScheduleModule = {
  create(semesterId, courseId, dayOfWeek, startTime, endTime){
    return dbInsert("weeklySessions", { id:genId(), semesterId, courseId, dayOfWeek, startTime, endTime, createdAt:Date.now() });
  },
  update(id, data){
    return dbUpdate("weeklySessions", id, { courseId:data.courseId, dayOfWeek:data.dayOfWeek, startTime:data.startTime, endTime:data.endTime });
  },
  delete(id){ dbDelete("weeklySessions", id); },
  get(id){ return dbGet("weeklySessions", id); },
  /* every session for a semester, sorted by day then start time — the natural
     reading order for a weekly grid */
  listForSemester(semesterId){
    return dbQuery("weeklySessions", s=>s.semesterId===semesterId)
      .sort((a,b)=> a.dayOfWeek-b.dayOfWeek || (a.startTime||"").localeCompare(b.startTime||""));
  },
  listForDay(semesterId, dayOfWeek){
    return this.listForSemester(semesterId).filter(s=>s.dayOfWeek===dayOfWeek);
  },
  /* sessions falling on today's actual weekday, for Today-screen guidance */
  todaysSessions(semesterId){
    return this.listForDay(semesterId, new Date().getDay());
  },
  /* "ended" | "now" | "upcoming" — compared against the real current clock time,
     so guidance can nudge review right after class or prep right before it */
  sessionState(session){
    const now = new Date();
    const nowMinutes = now.getHours()*60 + now.getMinutes();
    const [sh,sm] = (session.startTime||"00:00").split(":").map(Number);
    const [eh,em] = (session.endTime||"00:00").split(":").map(Number);
    const startMinutes = sh*60+sm, endMinutes = eh*60+em;
    if(nowMinutes >= endMinutes) return "ended";
    if(nowMinutes >= startMinutes) return "now";
    return "upcoming";
  },
  /* true if a session is happening right now, or starts within the next
     hour — this is what gives the schedule its "pulse", a real sense that
     something is imminent, not just a static list of times */
  isImminent(session){
    const now = new Date();
    if(session.dayOfWeek !== now.getDay()) return false;
    const nowMinutes = now.getHours()*60 + now.getMinutes();
    const [sh,sm] = (session.startTime||"00:00").split(":").map(Number);
    const [eh,em] = (session.endTime||"00:00").split(":").map(Number);
    const startMinutes = sh*60+sm, endMinutes = eh*60+em;
    if(nowMinutes >= startMinutes && nowMinutes < endMinutes) return true; // happening now
    return startMinutes > nowMinutes && startMinutes - nowMinutes <= 60; // starts within the hour
  },
  /* how many real class meetings remain for this specific course strictly
     between today and a target date — turns "in 3 days" into something a
     student can act on, like "2 sessions left before then" */
  sessionsRemainingUntil(semesterId, courseId, targetDateStr){
    const sessions = this.listForSemester(semesterId).filter(sess=>sess.courseId===courseId);
    if(!sessions.length || !targetDateStr) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(targetDateStr+"T00:00:00");
    if(isNaN(target.getTime()) || target <= today) return 0;
    let total = 0;
    sessions.forEach(sess=>{
      const cursor = new Date(today);
      cursor.setDate(cursor.getDate()+1);
      while(cursor < target){
        if(cursor.getDay()===sess.dayOfWeek) total++;
        cursor.setDate(cursor.getDate()+1);
      }
    });
    return total;
  },
  /* does this specific course meet today? powers day-specific guidance —
     "you have class today, focus" vs "no class today, a free day to study" */
  hasClassToday(semesterId, courseId){
    return this.todaysSessions(semesterId).some(sess=>sess.courseId===courseId);
  }
};

/* ---- Academic Event (merges Assessment + Academic Event, per revised model) ----
   Attaches to a Course, OR directly to a Semester when the event isn't
   course-specific (e.g. a registration deadline) — per the approved
   backbone amendment. Exactly one of courseId/semesterId is set. */
const AcademicEventModule = {
  create(owner, data){
    return dbInsert("academicEvents", {
      id:genId(), courseId: owner.courseId||null, semesterId: owner.semesterId||null,
      title:data.title, date:data.date||"",
      isEvaluative: !!data.isEvaluative, createdAt:Date.now()
    });
  },
  update(id, data){
    return dbUpdate("academicEvents", id, { title:data.title, date:data.date||"", isEvaluative: !!data.isEvaluative });
  },
  delete(id){ dbDelete("academicEvents", id); },
  get(id){ return dbGet("academicEvents", id); },
  listForCourse(courseId){ return dbQuery("academicEvents", e=>e.courseId===courseId).sort((a,b)=>(a.date||"").localeCompare(b.date||"")); },
  listForCourses(courseIds){ return dbQuery("academicEvents", e=>courseIds.indexOf(e.courseId)!==-1); },
  /* semester-level events only (not tied to any course) */
  listForSemesterDirect(semesterId){ return dbQuery("academicEvents", e=>e.semesterId===semesterId && !e.courseId).sort((a,b)=>(a.date||"").localeCompare(b.date||"")); },
  /* everything Guidance needs to consider for a semester: its own events + every course's events */
  listAllForGuidance(semesterId, courseIds){
    return dbQuery("academicEvents", e => e.semesterId===semesterId || courseIds.indexOf(e.courseId)!==-1);
  }
};
/* Whether an event's date has already passed — a fact of the calendar, not
   something the student manages by hand. Undated events are never "past". */
function isEventPast(event){
  if(!event.date) return false;
  const d = daysUntil(event.date);
  return d !== null && d < 0;
}

/* ---- Term (personal glossary) — a running collection the student builds
   themselves. No dates, no priorities, no done/not-done status: this is
   deliberately not a task list, just a growing record of what they've learned. */
const REVIEW_INTERVALS_DAYS = [1, 3, 7, 14, 30];
const DAY_MS = 24*60*60*1000;
const TermModule = {
  list(){ return dbAll("terms").sort((a,b)=>b.createdAt-a.createdAt); },
  create(text, note, category){ return dbInsert("terms", { id:genId(), text, note:note||"", category:category||"general", reviewStage:0, nextReviewAt:Date.now(), createdAt:Date.now() }); },
  update(id, data){ return dbUpdate("terms", id, { text:data.text, note:data.note||"", category:data.category||"general" }); },
  delete(id){ dbDelete("terms", id); },
  get(id){ return dbGet("terms", id); },
  dueTerms(){
    const now = Date.now();
    return this.list().filter(term => (term.nextReviewAt===undefined) || term.nextReviewAt<=now);
  },
  markReviewed(id, remembered){
    const term = this.get(id);
    if(!term) return;
    if(remembered){
      const stage = Math.min((term.reviewStage||0) + 1, REVIEW_INTERVALS_DAYS.length - 1);
      dbUpdate("terms", id, { reviewStage:stage, nextReviewAt: Date.now() + REVIEW_INTERVALS_DAYS[stage]*DAY_MS, lastReviewedAt:Date.now() });
    } else {
      dbUpdate("terms", id, { reviewStage:0, nextReviewAt: Date.now() + REVIEW_INTERVALS_DAYS[0]*DAY_MS, lastReviewedAt:Date.now() });
    }
  }
};

/* Honest weekly progress mirror — only facts we can genuinely verify from
   real timestamped data (notes, checks, terms, reviews). Deliberately does
   NOT claim attendance, since we have no real check-in mechanism, and
   deliberately has no targets, streaks, or comparisons — a mirror, not a
   scoreboard. */
const WeeklyMirrorModule = {
  weekStart(){ return Date.now() - 7*DAY_MS; },
  notesThisWeek(){
    const cutoff = this.weekStart();
    let count = 0;
    Object.values(DB.courseNotebooks || {}).forEach(nb=>{
      (nb.notes||[]).forEach(n=>{ if(n.createdAt>=cutoff) count++; });
    });
    return count;
  },
  checksThisWeek(){
    const cutoff = this.weekStart();
    let understood = 0, notUnderstood = 0;
    Object.values(DB.courseNotebooks || {}).forEach(nb=>{
      (nb.checks||[]).forEach(c=>{
        if(c.createdAt>=cutoff){ if(c.understood) understood++; else notUnderstood++; }
      });
    });
    return { understood, notUnderstood, total: understood+notUnderstood };
  },
  termsThisWeek(){
    const cutoff = this.weekStart();
    return TermModule.list().filter(term=>term.createdAt>=cutoff).length;
  },
  reviewsThisWeek(){
    const cutoff = this.weekStart();
    return TermModule.list().filter(term=>term.lastReviewedAt && term.lastReviewedAt>=cutoff).length;
  }
};

/* ============================================================
   REMINDER ENGINE — deterministic, computed fresh, never stored
   ============================================================ */
function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
const ReminderEngine = {
  /* the single nearest event within a near-term window —
     considers both course events and semester-level events */
  nearest(semesterId, courseIds){
    const events = AcademicEventModule.listAllForGuidance(semesterId, courseIds).filter(e=>e.date);
    const withDays = events.map(e=>({ event:e, days:daysUntil(e.date) })).filter(x=>x.days!==null && x.days>=0 && x.days<=7);
    withDays.sort((a,b)=> a.days-b.days || (b.event.isEvaluative?1:0)-(a.event.isEvaluative?1:0));
    return withDays[0] || null;
  }
};

/* ============================================================
   RECOMMENDATION ENGINE — local heuristic, computed, offline
   ============================================================ */
const RecommendationEngine = {
  /* notices only genuine clustering; returns null rather than forcing a note */
  cluster(semesterId, courseIds){
    const events = AcademicEventModule.listAllForGuidance(semesterId, courseIds).filter(e=>e.date);
    const withDays = events.map(e=>({ event:e, days:daysUntil(e.date) })).filter(x=>x.days!==null && x.days>=0 && x.days<=7);
    if(withDays.length < 2) return null;
    return { count: withDays.length };
  }
};

/* ============================================================
   Reusable Picker Sheet — one component powering every
   University/College/Major/Level selection, per Simplicity First
   (reuse one mechanism rather than building four).
   ============================================================ */
function openPickerSheet({ title, options, selectedId, searchable, showOther, onSelect }){
  const s = t();
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  const optsHtml = options.map(o=>`<button type="button" class="picker-option ${selectedId===o.id?'selected':''}" data-val="${o.id}">${lang()==='ar'?o.ar:o.en}</button>`).join("");
  const otherHtml = showOther ? `<button type="button" class="picker-option other-option ${selectedId===OTHER_ID?'selected':''}" data-val="${OTHER_ID}">${s.otherOption}</button>` : "";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${title}</div>
      ${searchable ? `<div class="picker-search-wrap"><input type="text" class="field" id="pickerSearch" placeholder="${s.searchPh}" autocomplete="off"></div>` : ""}
      <div class="picker-list" id="pickerList">${optsHtml}${otherHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ overlay.classList.add("show"); }); });

  function close(after){
    overlay.classList.remove("show");
    setTimeout(()=>{ overlay.remove(); if(after) after(); }, 300);
  }
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) close(); });

  const search = overlay.querySelector("#pickerSearch");
  if(search){
    search.addEventListener("click", e=>e.stopPropagation());
    search.addEventListener("input", ()=>{
      const q = search.value.trim().toLowerCase();
      overlay.querySelectorAll(".picker-option").forEach(btn=>{
        btn.style.display = btn.textContent.trim().toLowerCase().includes(q) ? "" : "none";
      });
    });
  }
  overlay.querySelectorAll(".picker-option").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const val = btn.dataset.val;
      close(()=>{ onSelect(val); });
    });
  });
}

  else{ majEl.textContent = draft.majorId===OTHER_ID ? s.otherOption : (draft.major || s.selectPh); majEl.classList.toggle("placeholder", !draft.major && draft.majorId!==OTHER_ID); }

  const lvlEl = document.getElementById(prefix+"LevelValue");
  lvlEl.textContent = draft.level || s.selectPh;
  lvlEl.classList.toggle("placeholder", !draft.level);
}

function wireProfilePickers(prefix, draft, onChange){
  const s = t();
  document.getElementById(prefix+"UniversityTrigger").addEventListener("click", ()=>{
    openPickerSheet({
      title: s.universityLabel, options: INSTITUTIONS.map(x=>({id:x.id, ar:x.ar, en:x.en})),
      selectedId: draft.universityId, searchable:true, showOther:true,
      onSelect:(val)=>{
        if(val===OTHER_ID){ draft.universityId=OTHER_ID; draft.university=""; }
        else{ draft.universityId=val; draft.university=obLabel(INSTITUTIONS, val); }
        refreshProfilePickerUI(prefix, draft); if(onChange) onChange();
      }
    });
  });
  document.getElementById(prefix+"UniversityOther").addEventListener("input", (e)=>{ draft.university = e.target.value.trim(); if(onChange) onChange(); });

  document.getElementById(prefix+"CollegeTrigger").addEventListener("click", ()=>{
    openPickerSheet({
      title: s.collegeLabel, options: COLLEGES.map(x=>({id:x.id, ar:x.ar, en:x.en})),
      selectedId: draft.collegeId, searchable:false, showOther:true,
      onSelect:(val)=>{
        if(val===OTHER_ID){ draft.collegeId=OTHER_ID; draft.college=""; }
        else{ draft.collegeId=val; draft.college=obLabel(COLLEGES, val); }
        draft.majorId=""; draft.major="";
        refreshProfilePickerUI(prefix, draft); if(onChange) onChange();
      }
    });
  });

  document.getElementById(prefix+"MajorTrigger").addEventListener("click", ()=>{
    if(!draft.collegeId || draft.collegeId===OTHER_ID) return;
    const opts = majorList(draft.collegeId);
    openPickerSheet({
      title: s.majorLabel, options: opts.map(x=>({id:x.id, ar:x.ar, en:x.en})),
      selectedId: draft.majorId, searchable:opts.length>8, showOther:true,
      onSelect:(val)=>{
        if(val===OTHER_ID){ draft.majorId=OTHER_ID; draft.major=""; }
        else{ draft.majorId=val; draft.major=obLabel(opts, val); }
        refreshProfilePickerUI(prefix, draft); if(onChange) onChange();
      }
    });
  });
  document.getElementById(prefix+"MajorOther").addEventListener("input", (e)=>{ draft.major = e.target.value.trim(); if(onChange) onChange(); });

  document.getElementById(prefix+"LevelTrigger").addEventListener("click", ()=>{
    openPickerSheet({
      title: s.levelLabel, options: LEVELS.map(x=>({id:x.id, ar:x.ar, en:x.en})),
      selectedId: draft.levelId, searchable:false, showOther:false,
      onSelect:(val)=>{ draft.levelId=val; draft.level=obLabel(LEVELS, val); refreshProfilePickerUI(prefix, draft); if(onChange) onChange(); }
    });
  });
}

function validateProfileDraft(prefix, draft){
  let valid = true;
  const uniErr = document.getElementById(prefix+"UniversityError");
  const majErr = document.getElementById(prefix+"MajorError");
  if(!draft.university){ uniErr.classList.add("show"); valid=false; } else { uniErr.classList.remove("show"); }
  if(!draft.major){ majErr.classList.add("show"); valid=false; } else { majErr.classList.remove("show"); }
  return valid;
}

function showFlagshipMoment(message, onDone){

function shouldShowInstallBanner(){
  if(isStandalone() || installBannerDismissed()) return false;
  return !!deferredInstallPrompt || isIOS();
}
function renderInstallBannerHtml(){
  const s = t();
  if(!shouldShowInstallBanner()) return "";
  const isAndroidPrompt = !!deferredInstallPrompt;
  return `
    <div class="card" id="installBanner" style="cursor:default; align-items:flex-start;">
      <span class="card-icon">${ICON.download}</span>

function wireInstallBanner(afterRender){
  const btn = document.getElementById("installNowBtn");
  if(btn){
    btn.addEventListener("click", async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      afterRender();
    });
  }
  const dismiss = document.getElementById("installDismiss");
  if(dismiss) dismiss.addEventListener("click", ()=>{ dismissInstallBanner(); afterRender(); });
}
function renderToday(){
  applyDir();
  const s = t();
  const student = StudentModule.current();
  const journey = JourneyModule.forStudent(student.id);
  const semester = SemesterModule.current(journey.id);
  const courses = semester ? CourseModule.listForSemester(semester.id) : [];
  const courseIds = courses.map(c=>c.id);

  const rec = semester ? RecommendationEngine.cluster(semester.id, courseIds) : null;
  const reminder = (rec || !semester) ? null : ReminderEngine.nearest(semester.id, courseIds);
  const todaysSessions = semester ? WeeklyScheduleModule.todaysSessions(semester.id) : [];

  let whiteningPromptHtml = "";
  const isWeekendDay = [5,6].includes(new Date().getDay());
  if(isWeekendDay && semester){
    const allSessions = WeeklyScheduleModule.listForSemester(semester.id);
    const coursesWithSessions = courses.filter(c => allSessions.some(sess=>sess.courseId===c.id));
    if(coursesWithSessions.length){
      const weekStart = startOfThisWeek();
      const whitenedCount = coursesWithSessions.filter(c=>NotebookModule.get(c.id).notes.some(n=>n.createdAt>=weekStart)).length;
      if(whitenedCount < coursesWithSessions.length){
        whiteningPromptHtml = `
        <button type="button" class="callout" id="whiteningPromptCard" style="display:block; width:100%; text-align:start; margin-bottom:var(--sp-4); cursor:pointer;">

          <p class="type-body">${s.whiteningProgress(whitenedCount, coursesWithSessions.length)}</p>

      }
    }
  }

  let todaysClassesHtml = "";
  if(todaysSessions.length){
    todaysClassesHtml = `
      <div class="section-label">${s.todaysClassesLabel}</div>
      <div class="stack" style="margin-bottom:var(--sp-5);">
        ${todaysSessions.map(sess=>{
          const course = CourseModule.get(sess.courseId);
          const state = WeeklyScheduleModule.sessionState(sess);
          const stateLabel = state==="ended" ? s.sessionEndedLabel : state==="now" ? s.sessionNowLabel : s.sessionUpcomingLabel(sess.startTime);
          const stateColor = state==="ended" ? "color:var(--accent);" : state==="now" ? "color:var(--attention);" : "";
          return `
          <button type="button" class="card ${WeeklyScheduleModule.isImminent(sess)?'pulse-imminent':''}" ${course?`data-course-id="${course.id}" data-session-state="${state}"`:''} ${course?'':'style="cursor:default;"'}>
            <span class="card-icon">${ICON.weekGrid}</span>
            <span class="card-body">
              <span class="card-title">${course ? escapeHtml(course.name) : "—"}</span>
              <span class="card-meta">${escapeHtml(sess.startTime)} – ${escapeHtml(sess.endTime)} · <span style="${stateColor}">${stateLabel}</span></span>
            </span>
          </button>`;
        }).join("")}
      </div>`;
  }

  let secondaryHtml = "";
  if(rec){
    secondaryHtml = `
      <div class="section-label">${s.recommendationLabel}</div>
      <div class="card" style="cursor:default;">
        <span class="card-icon">${ICON.compass}</span>
        <span class="card-body">
          <span class="card-title">${s.clusterObservation(rec.count)}</span>
        </span>
      </div>`;
  } else if(reminder){
    const daysLabel = reminder.days===0 ? (lang()==='ar'?'اليوم':'Today') : reminder.days===1 ? (lang()==='ar'?'غدًا':'Tomorrow') : (lang()==='ar'?`خلال ${reminder.days} أيام`:`In ${reminder.days} days`);
    const course = reminder.event.courseId ? CourseModule.get(reminder.event.courseId) : null;
    const titleText = course ? `${escapeHtml(reminder.event.title)} — ${escapeHtml(course.name)}` : escapeHtml(reminder.event.title);
    let sessionsNote = "";
    let dayGuidanceNote = "";

      if(remaining !== null) sessionsNote = `<span class="type-caption" style="color:var(--accent); display:block; margin-top:2px;">${s.sessionsRemainingLabel(remaining)}</span>`;
      if(reminder.days<=3){

            <div class="empty-title">${s.semesterEmptyTitle}</div>

            <button type="button" class="btn btn-primary" id="todayAddCourse" style="margin-top:var(--sp-4); max-width:240px;">${s.addFirstCourse}</button>
            ${semester && semester.index > 1 ? `<button type="button" class="type-caption" id="newSemesterHint" style="margin-top:var(--sp-4); text-decoration:underline; background:none; border:none;">${s.newSemesterHint}</button>` : ""}
